<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Docker &amp; Nginx (a browser hits Nginx, which routes to the live green api container while blue idles, both backed by one Postgres under Compose). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1726"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2496ED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2496ED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7CC4FA"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#009639"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#2496ED"/>
    <g fill="#0E1726"><rect x="126" y="180" width="62" height="40" rx="5"/><rect x="126" y="224" width="62" height="6" rx="3"/></g>
    <g fill="#2496ED"><rect x="135" y="187" width="5" height="26" rx="2"/><rect x="147" y="187" width="5" height="26" rx="2"/><rect x="159" y="187" width="5" height="26" rx="2"/><rect x="171" y="187" width="5" height="26" rx="2"/></g>
    <circle cx="188" cy="178" r="11" fill="#009639" stroke="#2496ED" stroke-width="4"/>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#7CC4FA">DOCKER · NGINX</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Docker &amp; Nginx</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Ship a Service</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Images · Compose · Proxy · Blue-green</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CDE7FD">
      <rect x="110" y="660" width="201" height="52" rx="26" fill="#10213A" stroke="#2496ED"/>
      <text x="210.5" y="695" text-anchor="middle">multi-stage</text>
      <rect x="327" y="660" width="201" height="52" rx="26" fill="#10213A" stroke="#2496ED"/>
      <text x="427.5" y="695" text-anchor="middle">healthcheck</text>
      <rect x="544" y="660" width="187" height="52" rx="26" fill="#10213A" stroke="#2496ED"/>
      <text x="637.5" y="695" text-anchor="middle">proxy_pass</text>
    </g>
  </g>

  <!-- One server: browser to Nginx, blue/green api containers, Postgres -->
  <g id="art" font-family="Consolas, Menlo, monospace">
    <rect x="1095" y="150" width="220" height="84" rx="12" fill="#121B2B" stroke="#3A5578" stroke-width="2"/>
    <path d="M1095 176 H1315" stroke="#3A5578" stroke-width="2"/>
    <circle cx="1113" cy="163" r="5" fill="#6F6A80"/><circle cx="1129" cy="163" r="5" fill="#6F6A80"/><circle cx="1145" cy="163" r="5" fill="#6F6A80"/>
    <text x="1205" y="216" font-size="22" fill="#B8B2C8" text-anchor="middle">browser</text>
    <path d="M1205 234 V300" stroke="#6F6A80" stroke-width="3" marker-end="url(#arrowMuted)"/>
    <text x="1222" y="274" font-size="20" fill="#8C8399">:443</text>
    <rect x="896" y="286" width="618" height="530" rx="22" fill="none" stroke="#2B4A75" stroke-width="2" stroke-dasharray="10 8"/>
    <rect x="1055" y="306" width="300" height="84" rx="14" fill="#0F2219" stroke="#009639" stroke-width="3"/>
    <text x="1205" y="342" font-size="26" font-weight="700" fill="#6FD49A" text-anchor="middle">nginx</text>
    <text x="1205" y="372" font-size="18" fill="#B8B2C8" text-anchor="middle">proxy · cache · limits</text>
    <path d="M1120 390 L1046 462" stroke="#6F6A80" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowMuted)"/>
    <path d="M1290 390 L1364 462" stroke="#009639" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="1205" y="440" font-size="20" fill="#8C8399" text-anchor="middle">upstream</text>
    <rect x="920" y="470" width="240" height="120" rx="14" fill="#10213A" stroke="#2496ED" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="1040" y="522" font-size="24" font-weight="700" fill="#7CC4FA" text-anchor="middle">api:v1</text>
    <text x="1040" y="558" font-size="20" fill="#8C8399" text-anchor="middle">blue · idle</text>
    <rect x="1250" y="470" width="240" height="120" rx="14" fill="#0F2219" stroke="#009639" stroke-width="3"/>
    <text x="1370" y="522" font-size="24" font-weight="700" fill="#6FD49A" text-anchor="middle">api:v2</text>
    <text x="1370" y="558" font-size="20" fill="#B8B2C8" text-anchor="middle">green</text>
    <rect x="1404" y="454" width="78" height="32" rx="16" fill="#009639"/>
    <text x="1443" y="477" font-size="18" font-weight="700" fill="#0D0B13" text-anchor="middle">LIVE</text>
    <path d="M1040 590 L1136 656" stroke="#6F6A80" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowMuted)"/>
    <path d="M1370 590 L1274 656" stroke="#7CC4FA" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1095 680 V770 A110 22 0 0 0 1315 770 V680 Z" fill="#10213A" stroke="#2496ED" stroke-width="2"/>
    <path d="M1095 680 A110 22 0 0 1 1315 680 A110 22 0 0 1 1095 680 Z" fill="#2496ED" fill-opacity="0.85" stroke="#2496ED" stroke-width="2"/>
    <text x="1205" y="738" font-size="24" font-weight="700" fill="#F4F2F8" text-anchor="middle">postgres</text>
    <text x="1205" y="768" font-size="18" fill="#B8B2C8" text-anchor="middle">volume: pgdata</text>
    <text x="904" y="852" font-size="20" letter-spacing="3" fill="#7CC4FA">DOCKER COMPOSE · ONE SERVER</text>
  </g>
</svg>
