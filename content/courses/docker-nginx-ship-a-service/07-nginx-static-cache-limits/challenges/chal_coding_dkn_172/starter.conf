# Rice Rocket: /etc/nginx/conf.d/default.conf in the nginx container.
upstream api {
    server api:3000;
}

# 10 MB of zone memory holds about 160,000 client IPs.
# [ ] Define the login rate: 10 a minute per client IP

server {
    listen 80;
    server_name ricerocket.vn;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # App routes: a real file, else the SPA shell (the browser URL stays /orders/42).
    # [ ] Serve the file, else the app shell

    # The shell names the current hashed bundles.
    # [ ] Make index.html revalidate on every load

    # Hashed file names never change content.
    # [ ] Cache hashed assets for a year, never as HTML

    # [ ] Proxy the api, rate-limit only the login
}
