# Rice Rocket: /etc/nginx/conf.d/default.conf in the nginx container.
# The api listens on api:3000 and serves /orders, /reports/..., without the /api prefix.
# [ ] Name the api container as an upstream

server {
    listen 80;
    listen 443 ssl;
    server_name ricerocket.vn;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;

    # Server level: every location below inherits these, as long as it sets none of its own.
    # [ ] Pass the client's host, address and scheme

    location / {
        try_files $uri $uri/ /index.html;
    }

    # [ ] Send /api/ requests to the api without the prefix

    # Exports take up to 4 minutes; only this location waits longer.
    # [ ] Let report exports wait up to 300 s
}
