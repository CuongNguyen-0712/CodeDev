# Rice Rocket: /etc/nginx/conf.d/default.conf in the nginx container.
# The api listens on api:3000 and serves /orders, /reports/..., without the /api prefix.
# @piece upstream-api: Name the api container as an upstream
upstream api {
    server api:3000;
}
# @end

server {
    listen 80;
    listen 443 ssl;
    server_name ricerocket.vn;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;

    # Server level: every location below inherits these, as long as it sets none of its own.
    # @piece forwarded-headers: Pass the client's host, address and scheme
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # @end

    location / {
        try_files $uri $uri/ /index.html;
    }

    # @piece api-location: Send /api/ requests to the api without the prefix
    location /api/ {
        proxy_pass http://api/;
    }
    # @end

    # Exports take up to 4 minutes; only this location waits longer.
    # @piece reports-location: Let report exports wait up to 300 s
    location /api/reports/ {
        proxy_pass http://api/reports/;
        proxy_read_timeout 300s;
    }
    # @end
}
