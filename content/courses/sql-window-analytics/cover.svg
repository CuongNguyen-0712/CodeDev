<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: SQL for analysts (a running total computed per partition with a window function). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1620"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#336791" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#336791" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CC3E6"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#336791"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3DBE7B"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <ellipse cx="158" cy="164" rx="44" ry="14" fill="#9CC3E6"/>
    <path d="M114 164 V230 a44 14 0 0 0 88 0 V164 a44 14 0 0 1 -88 0z" fill="#336791"/>
    <path d="M114 186 a44 14 0 0 0 88 0 M114 208 a44 14 0 0 0 88 0" fill="none" stroke="#0E1620" stroke-width="4"/>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#9CC3E6">SQL · ANALYTICS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">SQL for</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Analysts</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Windows · Cohorts · Funnels · Dedup</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CFE2F4">
      <rect x="110" y="660" width="164" height="52" rx="26" fill="#13202E" stroke="#336791"/>
      <text x="192" y="695" text-anchor="middle">OVER ()</text>
      <rect x="290" y="660" width="107" height="52" rx="26" fill="#13202E" stroke="#336791"/>
      <text x="343.5" y="695" text-anchor="middle">LAG</text>
      <rect x="413" y="660" width="207" height="52" rx="26" fill="#13202E" stroke="#336791"/>
      <text x="516.5" y="695" text-anchor="middle">ROW_NUMBER</text>
      <rect x="636" y="660" width="150" height="52" rx="26" fill="#13202E" stroke="#336791"/>
      <text x="711" y="695" text-anchor="middle">cohort</text>
    </g>
  </g>

  <!-- SUM() OVER a partition: each user's running total restarts when the partition changes -->
  <g id="art" font-family="Consolas, Menlo, monospace">
    <text x="900" y="254" font-size="20" letter-spacing="3" fill="#9CC3E6">WINDOW FUNCTION</text>
    <rect x="900" y="272" width="630" height="56" rx="12" fill="#121C28" stroke="#336791" stroke-width="2"/>
    <text x="922" y="308" font-size="21" fill="#E8E4F2"><tspan fill="#82AAFF">SUM</tspan>(amt) <tspan fill="#C792EA">OVER</tspan> (<tspan fill="#C792EA">PARTITION BY</tspan> uid <tspan fill="#C792EA">ORDER BY</tspan> day)</text>
    <rect x="900" y="390" width="630" height="150" rx="10" fill="#336791" fill-opacity="0.22"/>
    <rect x="900" y="390" width="6" height="150" fill="#5B9BD5"/>
    <rect x="900" y="544" width="630" height="100" rx="10" fill="#F2C14E" fill-opacity="0.12"/>
    <rect x="900" y="544" width="6" height="100" fill="#F2C14E"/>
    <g font-size="18" letter-spacing="2">
    <text x="960" y="372" fill="#6F6A80" text-anchor="middle">UID</text>
    <text x="1080" y="372" fill="#6F6A80" text-anchor="middle">DAY</text>
    <text x="1200" y="372" fill="#6F6A80" text-anchor="middle">AMT</text>
    <text x="1320" y="372" fill="#6F6A80" text-anchor="middle">RN</text>
    <text x="1450" y="372" fill="#6F6A80" text-anchor="middle">RUNNING</text>
    </g>
    <g font-size="24">
    <text x="960" y="424" fill="#F4F2F8" text-anchor="middle">A</text>
    <text x="1080" y="424" fill="#F4F2F8" text-anchor="middle">1</text>
    <text x="1200" y="424" fill="#F4F2F8" text-anchor="middle">10</text>
    <text x="1320" y="424" fill="#F4F2F8" text-anchor="middle">1</text>
    <text x="1450" y="424" fill="#9CC3E6" font-weight="700" text-anchor="middle">10</text>
    <text x="960" y="474" fill="#F4F2F8" text-anchor="middle">A</text>
    <text x="1080" y="474" fill="#F4F2F8" text-anchor="middle">2</text>
    <text x="1200" y="474" fill="#F4F2F8" text-anchor="middle">5</text>
    <text x="1320" y="474" fill="#F4F2F8" text-anchor="middle">2</text>
    <text x="1450" y="474" fill="#9CC3E6" font-weight="700" text-anchor="middle">15</text>
    <text x="960" y="524" fill="#F4F2F8" text-anchor="middle">A</text>
    <text x="1080" y="524" fill="#F4F2F8" text-anchor="middle">4</text>
    <text x="1200" y="524" fill="#F4F2F8" text-anchor="middle">20</text>
    <text x="1320" y="524" fill="#F4F2F8" text-anchor="middle">3</text>
    <text x="1450" y="524" fill="#9CC3E6" font-weight="700" text-anchor="middle">35</text>
    <text x="960" y="578" fill="#F4F2F8" text-anchor="middle">B</text>
    <text x="1080" y="578" fill="#F4F2F8" text-anchor="middle">1</text>
    <text x="1200" y="578" fill="#F4F2F8" text-anchor="middle">7</text>
    <text x="1320" y="578" fill="#F4F2F8" text-anchor="middle">1</text>
    <text x="1450" y="578" fill="#F2C14E" font-weight="700" text-anchor="middle">7</text>
    <text x="960" y="628" fill="#F4F2F8" text-anchor="middle">B</text>
    <text x="1080" y="628" fill="#F4F2F8" text-anchor="middle">3</text>
    <text x="1200" y="628" fill="#F4F2F8" text-anchor="middle">3</text>
    <text x="1320" y="628" fill="#F4F2F8" text-anchor="middle">2</text>
    <text x="1450" y="628" fill="#F2C14E" font-weight="700" text-anchor="middle">10</text>
    </g>
    <text x="1530" y="682" font-size="20" fill="#F2C14E" text-anchor="end">restarts per partition</text>
  </g>
</svg>
