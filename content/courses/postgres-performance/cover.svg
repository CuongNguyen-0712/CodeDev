<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: PostgreSQL performance (an EXPLAIN plan where an index scan replaces a sequential scan). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1520"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#336791" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#336791" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#336791"/>
    <text x="158" y="214" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">PG</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#9DBFE0">POSTGRESQL · SQL</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">PostgreSQL</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Performance</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Query plans · Indexes · Faster queries</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#D3E3F2">
      <rect x="110" y="660" width="137" height="52" rx="26" fill="#131D29" stroke="#336791"/>
      <text x="178.6" y="695" text-anchor="middle">EXPLAIN</text>
      <rect x="263.2" y="660" width="106" height="52" rx="26" fill="#131D29" stroke="#336791"/>
      <text x="316.2" y="695" text-anchor="middle">index</text>
      <rect x="385.2" y="660" width="122" height="52" rx="26" fill="#131D29" stroke="#336791"/>
      <text x="446.0" y="695" text-anchor="middle">keyset</text>
    </g>
  </g>

  <g id="art" font-family="Consolas, Menlo, monospace">
    <rect x="880" y="230" width="560" height="170" rx="14" fill="#1F1418" stroke="#F2555A" stroke-width="2"/>
    <text x="905" y="268" font-size="20" fill="#F2B8BA" text-anchor="start">Seq Scan on users</text>
    <text x="905" y="302" font-size="18" fill="#F2B8BA" text-anchor="start">Filter: lower(email) = $1</text>
    <text x="905" y="336" font-size="18" fill="#F2555A" text-anchor="start">rows=1 (est 2,400) · 912 ms</text>
    <text x="905" y="370" font-size="18" fill="#B8B2C8" text-anchor="start">Rows Removed by Filter: 1,204,331</text>
    <path d="M1160 404 V444" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="880" y="448" width="560" height="140" rx="14" fill="#13201A" stroke="#3DBE7B" stroke-width="2"/>
    <text x="905" y="486" font-size="18" fill="#9BE7BD" text-anchor="start">Index Scan using users_lower_email_idx</text>
    <text x="905" y="520" font-size="18" fill="#9BE7BD" text-anchor="start">Index Cond: lower(email) = $1</text>
    <text x="905" y="554" font-size="18" fill="#3DBE7B" text-anchor="start">rows=1 (est 1) · 0.07 ms</text>
  </g>
</svg>
