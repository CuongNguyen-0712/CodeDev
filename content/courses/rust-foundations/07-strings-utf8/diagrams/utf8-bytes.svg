<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">"Hội An" in memory: 6 characters, 8 bytes</text>
  <text x="40" y="82" font-size="16" fill="#475569">A Rust string is UTF-8. ASCII letters take 1 byte; Vietnamese letters with diacritics take 2 or 3.</text>

  <!-- characters row -->
  <text x="40" y="136" font-size="15" font-weight="700" fill="#334155">characters</text>
  <rect x="180" y="110" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="222" y="137" font-size="18" fill="#15803d">H</text>
  <rect x="280" y="110" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="423" y="137" font-size="18" fill="#15803d">ộ</text>
  <rect x="580" y="110" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="626" y="137" font-size="18" fill="#15803d">i</text>
  <rect x="680" y="110" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="704" y="137" font-size="14" fill="#15803d">space</text>
  <rect x="780" y="110" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="823" y="137" font-size="18" fill="#15803d">A</text>
  <rect x="880" y="110" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="924" y="137" font-size="18" fill="#15803d">n</text>

  <!-- bytes row -->
  <text x="40" y="196" font-size="15" font-weight="700" fill="#334155">bytes</text>
  <rect x="180" y="170" width="100" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="214" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">48</text>
  <rect x="280" y="170" width="100" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="314" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">E1</text>
  <rect x="380" y="170" width="100" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="414" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">BB</text>
  <rect x="480" y="170" width="100" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="514" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">99</text>
  <rect x="580" y="170" width="100" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="614" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">69</text>
  <rect x="680" y="170" width="100" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="714" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">20</text>
  <rect x="780" y="170" width="100" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="814" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">41</text>
  <rect x="880" y="170" width="100" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="914" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">6E</text>

  <!-- byte indexes -->
  <text x="40" y="240" font-size="15" font-weight="700" fill="#334155">byte index</text>
  <text x="176" y="240" font-size="14" fill="#15803d">0</text>
  <text x="276" y="240" font-size="14" fill="#15803d">1</text>
  <text x="376" y="240" font-size="14" fill="#b91c1c">2</text>
  <text x="476" y="240" font-size="14" fill="#b91c1c">3</text>
  <text x="576" y="240" font-size="14" fill="#15803d">4</text>
  <text x="676" y="240" font-size="14" fill="#15803d">5</text>
  <text x="776" y="240" font-size="14" fill="#15803d">6</text>
  <text x="876" y="240" font-size="14" fill="#15803d">7</text>
  <text x="976" y="240" font-size="14" fill="#15803d">8</text>
  <text x="1010" y="134" font-size="14" fill="#475569">chars().count() = 6</text>
  <text x="1010" y="196" font-size="14" fill="#475569">len() = 8</text>
  <text x="180" y="270" font-size="14" fill="#475569">Green indexes are char boundaries. A slice may only start or end there; 2 and 3 are inside 'ộ'.</text>

  <!-- tools -->
  <rect x="40" y="296" width="540" height="300" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="328" font-size="17" font-weight="700" fill="#b91c1c">Counts or cuts bytes</text>
  <text x="64" y="366" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">&amp;s[0..4]</text>
  <text x="250" y="366" font-size="14" fill="#334155">"Hộ": fine, 4 is a boundary</text>
  <text x="64" y="400" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">&amp;s[0..2]</text>
  <text x="250" y="400" font-size="14" fill="#b91c1c">panic: byte index 2 is not</text>
  <text x="250" y="420" font-size="14" fill="#b91c1c">a char boundary</text>
  <text x="64" y="456" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">s.len()</text>
  <text x="250" y="456" font-size="14" fill="#334155">8: right for buffers and limits</text>
  <text x="250" y="476" font-size="14" fill="#334155">in bytes, wrong for column widths</text>
  <text x="64" y="512" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">s[0]</text>
  <text x="250" y="512" font-size="14" fill="#334155">does not compile (E0277)</text>
  <text x="64" y="560" font-size="14" fill="#7f1d1d">Every test passes on ASCII text, where bytes and</text>
  <text x="64" y="580" font-size="14" fill="#7f1d1d">characters happen to be the same.</text>

  <rect x="620" y="296" width="540" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="328" font-size="17" font-weight="700" fill="#15803d">Counts or cuts characters</text>
  <text x="644" y="366" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">s.chars().count()</text>
  <text x="900" y="366" font-size="14" fill="#334155">6</text>
  <text x="644" y="400" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">s.chars().take(2)</text>
  <text x="900" y="400" font-size="14" fill="#334155">"Hộ" after .collect()</text>
  <text x="644" y="434" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">s.char_indices()</text>
  <text x="900" y="434" font-size="14" fill="#334155">(0,'H') (1,'ộ') (4,'i') ...</text>
  <text x="644" y="468" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">format!("{:&lt;10}", s)</text>
  <text x="900" y="468" font-size="14" fill="#334155">pads to 10 characters</text>
  <text x="644" y="502" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">format!("{:.2}", s)</text>
  <text x="900" y="502" font-size="14" fill="#334155">"Hộ": at most 2 chars</text>
  <text x="644" y="560" font-size="14" fill="#14532d">Use these for anything a person reads: labels,</text>
  <text x="644" y="580" font-size="14" fill="#14532d">columns, previews, "first n letters".</text>
</svg>
