<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Option and Result: the value might not be there</text>
  <text x="40" y="82" font-size="16" fill="#475569">Both are enums. You cannot use the value inside until you say what happens in the other case.</text>

  <!-- Option -->
  <rect x="40" y="106" width="540" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="140" font-size="18" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">Option&lt;T&gt;</text>
  <text x="64" y="166" font-size="14" fill="#475569">"there may be no value", no reason needed</text>
  <text x="64" y="200" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">Some(value)</text>
  <text x="260" y="200" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">None</text>
  <text x="64" y="236" font-size="14" fill="#475569">routes.get(7), line.split_once(','), "DN-07".strip_prefix("HA-")</text>

  <!-- Result -->
  <rect x="620" y="106" width="540" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="644" y="140" font-size="18" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">Result&lt;T, E&gt;</text>
  <text x="644" y="166" font-size="14" fill="#475569">"this can fail, and here is why"</text>
  <text x="644" y="200" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">Ok(value)</text>
  <text x="840" y="200" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">Err(error)</text>
  <text x="644" y="236" font-size="14" fill="#475569">"12O0".parse::&lt;u32&gt;(), reading a file, a network call</text>

  <!-- converters -->
  <text x="40" y="292" font-size="15" fill="#334155">Convert between them:</text>
  <text x="240" y="292" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">option.ok_or(err)</text>
  <text x="440" y="292" font-size="15" fill="#475569">gives a Result,</text>
  <text x="600" y="292" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">result.ok()</text>
  <text x="730" y="292" font-size="15" fill="#475569">gives an Option (the reason is dropped).</text>

  <text x="40" y="336" font-size="18" font-weight="700" fill="#0f172a">What to do with the None or the Err</text>

  <!-- panic -->
  <rect x="40" y="356" width="270" height="200" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="388" font-size="15" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">unwrap() / expect("..")</text>
  <text x="60" y="420" font-size="14" fill="#334155">Panic: the program stops.</text>
  <text x="60" y="444" font-size="14" fill="#334155">One bad line loses the batch.</text>
  <text x="60" y="480" font-size="14" fill="#475569">For tests, examples, and values</text>
  <text x="60" y="502" font-size="14" fill="#475569">that cannot be missing unless</text>
  <text x="60" y="524" font-size="14" fill="#475569">the program itself is wrong.</text>

  <!-- handle -->
  <rect x="330" y="356" width="270" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="388" font-size="15" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">match / if let / let-else</text>
  <text x="350" y="420" font-size="14" fill="#334155">Handle it here:</text>
  <text x="350" y="444" font-size="14" fill="#334155">reject the line, log it,</text>
  <text x="350" y="468" font-size="14" fill="#334155">carry on with the next one.</text>
  <text x="350" y="502" font-size="14" fill="#475569">Where you know what the</text>
  <text x="350" y="524" font-size="14" fill="#475569">failure means for the user.</text>

  <!-- ? -->
  <rect x="620" y="356" width="270" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="388" font-size="15" font-weight="700" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">value?</text>
  <text x="640" y="420" font-size="14" fill="#334155">Pass it up: return the</text>
  <text x="640" y="444" font-size="14" fill="#334155">Err (or None) to the caller</text>
  <text x="640" y="468" font-size="14" fill="#334155">right now, else unwrap Ok.</text>
  <text x="640" y="502" font-size="14" fill="#475569">The function must return</text>
  <text x="640" y="524" font-size="14" fill="#475569">Result (or Option) itself.</text>

  <!-- default -->
  <rect x="910" y="356" width="250" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="930" y="388" font-size="15" font-weight="700" fill="#b45309" font-family="Consolas, 'Courier New', monospace">unwrap_or(default)</text>
  <text x="930" y="420" font-size="14" fill="#334155">Use a fallback value.</text>
  <text x="930" y="444" font-size="14" fill="#334155">Fine for a missing setting,</text>
  <text x="930" y="468" font-size="14" fill="#334155">wrong for a weight:</text>
  <text x="930" y="492" font-size="14" fill="#334155">0 g hides the bad line.</text>

  <text x="40" y="600" font-size="15" fill="#334155">Change the error on the way up:</text>
  <text x="290" y="600" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">raw.parse().map_err(|e| format!("bad weight '{raw}': {e}"))?</text>
  <text x="40" y="630" font-size="14" fill="#64748b">map_err turns the library's error into your own message or enum; the Ok value passes through untouched.</text>
</svg>
