<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: DevOps foundations (CI pipeline stages, container image layers, metrics with an alert). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1726"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2496ED" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2496ED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7CC4FA"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2496ED"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#2496ED"/>
    <g fill="#0E1726"><rect x="128" y="196" width="18" height="16" rx="3"/><rect x="149" y="196" width="18" height="16" rx="3"/><rect x="170" y="196" width="18" height="16" rx="3"/><rect x="138" y="176" width="18" height="16" rx="3"/><rect x="159" y="176" width="18" height="16" rx="3"/><path d="M124 218 H192 q-6 14 -34 14 q-28 0 -34 -14z"/></g>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#7CC4FA">DEVOPS · FOUNDATIONS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Containers, CI/CD</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">&amp; Observability</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Linux · Images · Pipelines · Metrics</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CDE7FD">
      <rect x="110" y="660" width="150" height="52" rx="26" fill="#10213A" stroke="#2496ED"/>
      <text x="185" y="695" text-anchor="middle">docker</text>
      <rect x="276" y="660" width="178" height="52" rx="26" fill="#10213A" stroke="#2496ED"/>
      <text x="365" y="695" text-anchor="middle">CI cache</text>
      <rect x="470" y="660" width="178" height="52" rx="26" fill="#10213A" stroke="#2496ED"/>
      <text x="559" y="695" text-anchor="middle">rollback</text>
    </g>
  </g>

  <!-- Commit to production: pipeline stages, container image layers and a latency alert -->
  <g id="art">
    <text x="904" y="252" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#7CC4FA" text-anchor="start">PIPELINE</text>
    <path d="M976 320 H1084 M1156 320 H1264 M1336 320 H1444" stroke="#2496ED" stroke-width="5"/>
    <circle cx="940" cy="320" r="36" fill="#2496ED" fill-opacity="0.9" stroke="#2496ED" stroke-width="3"/>
    <path d="M926 320 L936 331 L955 309" fill="none" stroke="#0E1726" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="940" y="392" font-family="Consolas, Menlo, monospace" font-size="22" fill="#B8B2C8" text-anchor="middle">commit</text>
    <circle cx="1120" cy="320" r="36" fill="#2496ED" fill-opacity="0.9" stroke="#2496ED" stroke-width="3"/>
    <path d="M1106 320 L1116 331 L1135 309" fill="none" stroke="#0E1726" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1120" y="392" font-family="Consolas, Menlo, monospace" font-size="22" fill="#B8B2C8" text-anchor="middle">build</text>
    <circle cx="1300" cy="320" r="36" fill="#2496ED" fill-opacity="0.9" stroke="#2496ED" stroke-width="3"/>
    <path d="M1286 320 L1296 331 L1315 309" fill="none" stroke="#0E1726" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1300" y="392" font-family="Consolas, Menlo, monospace" font-size="22" fill="#B8B2C8" text-anchor="middle">test</text>
    <circle cx="1480" cy="320" r="36" fill="#121B2B" fill-opacity="1" stroke="#2496ED" stroke-width="3"/>
    <circle cx="1480" cy="320" r="10" fill="#F2C14E"/>
    <text x="1480" y="392" font-family="Consolas, Menlo, monospace" font-size="22" fill="#B8B2C8" text-anchor="middle">deploy</text>
    <text x="904" y="470" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#7CC4FA" text-anchor="start">IMAGE</text>
    <rect x="904" y="490" width="220" height="44" rx="8" fill="#2496ED" fill-opacity="0.9"/>
    <rect x="904" y="540" width="220" height="44" rx="8" fill="#2496ED" fill-opacity="0.6"/>
    <rect x="904" y="590" width="220" height="44" rx="8" fill="#2496ED" fill-opacity="0.35"/>
    <text x="1014" y="520" font-family="Consolas, Menlo, monospace" font-size="22" fill="#0E1726" text-anchor="middle" font-weight="700">app</text>
    <text x="1014" y="570" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F4F2F8" text-anchor="middle">deps (cached)</text>
    <text x="1014" y="620" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F4F2F8" text-anchor="middle">base</text>
    <text x="1180" y="470" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#7CC4FA" text-anchor="start">P95 LATENCY</text>
    <rect x="1180" y="490" width="350" height="144" rx="12" fill="#121B2B" stroke="#264468" stroke-width="2"/>
    <path d="M1196 550 H1514" stroke="#F2555A" stroke-width="2" stroke-dasharray="6 6"/>
    <polyline points="1196,606 1236,598 1276,604 1316,592 1356,600 1396,594 1426,530 1456,520 1486,596 1514,600" fill="none" stroke="#7CC4FA" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="1441" cy="525" r="9" fill="#F2555A"/>
  </g>
</svg>
