<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#0f172a">The average hides the slow requests. Percentiles point at them.</text>
  <text x="40" y="80" font-size="16" fill="#475569">20 checkout requests, sorted from fastest to slowest. Durations in milliseconds.</text>

  <!-- Left: sorted samples -->
  <rect x="40" y="104" width="640" height="516" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="136" font-size="17" font-weight="700" fill="#0f172a">Nearest rank: rank = ceil(p x n / 100)</text>

  <text x="64" y="170" font-size="12" fill="#64748b">rank 1</text>
  <text x="600" y="170" font-size="12" fill="#64748b">rank 10</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#334155" text-anchor="middle">
    <rect x="64" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="90" y="205">128</text>
    <rect x="120" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="146" y="205">132</text>
    <rect x="176" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="202" y="205">136</text>
    <rect x="232" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="258" y="205">139</text>
    <rect x="288" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="205">140</text>
    <rect x="344" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="370" y="205">142</text>
    <rect x="400" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="426" y="205">144</text>
    <rect x="456" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="482" y="205">145</text>
    <rect x="512" y="180" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="538" y="205">148</text>
    <rect x="568" y="180" width="52" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="594" y="205" fill="#1d4ed8" font-weight="700">149</text>

    <rect x="64" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="90" y="295">150</text>
    <rect x="120" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="146" y="295">152</text>
    <rect x="176" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="202" y="295">155</text>
    <rect x="232" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="258" y="295">158</text>
    <rect x="288" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="295">161</text>
    <rect x="344" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="370" y="295">165</text>
    <rect x="400" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="426" y="295">170</text>
    <rect x="456" y="270" width="52" height="40" rx="5" fill="#ffffff" stroke="#94a3b8"/><text x="482" y="295">190</text>
    <rect x="512" y="270" width="52" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="538" y="295" fill="#b91c1c" font-weight="700">4100</text>
    <rect x="568" y="270" width="52" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="594" y="295" fill="#b91c1c" font-weight="700">4300</text>
  </g>
  <text x="64" y="260" font-size="12" fill="#64748b">rank 11</text>
  <text x="600" y="260" font-size="12" fill="#64748b">rank 20</text>

  <text x="594" y="240" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">p50</text>
  <text x="538" y="330" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">p95</text>
  <text x="594" y="330" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">p99</text>

  <rect x="64" y="352" width="592" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="84" y="380" font-size="15" font-weight="700" fill="#b91c1c">average = 555 ms</text>
  <text x="84" y="406" font-size="13" fill="#7f1d1d">Not one request took 555 ms. 18 took under 200 ms, 2 took over 4 s.</text>

  <rect x="64" y="446" width="592" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="84" y="474" font-size="15" font-weight="700" fill="#15803d">percentiles, n = 20</text>
  <text x="84" y="502" font-size="13" fill="#334155">p50: rank ceil(50 x 20 / 100) = 10, value 149 ms (half are faster)</text>
  <text x="84" y="528" font-size="13" fill="#334155">p95: rank ceil(95 x 20 / 100) = 19, value 4100 ms</text>
  <text x="84" y="554" font-size="13" fill="#334155">p99: rank ceil(99 x 20 / 100) = 20, value 4300 ms</text>
  <text x="84" y="580" font-size="13" font-weight="700" fill="#15803d">2 checkouts in 20 waited over 4 seconds: p95 shows it.</text>

  <!-- Right: do not average percentiles -->
  <rect x="710" y="104" width="450" height="516" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="734" y="136" font-size="17" font-weight="700" fill="#0f172a">Never average percentiles</text>

  <rect x="734" y="160" width="190" height="84" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="752" y="188" font-size="14" font-weight="700" fill="#334155">server A</text>
  <text x="752" y="210" font-size="13" fill="#475569">900 requests</text>
  <text x="752" y="232" font-size="13" fill="#475569">p95 = 120 ms</text>
  <rect x="946" y="160" width="190" height="84" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="964" y="188" font-size="14" font-weight="700" fill="#334155">server B</text>
  <text x="964" y="210" font-size="13" fill="#475569">100 requests</text>
  <text x="964" y="232" font-size="13" fill="#475569">p95 = 4000 ms</text>

  <rect x="734" y="268" width="402" height="128" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="754" y="296" font-size="15" font-weight="700" fill="#b91c1c">(120 + 4000) / 2 = 2060 ms</text>
  <text x="754" y="322" font-size="13" fill="#7f1d1d">The mean of two p95s is not a p95</text>
  <text x="754" y="344" font-size="13" fill="#7f1d1d">of anything. It ignores that A served</text>
  <text x="754" y="366" font-size="13" fill="#7f1d1d">9 times more requests than B.</text>

  <rect x="734" y="412" width="402" height="184" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="754" y="440" font-size="15" font-weight="700" fill="#15803d">Merge, then rank: p95 = 200 ms</text>
  <text x="754" y="466" font-size="13" fill="#334155">All 1000 samples, sorted: rank 950.</text>
  <text x="754" y="490" font-size="13" fill="#334155">B had 50 requests at 4000 ms and 50 at</text>
  <text x="754" y="512" font-size="13" fill="#334155">200 ms; A never went above 180 ms.</text>
  <text x="754" y="536" font-size="13" fill="#334155">Ranks 951-1000 are B's slow 50.</text>
  <text x="754" y="566" font-size="13" font-weight="700" fill="#15803d">Keep raw samples or histogram buckets,</text>
  <text x="754" y="586" font-size="13" font-weight="700" fill="#15803d">which can be added up across servers.</text>
</svg>
