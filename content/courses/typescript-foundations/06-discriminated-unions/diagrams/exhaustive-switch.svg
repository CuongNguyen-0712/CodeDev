<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A switch on the tag removes one member per case. What is left must be never.</text>
  <text x="40" y="82" font-size="16" fill="#475569">type Payment = card | cod | bank | momo, told apart by the literal type of method</text>

  <!-- union -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="14">
    <rect x="40" y="110" width="270" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="56" y="138" fill="#1d4ed8">method: "card"; last4</text>
    <rect x="320" y="110" width="270" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="336" y="138" fill="#1d4ed8">method: "cod"</text>
    <rect x="600" y="110" width="270" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="616" y="138" fill="#1d4ed8">method: "bank"; reference</text>
    <rect x="880" y="110" width="280" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="896" y="138" fill="#92400e">method: "momo"; phone  (new)</text>
  </g>

  <!-- switch rows -->
  <text x="40" y="200" font-size="15" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">switch (p.method) {</text>
  <g font-size="14">
    <text x="60" y="236" fill="#334155" font-family="Consolas, 'Courier New', monospace">case "card":</text>
    <text x="250" y="236" fill="#475569">p is the card member: p.last4 is allowed</text>
    <text x="760" y="236" fill="#64748b">left: cod | bank | momo</text>
    <text x="60" y="268" fill="#334155" font-family="Consolas, 'Courier New', monospace">case "cod":</text>
    <text x="250" y="268" fill="#475569">p is the cod member: p.last4 is TS2339</text>
    <text x="760" y="268" fill="#64748b">left: bank | momo</text>
    <text x="60" y="300" fill="#334155" font-family="Consolas, 'Courier New', monospace">case "bank":</text>
    <text x="250" y="300" fill="#475569">p is the bank member</text>
    <text x="760" y="300" fill="#64748b">left: momo</text>
    <text x="60" y="332" fill="#334155" font-family="Consolas, 'Courier New', monospace">default:</text>
    <text x="250" y="332" fill="#334155" font-family="Consolas, 'Courier New', monospace">return assertNever(p);</text>
    <text x="760" y="332" fill="#b91c1c" font-weight="700">left: momo, not never</text>
  </g>
  <text x="40" y="364" font-size="15" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">}</text>

  <rect x="40" y="390" width="1120" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="420" font-size="15" font-weight="700" fill="#b91c1c">error TS2345 at the default</text>
  <text x="60" y="446" font-size="14" fill="#7f1d1d">Argument of type '{ method: "momo"; amount: number; phone: string; }' is not assignable to parameter of type 'never'.</text>

  <!-- three nets -->
  <text x="40" y="508" font-size="17" font-weight="700" fill="#0f172a">Three ways the checker finds the forgotten case</text>
  <rect x="40" y="524" width="360" height="146" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="552" font-size="15" font-weight="700" fill="#15803d">assertNever in the default</text>
  <text x="58" y="578" font-size="13" fill="#166534" font-family="Consolas, 'Courier New', monospace">function assertNever(v: never): never</text>
  <text x="58" y="604" font-size="13" fill="#166534">every switch, any return type;</text>
  <text x="58" y="624" font-size="13" fill="#166534">also throws if bad data arrives</text>
  <text x="58" y="644" font-size="13" fill="#166534">at runtime</text>

  <rect x="420" y="524" width="360" height="146" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="438" y="552" font-size="15" font-weight="700" fill="#15803d">a return type, no default</text>
  <text x="438" y="578" font-size="13" fill="#166534" font-family="Consolas, 'Courier New', monospace">function fee(p: Payment): number</text>
  <text x="438" y="604" font-size="13" fill="#166534">TS2366: Function lacks ending return</text>
  <text x="438" y="624" font-size="13" fill="#166534">statement and return type does not</text>
  <text x="438" y="644" font-size="13" fill="#166534">include 'undefined'.</text>

  <rect x="800" y="524" width="360" height="146" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="818" y="552" font-size="15" font-weight="700" fill="#15803d">a Record over the tags</text>
  <text x="818" y="578" font-size="13" fill="#166534" font-family="Consolas, 'Courier New', monospace">Record&lt;Payment["method"], number&gt;</text>
  <text x="818" y="604" font-size="13" fill="#166534">TS2741: Property 'momo' is missing</text>
  <text x="818" y="624" font-size="13" fill="#166534">for lookup tables of labels,</text>
  <text x="818" y="644" font-size="13" fill="#166534">rates and icons</text>
</svg>
