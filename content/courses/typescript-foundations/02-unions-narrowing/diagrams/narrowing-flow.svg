<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Narrowing: each check removes a member of the union</text>
  <text x="40" y="82" font-size="16" fill="#475569">The type checker follows your if statements and returns, and gives a variable a narrower type on each path</text>

  <!-- flow -->
  <rect x="40" y="112" width="620" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="140" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">const courier = couriers.find((c) =&gt; c.id === id);</text>
  <text x="60" y="164" font-size="14" fill="#475569">type of courier:</text>
  <rect x="190" y="148" width="190" height="24" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="166" font-size="14" font-weight="700" fill="#92400e" font-family="Consolas, 'Courier New', monospace">Courier | undefined</text>

  <line x1="350" y1="176" x2="350" y2="214" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <polygon points="350,218 520,262 350,306 180,262" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="350" y="267" font-size="15" text-anchor="middle" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">courier === undefined</text>

  <line x1="180" y1="262" x2="120" y2="262" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="262" x2="120" y2="350" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="70" y="252" font-size="14" font-weight="700" fill="#475569">true</text>
  <rect x="40" y="354" width="270" height="112" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="58" y="382" font-size="14" fill="#7f1d1d">here courier is</text>
  <rect x="172" y="366" width="100" height="24" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="182" y="384" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">undefined</text>
  <text x="58" y="414" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">return "courier C-03</text>
  <text x="58" y="436" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">  is not available";</text>
  <text x="58" y="456" font-size="12" fill="#7f1d1d">the path ends here</text>

  <line x1="520" y1="262" x2="580" y2="262" stroke="#475569" stroke-width="2"/>
  <line x1="580" y1="262" x2="580" y2="350" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="588" y="252" font-size="14" font-weight="700" fill="#475569">false</text>
  <rect x="390" y="354" width="270" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="408" y="382" font-size="14" fill="#166534">after the if, courier is</text>
  <rect x="408" y="392" width="84" height="24" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="418" y="410" font-size="14" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">Courier</text>
  <text x="408" y="440" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">courier.name  // ok</text>
  <text x="408" y="458" font-size="12" fill="#166534">only reachable when it is a Courier</text>

  <rect x="40" y="496" width="620" height="170" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="60" y="526" font-size="16" font-weight="700" fill="#c2410c">Without the check</text>
  <text x="60" y="554" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">courier.name</text>
  <text x="260" y="554" font-size="14" fill="#7c2d12">error TS18048: 'courier' is possibly 'undefined'</text>
  <text x="60" y="584" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">courier!.name</text>
  <text x="260" y="584" font-size="14" fill="#7c2d12">compiles: ! removes undefined from the type,</text>
  <text x="260" y="604" font-size="14" fill="#7c2d12">not from the value. Same TypeError at runtime.</text>
  <text x="60" y="636" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">courier?.name</text>
  <text x="260" y="636" font-size="14" fill="#7c2d12">compiles, type string | undefined: shows "undefined"</text>

  <!-- tools -->
  <rect x="700" y="112" width="460" height="554" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="722" y="144" font-size="17" font-weight="700" fill="#0f172a">Checks that narrow</text>
  <text x="722" y="182" font-size="14" font-weight="700" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">x === undefined, x !== null</text>
  <text x="722" y="204" font-size="13" fill="#475569">removes exactly that member</text>
  <text x="722" y="240" font-size="14" font-weight="700" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">if (x)</text>
  <text x="722" y="262" font-size="13" fill="#475569">removes null and undefined - and also 0, "" and NaN</text>
  <text x="722" y="298" font-size="14" font-weight="700" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">typeof x === "string"</text>
  <text x="722" y="320" font-size="13" fill="#475569">primitives: string, number, boolean, ...</text>
  <text x="722" y="356" font-size="14" font-weight="700" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">"store" in x</text>
  <text x="722" y="378" font-size="13" fill="#475569">object types told apart by a property</text>
  <text x="722" y="414" font-size="14" font-weight="700" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">Array.isArray(x)</text>
  <text x="722" y="436" font-size="13" fill="#475569">T[] versus everything else</text>
  <text x="722" y="472" font-size="14" font-weight="700" fill="#1d4ed8" font-family="Consolas, 'Courier New', monospace">x ?? fallback</text>
  <text x="722" y="494" font-size="13" fill="#475569">fallback only for null and undefined; 0 stays 0</text>
  <line x1="722" y1="520" x2="1138" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <text x="722" y="552" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">x || fallback</text>
  <text x="722" y="574" font-size="13" fill="#7f1d1d">also replaces 0 and "": the ETA 0 bug</text>
  <text x="722" y="610" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">x!</text>
  <text x="722" y="632" font-size="13" fill="#7f1d1d">no check at all: a promise the checker cannot verify</text>
</svg>
