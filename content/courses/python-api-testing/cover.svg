<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: API and contract testing in Python (request, response validated against a schema, test run). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3776AB" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3776AB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFD43B"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3776AB"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="146" width="62" height="62" rx="16" fill="#3776AB"/>
    <rect x="142" y="176" width="62" height="62" rx="16" fill="#FFD43B"/>
    <circle cx="132" cy="166" r="6" fill="#0F1724"/>
    <circle cx="184" cy="218" r="6" fill="#0F1724"/>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#FFD43B">PYTHON · API TESTING</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">API &amp; Contract</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Testing</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Contracts · Schemas · Idempotency · CI</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CFE0F4">
      <rect x="110" y="660" width="150" height="52" rx="26" fill="#14223A" stroke="#3776AB"/>
      <text x="185" y="695" text-anchor="middle">pytest</text>
      <rect x="276" y="660" width="150" height="52" rx="26" fill="#14223A" stroke="#3776AB"/>
      <text x="351" y="695" text-anchor="middle">schema</text>
      <rect x="442" y="660" width="107" height="52" rx="26" fill="#14223A" stroke="#3776AB"/>
      <text x="495.5" y="695" text-anchor="middle">201</text>
      <rect x="565" y="660" width="136" height="52" rx="26" fill="#14223A" stroke="#3776AB"/>
      <text x="633" y="695" text-anchor="middle">retry</text>
    </g>
  </g>

  <!-- A request, its response checked field by field against the contract, and the test run -->
  <g id="art">
    <text x="900" y="254" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#FFD43B" text-anchor="start">REQUEST</text>
    <rect x="900" y="276" width="290" height="190" rx="16" fill="#141C2C" stroke="#2E4A70" stroke-width="2"/>
    <text x="922" y="318" font-family="Consolas, Menlo, monospace" font-size="24" fill="#FFD43B" font-weight="700">POST /orders</text>
    <text x="922" y="360" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >Idempotency-Key</text>
    <text x="922" y="396" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F4F2F8" >{ "sku": "A-1",</text>
    <text x="922" y="426" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F4F2F8" >  "qty": 2 }</text>
    <path d="M1196 370 H1240" stroke="#FFD43B" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1250" y="254" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#FFD43B" text-anchor="start">201 · CONTRACT</text>
    <rect x="1250" y="276" width="280" height="190" rx="16" fill="#141C2C" stroke="#3776AB" stroke-width="2"/>
    <text x="1270" y="316" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >Order schema</text>
    <text x="1270" y="360" font-family="Consolas, Menlo, monospace" font-size="21" fill="#F4F2F8" >id: uuid</text>
    <path d="M1484 352 l7 7 l14 -14" stroke="#3DBE7B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1270" y="390" font-family="Consolas, Menlo, monospace" font-size="21" fill="#F4F2F8" >total: int</text>
    <path d="M1484 382 l7 7 l14 -14" stroke="#3DBE7B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1270" y="420" font-family="Consolas, Menlo, monospace" font-size="21" fill="#F4F2F8" >status: enum</text>
    <path d="M1484 412 l7 7 l14 -14" stroke="#3DBE7B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1270" y="450" font-family="Consolas, Menlo, monospace" font-size="21" fill="#F4F2F8" >created: date</text>
    <path d="M1484 442 l7 7 l14 -14" stroke="#3DBE7B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="900" y="560" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#FFD43B" text-anchor="start">PYTEST</text>
    <circle cx="916" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.60"/>
    <circle cx="946" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.75"/>
    <circle cx="976" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.90"/>
    <circle cx="1006" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.60"/>
    <circle cx="1036" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.75"/>
    <circle cx="1066" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.90"/>
    <circle cx="1096" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.60"/>
    <circle cx="1126" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.75"/>
    <circle cx="1156" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.90"/>
    <circle cx="1186" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.60"/>
    <circle cx="1216" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.75"/>
    <circle cx="1246" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.90"/>
    <circle cx="1276" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.60"/>
    <circle cx="1306" cy="610" r="10" fill="#3DBE7B" fill-opacity="0.75"/>
    <text x="1350" y="618" font-family="Consolas, Menlo, monospace" font-size="24" fill="#3DBE7B" >14 passed</text>
  </g>
</svg>
