<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Shared list, read-only view, or own copy?</text>
  <text x="40" y="82" font-size="16" fill="#475569">What the Order holds after checkout, and what happens on cart.clear() or on order.lines().add(...)</text>

  <!-- Panel 1: shared -->
  <rect x="40" y="108" width="360" height="360" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="138" font-size="17" font-weight="700" fill="#b91c1c">1. No copy: one shared list</text>
  <text x="60" y="162" font-size="13" fill="#7f1d1d" font-family="Consolas, 'Courier New', monospace">new Order(id, cart)</text>
  <rect x="60" y="180" width="150" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="135" y="203" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">cart</text>
  <rect x="230" y="180" width="150" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="305" y="203" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">order.lines()</text>
  <line x1="135" y1="216" x2="135" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="305" y1="216" x2="305" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="316" width="320" height="52" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="338" font-size="13" font-weight="700" fill="#334155">ArrayList (the cart buffer)</text>
  <text x="80" y="358" font-size="13" fill="#475569" font-family="Consolas, 'Courier New', monospace">[9786041000011 x2]</text>
  <text x="60" y="400" font-size="13" fill="#7f1d1d">cart.clear(): the order loses its lines</text>
  <text x="60" y="422" font-size="13" fill="#7f1d1d">add(gift): works, and the cart gets it too</text>
  <text x="60" y="452" font-size="14" font-weight="700" fill="#b91c1c">Bug: two references, one list</text>

  <!-- Panel 2: view -->
  <rect x="420" y="108" width="360" height="360" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="138" font-size="17" font-weight="700" fill="#92400e">2. Read-only view</text>
  <text x="440" y="162" font-size="13" fill="#92400e" font-family="Consolas, 'Courier New', monospace">Collections.unmodifiableList(cart)</text>
  <rect x="440" y="180" width="150" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="515" y="203" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">cart</text>
  <rect x="610" y="180" width="150" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="685" y="203" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">order.lines()</text>
  <line x1="685" y1="216" x2="685" y2="238" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="610" y="240" width="150" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="685" y="265" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">read-only view</text>
  <line x1="515" y1="216" x2="515" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="280" x2="685" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="316" width="320" height="52" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="460" y="338" font-size="13" font-weight="700" fill="#334155">ArrayList (the cart buffer)</text>
  <text x="460" y="358" font-size="13" fill="#475569" font-family="Consolas, 'Courier New', monospace">[9786041000011 x2]</text>
  <text x="440" y="400" font-size="13" fill="#92400e">add(gift): UnsupportedOperationException</text>
  <text x="440" y="422" font-size="13" fill="#92400e">cart.clear(): the order still loses its lines</text>
  <text x="440" y="452" font-size="14" font-weight="700" fill="#92400e">Still leaks: a view is not a copy</text>

  <!-- Panel 3: copy -->
  <rect x="800" y="108" width="360" height="360" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="820" y="138" font-size="17" font-weight="700" fill="#15803d">3. Own copy</text>
  <text x="820" y="162" font-size="13" fill="#14532d" font-family="Consolas, 'Courier New', monospace">List.copyOf(cart)</text>
  <rect x="820" y="180" width="150" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="895" y="203" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">cart</text>
  <rect x="990" y="180" width="150" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1065" y="203" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">order.lines()</text>
  <line x1="895" y1="216" x2="895" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1065" y1="216" x2="1065" y2="314" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="820" y="316" width="150" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="840" y="338" font-size="13" font-weight="700" fill="#334155">ArrayList</text>
  <text x="840" y="358" font-size="12" fill="#475569">cleared, refilled</text>
  <rect x="990" y="316" width="150" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1010" y="338" font-size="13" font-weight="700" fill="#334155">unmodifiable</text>
  <text x="1010" y="358" font-size="12" fill="#475569" font-family="Consolas, 'Courier New', monospace">[...011 x2]</text>
  <text x="820" y="400" font-size="13" fill="#14532d">cart.clear(): the order keeps its lines</text>
  <text x="820" y="422" font-size="13" fill="#14532d">add(gift): UnsupportedOperationException</text>
  <text x="820" y="452" font-size="14" font-weight="700" fill="#15803d">Safe: two lists, one is frozen</text>

  <!-- Bottom -->
  <rect x="40" y="488" width="1120" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="520" font-size="15" font-weight="700" fill="#334155">An arrow is a reference. A copy is a new list; a view is a read-only window onto someone else's list.</text>
  <text x="64" y="550" font-size="13" fill="#475569">List.copyOf copies the references to the elements, not the elements, so make the elements immutable too (records of String, int, long).</text>
</svg>
