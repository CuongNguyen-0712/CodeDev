<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">The inventory report as a pipeline</text>
  <text x="40" y="82" font-size="16" fill="#475569">Each step does one job, so each bug from Monday has exactly one place where it is fixed.</text>

  <!-- 1. Raw lines -->
  <rect x="40" y="112" width="200" height="236" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="142" font-size="16" font-weight="700" fill="#0f172a">1. Raw lines</text>
  <text x="60" y="166" font-size="12" fill="#64748b">warehouse;isbn;title;</text>
  <text x="60" y="182" font-size="12" fill="#64748b">qty;reorderLevel</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#334155">
    <text x="60" y="212">978-604-1-11111-1</text>
    <text x="60" y="232">978 604 1 11111 1</text>
    <text x="60" y="252">9786041111111</text>
    <text x="60" y="272" fill="#b91c1c">...;two;4</text>
  </g>
  <text x="60" y="292" font-size="12" fill="#64748b">(blank line)</text>
  <text x="60" y="326" font-size="13" font-weight="700" fill="#334155">1 book, 3 spellings</text>

  <line x1="242" y1="230" x2="268" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Parse -->
  <rect x="270" y="112" width="200" height="236" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="142" font-size="16" font-weight="700" fill="#0f172a">2. Parse each line</text>
  <rect x="290" y="158" width="160" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="304" y="179" font-size="13" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">Ok(Item)</text>
  <rect x="290" y="200" width="160" height="32" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="304" y="221" font-size="13" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">Bad(line, why)</text>
  <text x="290" y="262" font-size="13" fill="#334155">sealed ParseResult</text>
  <text x="290" y="284" font-size="13" fill="#334155">compact constructor</text>
  <text x="290" y="306" font-size="13" fill="#334155">try/catch per line</text>
  <text x="290" y="328" font-size="13" fill="#334155">blank lines skipped</text>

  <line x1="472" y1="230" x2="498" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="476" y="220" font-size="11" fill="#15803d">Ok</text>

  <!-- 3. Merge -->
  <rect x="500" y="112" width="200" height="236" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="520" y="142" font-size="16" font-weight="700" fill="#0f172a">3. Merge by ISBN</text>
  <text x="520" y="172" font-size="13" fill="#334155">key = 13 digits only</text>
  <text x="520" y="194" font-size="13" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">9786041111111</text>
  <text x="520" y="224" font-size="13" fill="#334155">one entry per book</text>
  <text x="520" y="246" font-size="13" fill="#334155">per warehouse:</text>
  <text x="520" y="272" font-size="13" fill="#334155">qty: add up</text>
  <text x="520" y="294" font-size="13" fill="#334155">reorder: the highest</text>
  <text x="520" y="326" font-size="13" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">Map.merge(...)</text>

  <line x1="702" y1="230" x2="728" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Classify -->
  <rect x="730" y="112" width="200" height="236" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="750" y="142" font-size="16" font-weight="700" fill="#0f172a">4. Classify</text>
  <rect x="750" y="158" width="160" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="762" y="177" font-size="12" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">OUT_OF_STOCK</text>
  <text x="762" y="194" font-size="12" fill="#7f1d1d">qty == 0</text>
  <rect x="750" y="210" width="160" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="762" y="229" font-size="12" font-weight="700" fill="#92400e" font-family="Consolas, 'Courier New', monospace">LOW</text>
  <text x="762" y="246" font-size="12" fill="#92400e">qty &lt;= reorder level</text>
  <rect x="750" y="262" width="160" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="762" y="281" font-size="12" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">OK</text>
  <text x="762" y="298" font-size="12" fill="#14532d">otherwise</text>
  <text x="750" y="330" font-size="13" fill="#334155">enum + switch</text>

  <line x1="932" y1="230" x2="958" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Sorted report -->
  <rect x="960" y="112" width="200" height="236" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="980" y="142" font-size="16" font-weight="700" fill="#0f172a">5. Sorted report</text>
  <text x="980" y="172" font-size="13" fill="#334155">warehouses A to Z</text>
  <text x="980" y="194" font-size="13" fill="#334155">(TreeMap)</text>
  <text x="980" y="222" font-size="13" fill="#334155">books: status, then</text>
  <text x="980" y="244" font-size="13" fill="#334155">title (Comparator)</text>
  <text x="980" y="272" font-size="13" fill="#334155">Reorder list, totals</text>
  <text x="980" y="294" font-size="13" fill="#334155">Rejected lines</text>
  <text x="980" y="326" font-size="13" font-weight="700" fill="#15803d">unmodifiable List</text>

  <!-- Bad branch -->
  <line x1="370" y1="350" x2="370" y2="396" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="380" y="378" font-size="12" fill="#b91c1c">Bad: keep going</text>
  <rect x="270" y="398" width="430" height="68" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="290" y="424" font-size="14" font-weight="700" fill="#b91c1c">Rejected lines, in input order</text>
  <text x="290" y="450" font-size="13" fill="#7f1d1d" font-family="Consolas, 'Courier New', monospace">line 8: bad qty: two</text>
  <path d="M702,432 L1060,432 L1060,352" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="760" y="424" font-size="12" fill="#b91c1c">printed at the end of the report</text>

  <!-- Course map -->
  <rect x="40" y="496" width="1120" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="524" font-size="14" font-weight="700" fill="#334155">What each step reuses from the course</text>
  <text x="60" y="552" font-size="13" fill="#475569">records 1.2  |  enums and switch 1.3  |  Map and Set 2.1  |  streams 2.2  |  unmodifiable lists 2.3  |  sealed types 3.1  |  Optional 3.2  |  exceptions 4.1</text>
</svg>
