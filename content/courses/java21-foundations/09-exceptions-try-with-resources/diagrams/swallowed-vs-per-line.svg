<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One bad line: swallowed vs handled per line</text>
  <text x="40" y="82" font-size="16" fill="#475569">The same 5-line supplier file. Line 3 has the price "12O000" (a letter O), so Long.parseLong throws NumberFormatException.</text>

  <!-- Left panel: before -->
  <rect x="40" y="108" width="540" height="396" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="138" font-size="18" font-weight="700" fill="#b91c1c">Before: one try/catch around the whole loop</text>

  <rect x="64" y="150" width="492" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="173" font-size="14" font-weight="700" fill="#64748b" font-family="Consolas, 'Courier New', monospace">1</text>
  <text x="104" y="173" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">9786041234567;120000</text>
  <text x="330" y="173" font-size="13" font-weight="700" fill="#15803d">imported</text>

  <rect x="64" y="194" width="492" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="217" font-size="14" font-weight="700" fill="#64748b" font-family="Consolas, 'Courier New', monospace">2</text>
  <text x="104" y="217" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">9786049876543;85000</text>
  <text x="330" y="217" font-size="13" font-weight="700" fill="#15803d">imported</text>

  <rect x="64" y="238" width="492" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="261" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">3</text>
  <text x="104" y="261" font-size="14" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">9786043333333;12O000</text>
  <text x="330" y="261" font-size="13" font-weight="700" fill="#b91c1c">NumberFormatException</text>

  <rect x="64" y="282" width="492" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="305" font-size="14" font-weight="700" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">4</text>
  <text x="104" y="305" font-size="14" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">9786045555555;99000</text>
  <text x="330" y="305" font-size="13" fill="#64748b">never read: keeps old price</text>

  <rect x="64" y="326" width="492" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="349" font-size="14" font-weight="700" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">5</text>
  <text x="104" y="349" font-size="14" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">9786047777777;150000</text>
  <text x="330" y="349" font-size="13" fill="#64748b">never read: keeps old price</text>

  <path d="M556,256 H570 V402 H566" fill="none" stroke="#dc2626" stroke-width="2"/>
  <polygon points="557,402 566,396 566,408" fill="#dc2626"/>

  <rect x="64" y="376" width="492" height="52" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="398" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">catch (Exception e) { }</text>
  <text x="80" y="418" font-size="13" fill="#475569">the loop ends, reader.close() is skipped, nothing is logged</text>

  <rect x="64" y="440" width="492" height="48" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="470" font-size="15" font-weight="700" fill="#b91c1c">2 of 5 imported, errors: 0, file handle left open</text>

  <!-- Right panel: after -->
  <rect x="620" y="108" width="540" height="396" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="138" font-size="18" font-weight="700" fill="#15803d">After: catch per line, try-with-resources</text>

  <rect x="644" y="150" width="492" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="660" y="173" font-size="14" font-weight="700" fill="#64748b" font-family="Consolas, 'Courier New', monospace">1</text>
  <text x="684" y="173" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">9786041234567;120000</text>
  <text x="910" y="173" font-size="13" font-weight="700" fill="#15803d">imported</text>

  <rect x="644" y="194" width="492" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="660" y="217" font-size="14" font-weight="700" fill="#64748b" font-family="Consolas, 'Courier New', monospace">2</text>
  <text x="684" y="217" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">9786049876543;85000</text>
  <text x="910" y="217" font-size="13" font-weight="700" fill="#15803d">imported</text>

  <rect x="644" y="238" width="492" height="36" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="660" y="261" font-size="14" font-weight="700" fill="#92400e" font-family="Consolas, 'Courier New', monospace">3</text>
  <text x="684" y="261" font-size="14" fill="#92400e" font-family="Consolas, 'Courier New', monospace">9786043333333;12O000</text>
  <text x="910" y="261" font-size="13" font-weight="700" fill="#92400e">line 3: bad price "12O000"</text>

  <rect x="644" y="282" width="492" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="660" y="305" font-size="14" font-weight="700" fill="#64748b" font-family="Consolas, 'Courier New', monospace">4</text>
  <text x="684" y="305" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">9786045555555;99000</text>
  <text x="910" y="305" font-size="13" font-weight="700" fill="#15803d">imported: the loop goes on</text>

  <rect x="644" y="326" width="492" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="660" y="349" font-size="14" font-weight="700" fill="#64748b" font-family="Consolas, 'Courier New', monospace">5</text>
  <text x="684" y="349" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">9786047777777;150000</text>
  <text x="910" y="349" font-size="13" font-weight="700" fill="#15803d">imported</text>

  <rect x="644" y="376" width="492" height="52" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="398" font-size="13" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">try (BufferedReader reader = ...) { ... }</text>
  <text x="660" y="418" font-size="13" fill="#475569">closes the reader on every exit, including an exception</text>

  <rect x="644" y="440" width="492" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="470" font-size="15" font-weight="700" fill="#15803d">4 of 5 imported, 1 error with its line, reader closed</text>

  <!-- Bottom: try-with-resources rules -->
  <rect x="40" y="520" width="1120" height="68" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="547" font-size="14" fill="#334155"><tspan font-weight="700">try-with-resources:</tspan> resources close in reverse order of opening (last opened, first closed), on every exit from the block.</text>
  <text x="64" y="571" font-size="14" fill="#334155">An exception thrown by close() never replaces the real error: it is attached to it, and getSuppressed() returns it.</text>
</svg>
