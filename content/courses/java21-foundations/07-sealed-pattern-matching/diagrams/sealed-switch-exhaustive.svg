<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A sealed type lets the compiler check every switch</text>
  <text x="40" y="82" font-size="16" fill="#475569">Payment permits exactly four records. A switch over it tries its arms top to bottom and must cover all four.</text>

  <!-- sealed hierarchy -->
  <rect x="40" y="110" width="420" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="141" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">sealed interface Payment permits ...</text>
  <path d="M60 160 V393" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <g font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">
    <path d="M60 213 H80" stroke="#94a3b8" stroke-width="2"/>
    <rect x="80" y="190" width="380" height="46" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="100" y="218">record Card(String last4, long amount)</text>
    <path d="M60 273 H80" stroke="#94a3b8" stroke-width="2"/>
    <rect x="80" y="250" width="380" height="46" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="100" y="278">record BankTransfer(String bank, ...)</text>
    <path d="M60 333 H80" stroke="#94a3b8" stroke-width="2"/>
    <rect x="80" y="310" width="380" height="46" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="100" y="338">record EWallet(String provider, ...)</text>
    <path d="M60 393 H80" stroke="#94a3b8" stroke-width="2"/>
    <rect x="80" y="370" width="380" height="46" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="100" y="398">record GiftCard(String code, ...)</text>
  </g>

  <!-- enum vs sealed note -->
  <rect x="40" y="440" width="420" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="470" font-size="15" font-weight="700" fill="#334155">Enum or sealed?</text>
  <text x="60" y="498" font-size="14" fill="#475569">enum: a fixed set of values (PAID, SHIPPED)</text>
  <text x="60" y="522" font-size="14" fill="#475569">sealed: a fixed set of types, each with its own</text>
  <text x="60" y="546" font-size="14" fill="#475569">fields (Card has last4, BankTransfer has bank)</text>

  <!-- switch -->
  <rect x="520" y="110" width="640" height="300" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="545" y="142" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">return switch (p) {</text>
  <g font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">
    <text x="585" y="180">case Card c when c.amount() &gt;= 5_000_000 -&gt; ...</text>
    <text x="585" y="220">case Card c -&gt; ...</text>
    <text x="585" y="260">case BankTransfer b -&gt; ...</text>
    <text x="585" y="300">case EWallet w -&gt; ...</text>
    <text x="585" y="340">case GiftCard g -&gt; ...</text>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="560" cy="175" r="11" fill="#475569"/><text x="560" y="180">1</text>
    <circle cx="560" cy="215" r="11" fill="#475569"/><text x="560" y="220">2</text>
    <circle cx="560" cy="255" r="11" fill="#475569"/><text x="560" y="260">3</text>
    <circle cx="560" cy="295" r="11" fill="#475569"/><text x="560" y="300">4</text>
    <circle cx="560" cy="335" r="11" fill="#475569"/><text x="560" y="340">5</text>
  </g>
  <text x="545" y="388" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">};</text>
  <text x="1140" y="388" font-size="14" fill="#475569" text-anchor="end">tried top to bottom, first match wins; no default</text>
  <path d="M1130 170 V350" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- record to arm links -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M460 213 C490 213 510 175 545 175"/>
    <path d="M460 213 C490 213 510 215 545 215"/>
    <path d="M460 273 C490 273 510 255 545 255"/>
    <path d="M460 333 C490 333 510 295 545 295"/>
    <path d="M460 393 C490 393 510 335 545 335"/>
  </g>

  <!-- compile errors -->
  <rect x="520" y="440" width="320" height="130" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="540" y="470" font-size="15" font-weight="700" fill="#b91c1c">Remove arm 5 (GiftCard)</text>
  <text x="540" y="497" font-size="13" fill="#b91c1c">javac stops the build:</text>
  <text x="540" y="521" font-size="13" fill="#0f172a">the switch expression does not cover</text>
  <text x="540" y="543" font-size="13" fill="#0f172a">all possible input values</text>

  <rect x="860" y="440" width="300" height="130" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="880" y="470" font-size="15" font-weight="700" fill="#92400e">Swap arms 1 and 2</text>
  <text x="880" y="497" font-size="13" fill="#92400e">javac stops the build:</text>
  <text x="880" y="521" font-size="13" fill="#0f172a">this case label is dominated by</text>
  <text x="880" y="543" font-size="13" fill="#0f172a">a preceding case label</text>
</svg>
