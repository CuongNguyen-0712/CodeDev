<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="40" y="52" font-size="26" font-weight="bold" fill="#0f172a">A class is a box with private state and a few doors</text>
  <text x="40" y="82" font-size="16" fill="#475569">Only the public member functions can change the data, and each one keeps 0 &lt;= enrolled_ &lt;= capacity_ true.</text>

  <!-- left: public doors -->
  <text x="40" y="122" font-size="15" font-weight="bold" fill="#15803d">public: the only doors</text>
  <g font-size="13" fill="#334155">
    <rect x="40" y="136" width="380" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="58" y="166" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">Section(code, capacity)</text>
    <text x="58" y="194">throws if capacity &lt;= 0; enrolled_ starts at 0</text>

    <rect x="40" y="232" width="380" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="58" y="262" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">try_add()</text>
    <text x="58" y="290">returns false when enrolled_ == capacity_</text>

    <rect x="40" y="328" width="380" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="58" y="358" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">try_remove()</text>
    <text x="58" y="386">returns false when enrolled_ == 0</text>

    <rect x="40" y="424" width="380" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="58" y="454" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">free_seats() const</text>
    <text x="58" y="482">read only: the compiler rejects any change</text>
  </g>
  <g stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#g)">
    <line x1="420" y1="176" x2="476" y2="210"/>
    <line x1="420" y1="272" x2="476" y2="282"/>
    <line x1="420" y1="368" x2="476" y2="352"/>
  </g>
  <line x1="420" y1="464" x2="476" y2="440" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- center: the class -->
  <rect x="480" y="136" width="330" height="368" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="500" y="170" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#0f172a">class Section</text>
  <rect x="500" y="188" width="290" height="150" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="516" y="214" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#475569">private:</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">
    <text x="532" y="246">std::string code_;</text>
    <text x="532" y="276">int capacity_;</text>
    <text x="532" y="306">int enrolled_ = 0;</text>
  </g>
  <rect x="500" y="356" width="290" height="128" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="516" y="384" font-size="15" font-weight="bold" fill="#15803d">invariant, true after every call</text>
  <text x="516" y="420" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">0 &lt;= enrolled_</text>
  <text x="516" y="448" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">enrolled_ &lt;= capacity_</text>
  <text x="516" y="472" font-size="13" fill="#475569">capacity_ &gt; 0</text>

  <!-- right: blocked -->
  <text x="850" y="122" font-size="15" font-weight="bold" fill="#b91c1c">outside code: stopped</text>
  <g font-size="13" fill="#334155">
    <rect x="850" y="136" width="310" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="866" y="164" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">lab.enrolled_++;</text>
    <text x="866" y="190">compile error: enrolled_ is private</text>
    <text x="866" y="212">within this context</text>

    <rect x="850" y="248" width="310" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="866" y="276" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">print_section(204);</text>
    <text x="866" y="302">compile error with explicit:</text>
    <text x="866" y="324">an int is not silently a Section</text>

    <rect x="850" y="360" width="310" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="866" y="388" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#0f172a">Section bad("X", 0);</text>
    <text x="866" y="414">at run time: the constructor throws</text>
    <text x="866" y="436">std::invalid_argument</text>
  </g>
  <g stroke="#dc2626" stroke-width="2.5">
    <line x1="850" y1="184" x2="822" y2="220"/>
    <line x1="850" y1="296" x2="822" y2="296"/>
    <line x1="850" y1="408" x2="822" y2="380" stroke="#b45309"/>
  </g>
  <g stroke="#b91c1c" stroke-width="3">
    <line x1="814" y1="216" x2="830" y2="232"/><line x1="830" y1="216" x2="814" y2="232"/>
    <line x1="814" y1="288" x2="830" y2="304"/><line x1="830" y1="288" x2="814" y2="304"/>
  </g>

  <text x="40" y="552" font-size="15" fill="#334155">With public fields (the C-style struct) every line of the program is a door, and any one of them can break the rule.</text>
  <text x="40" y="578" font-size="15" fill="#334155">With private fields, checking the rule means reading a handful of member functions.</text>
</svg>
