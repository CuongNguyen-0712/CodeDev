<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Why a position you hold goes stale</text>
  <text x="40" y="82" font-size="16" fill="#475569">Left: erase moves the elements under your index. Right: reallocation moves them away from your reference.</text>

  <!-- Left panel: erase + ++i skips -->
  <rect x="40" y="104" width="540" height="300" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="134" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">v.erase(v.begin() + i); ++i;</text>

  <text x="64" y="160" font-size="13" fill="#334155">before: i = 1 and v[1] is withdrawn</text>
  <rect x="64" y="170" width="112" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="84" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">0101</text>
  <rect x="184" y="170" width="112" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="196" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">0137 W</text>
  <rect x="304" y="170" width="112" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="196" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">0142 W</text>
  <rect x="424" y="170" width="112" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="444" y="196" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">0158</text>
  <line x1="240" y1="240" x2="240" y2="222" stroke="#334155" stroke-width="2"/>
  <polygon points="234,224 246,224 240,212" fill="#334155"/>
  <text x="252" y="240" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">i = 1</text>

  <text x="64" y="276" font-size="13" fill="#334155">after the erase: the rest moved one slot left, then ++i</text>
  <rect x="64" y="286" width="112" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="84" y="312" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">0101</text>
  <rect x="184" y="286" width="112" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="312" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">0142 W</text>
  <rect x="304" y="286" width="112" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="324" y="312" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">0158</text>
  <rect x="424" y="286" width="112" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="446" y="311" font-size="13" fill="#94a3b8">size is 3</text>
  <line x1="360" y1="356" x2="360" y2="338" stroke="#334155" stroke-width="2"/>
  <polygon points="354,340 366,340 360,328" fill="#334155"/>
  <text x="372" y="356" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">i = 2</text>

  <text x="64" y="388" font-size="13" font-weight="700" fill="#b91c1c">0142 slid into slot 1, already checked: it is never looked at</text>

  <!-- Right panel: push_back reallocation -->
  <rect x="620" y="104" width="540" height="300" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="644" y="134" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">const Student&amp; top = v[0];</text>

  <text x="644" y="160" font-size="13" fill="#334155">old buffer, size 2, capacity 2</text>
  <rect x="644" y="170" width="112" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="664" y="196" font-size="15" fill="#64748b" font-family="Consolas, 'Courier New', monospace">0137</text>
  <rect x="764" y="170" width="112" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="784" y="196" font-size="15" fill="#64748b" font-family="Consolas, 'Courier New', monospace">0101</text>
  <text x="896" y="187" font-size="13" font-weight="700" fill="#b91c1c">freed by push_back</text>
  <text x="896" y="205" font-size="13" fill="#7f1d1d">(memory given back)</text>
  <line x1="700" y1="240" x2="700" y2="222" stroke="#dc2626" stroke-width="2"/>
  <polygon points="694,224 706,224 700,212" fill="#dc2626"/>
  <text x="712" y="240" font-size="13" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">top still points here</text>

  <text x="644" y="276" font-size="13" fill="#334155">v.push_back(...): new buffer, size 3, capacity 4</text>
  <rect x="644" y="286" width="112" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="664" y="312" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">0137</text>
  <rect x="764" y="286" width="112" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="784" y="312" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">0101</text>
  <rect x="884" y="286" width="112" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="904" y="312" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">0158</text>
  <rect x="1004" y="286" width="112" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1026" y="311" font-size="13" fill="#94a3b8">spare</text>

  <text x="644" y="364" font-size="13" fill="#334155">the elements were moved; v[0] is now a different address</text>
  <text x="644" y="388" font-size="13" font-weight="700" fill="#b91c1c">reading top.name: AddressSanitizer: heap-use-after-free</text>

  <!-- Bottom: rules -->
  <rect x="40" y="420" width="1120" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="450" font-size="16" font-weight="700" fill="#334155">What each operation invalidates (iterators, pointers and references)</text>
  <text x="64" y="480" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">vector push_back / insert</text>
  <text x="400" y="480" font-size="14" fill="#334155">ALL of them if size would exceed capacity; otherwise insert: from the insert point on</text>
  <text x="64" y="506" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">vector erase(pos)</text>
  <text x="400" y="506" font-size="14" fill="#334155">pos and everything after it; erase returns an iterator to the next element</text>
  <text x="64" y="532" font-size="14" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">map insert / emplace</text>
  <text x="400" y="532" font-size="14" fill="#334155">nothing: every existing element stays where it is</text>
  <text x="64" y="558" font-size="14" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">map erase(it)</text>
  <text x="400" y="558" font-size="14" fill="#334155">only the erased element; erase returns the next iterator, as for vector</text>
</svg>
