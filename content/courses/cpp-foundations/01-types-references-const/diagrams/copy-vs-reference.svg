<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">auto s copies the element, auto&amp; s is the element</text>
  <text x="40" y="82" font-size="16" fill="#475569">A by-value loop variable or parameter gets its own double. A reference is a second name for the same one.</text>

  <!-- Left: copies -->
  <rect x="40" y="108" width="540" height="296" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="140" font-size="17" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">for (auto s : scores)</text>
  <text x="64" y="164" font-size="13" fill="#7f1d1d">s is a new double, copied from each element in turn</text>

  <text x="64" y="192" font-size="13" font-weight="700" fill="#334155">scores</text>
  <rect x="64" y="200" width="90" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="109" y="230" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">7.5</text>
  <rect x="160" y="200" width="90" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="205" y="230" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">8.0</text>
  <rect x="256" y="200" width="90" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="301" y="230" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">6.5</text>
  <rect x="352" y="200" width="90" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="397" y="230" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">9.0</text>

  <line x1="109" y1="250" x2="109" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="103,278 115,278 109,290" fill="#dc2626"/>
  <text x="120" y="274" font-size="12" fill="#b91c1c">copied</text>

  <rect x="64" y="292" width="210" height="64" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="316" font-size="13" font-weight="700" fill="#b91c1c">s (a copy)</text>
  <text x="80" y="342" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">7.5 + 0.5 = 8.0</text>

  <rect x="296" y="292" width="260" height="64" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="312" y="316" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">add_bonus(double score)</text>
  <text x="312" y="342" font-size="13" fill="#7f1d1d">score is a copy of the copy</text>

  <text x="64" y="388" font-size="13" font-weight="700" fill="#b91c1c">scores after the loop: [7.5, 8, 6.5, 9] - nothing changed</text>

  <!-- Right: references -->
  <rect x="620" y="108" width="540" height="296" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="140" font-size="17" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">for (auto&amp; s : scores)</text>
  <text x="644" y="164" font-size="13" fill="#14532d">s is another name for each element in turn</text>

  <text x="644" y="192" font-size="13" font-weight="700" fill="#334155">scores</text>
  <rect x="644" y="200" width="90" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="689" y="230" font-size="16" fill="#15803d" font-weight="700" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">8.0</text>
  <rect x="740" y="200" width="90" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="785" y="230" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">8.0</text>
  <rect x="836" y="200" width="90" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="881" y="230" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">6.5</text>
  <rect x="932" y="200" width="90" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="977" y="230" font-size="16" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">9.0</text>

  <line x1="689" y1="292" x2="689" y2="262" stroke="#16a34a" stroke-width="2"/>
  <polygon points="683,264 695,264 689,252" fill="#16a34a"/>
  <text x="700" y="276" font-size="12" fill="#15803d">same object</text>

  <rect x="644" y="292" width="210" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="316" font-size="13" font-weight="700" fill="#15803d">s (an alias)</text>
  <text x="660" y="342" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">s += 0.5</text>

  <rect x="876" y="292" width="260" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="892" y="316" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">add_bonus(double&amp; score)</text>
  <text x="892" y="342" font-size="13" fill="#14532d">score is the element itself</text>

  <text x="644" y="388" font-size="13" font-weight="700" fill="#15803d">scores after the loop: [8, 8.5, 7, 9.5]</text>

  <!-- Bottom: the rule -->
  <rect x="40" y="428" width="1120" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="458" font-size="16" font-weight="700" fill="#334155">The same rule everywhere a name is declared</text>
  <text x="64" y="488" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">auto x = v[i];</text>
  <text x="280" y="488" font-size="14" fill="#334155">copy: changes stay in x</text>
  <text x="64" y="516" font-size="14" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">auto&amp; x = v[i];</text>
  <text x="280" y="516" font-size="14" fill="#334155">alias: changes reach v[i]</text>
  <text x="64" y="544" font-size="14" font-weight="700" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">const auto&amp; x = v[i];</text>
  <text x="280" y="544" font-size="14" fill="#334155">alias, read-only: no copy, no changes</text>
  <text x="620" y="488" font-size="14" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">void f(double s)</text>
  <text x="850" y="488" font-size="14" fill="#334155">gets its own copy</text>
  <text x="620" y="516" font-size="14" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">void f(double&amp; s)</text>
  <text x="850" y="516" font-size="14" fill="#334155">changes the caller's variable</text>
  <text x="620" y="544" font-size="14" font-weight="700" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">void f(const T&amp; s)</text>
  <text x="850" y="544" font-size="14" fill="#334155">reads it without copying</text>
</svg>
