<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Fixed bytes in place vs an owned, growing buffer</text>
  <text x="40" y="82" font-size="16" fill="#475569">char name[24] has room for 24 bytes, no more. std::string and std::vector keep size and capacity and reallocate.</text>

  <!-- Left: C struct -->
  <rect x="40" y="108" width="540" height="452" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="140" font-size="17" font-weight="700" fill="#b91c1c">C: fixed bytes inside the struct</text>
  <text x="64" y="164" font-size="13" fill="#7f1d1d">struct Student { char id[16]; char name[24]; int score; }  - 44 bytes</text>

  <text x="64" y="192" font-size="12" fill="#475569">name[24]  (bytes 0-23)</text>
  <text x="392" y="192" font-size="12" fill="#475569">int score  (bytes 24-27)</text>

  <!-- row A: before -->
  <rect x="64" y="200" width="320" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="226" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">Tran Thi Bich Ngoc\0</text>
  <rect x="392" y="200" width="38" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="434" y="200" width="38" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="476" y="200" width="38" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="518" y="200" width="38" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="411" y="226" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">55</text>
  <text x="453" y="226" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">00</text>
  <text x="495" y="226" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">00</text>
  <text x="537" y="226" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">00</text>
  <text x="64" y="260" font-size="13" fill="#334155">before: 19 of 24 bytes used, score = 85</text>

  <!-- row B: after -->
  <rect x="64" y="274" width="320" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="300" font-size="14" fill="#7f1d1d" font-family="Consolas, 'Courier New', monospace">Trần Thị Bích Ngọ</text>
  <text x="368" y="300" font-size="12" fill="#b91c1c" text-anchor="end">full</text>
  <rect x="392" y="274" width="38" height="40" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <rect x="434" y="274" width="38" height="40" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <rect x="476" y="274" width="38" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="518" y="274" width="38" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="411" y="300" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">63</text>
  <text x="453" y="300" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">00</text>
  <text x="495" y="300" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">00</text>
  <text x="537" y="300" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">00</text>
  <text x="64" y="334" font-size="13" font-weight="700" fill="#b91c1c">after strcpy of "Trần Thị Bích Ngọc" (25 bytes + \0): score = 99</text>
  <text x="64" y="354" font-size="13" fill="#7f1d1d">name byte 24 is 'c' (0x63 = 99), byte 25 is the \0: both land in score</text>

  <line x1="64" y1="374" x2="556" y2="374" stroke="#fca5a5" stroke-width="1"/>
  <text x="64" y="398" font-size="13" fill="#334155">strcpy does not know the size of name: it copies until the \0.</text>
  <text x="64" y="420" font-size="13" fill="#334155">ASan is silent here: the write stays inside the 44-byte struct.</text>

  <text x="64" y="452" font-size="13" fill="#334155">Student students[40]: full at 40, student 41 has no slot</text>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1">
    <rect x="64" y="464" width="9" height="24"/><rect x="75" y="464" width="9" height="24"/><rect x="86" y="464" width="9" height="24"/><rect x="97" y="464" width="9" height="24"/><rect x="108" y="464" width="9" height="24"/>
    <rect x="119" y="464" width="9" height="24"/><rect x="130" y="464" width="9" height="24"/><rect x="141" y="464" width="9" height="24"/><rect x="152" y="464" width="9" height="24"/><rect x="163" y="464" width="9" height="24"/>
    <rect x="174" y="464" width="9" height="24"/><rect x="185" y="464" width="9" height="24"/><rect x="196" y="464" width="9" height="24"/><rect x="207" y="464" width="9" height="24"/><rect x="218" y="464" width="9" height="24"/>
    <rect x="229" y="464" width="9" height="24"/><rect x="240" y="464" width="9" height="24"/><rect x="251" y="464" width="9" height="24"/><rect x="262" y="464" width="9" height="24"/><rect x="273" y="464" width="9" height="24"/>
    <rect x="284" y="464" width="9" height="24"/><rect x="295" y="464" width="9" height="24"/><rect x="306" y="464" width="9" height="24"/><rect x="317" y="464" width="9" height="24"/><rect x="328" y="464" width="9" height="24"/>
    <rect x="339" y="464" width="9" height="24"/><rect x="350" y="464" width="9" height="24"/><rect x="361" y="464" width="9" height="24"/><rect x="372" y="464" width="9" height="24"/><rect x="383" y="464" width="9" height="24"/>
    <rect x="394" y="464" width="9" height="24"/><rect x="405" y="464" width="9" height="24"/><rect x="416" y="464" width="9" height="24"/><rect x="427" y="464" width="9" height="24"/><rect x="438" y="464" width="9" height="24"/>
    <rect x="449" y="464" width="9" height="24"/><rect x="460" y="464" width="9" height="24"/><rect x="471" y="464" width="9" height="24"/><rect x="482" y="464" width="9" height="24"/><rect x="493" y="464" width="9" height="24"/>
  </g>
  <rect x="512" y="464" width="44" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="534" y="481" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">41</text>
  <text x="64" y="524" font-size="13" fill="#334155">sizeof(scores) in a function measures a pointer: 8 / 4 = 2</text>

  <!-- Right: C++ -->
  <rect x="620" y="108" width="540" height="452" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="140" font-size="17" font-weight="700" fill="#15803d">C++: the object owns a heap buffer</text>
  <text x="644" y="164" font-size="13" fill="#14532d">the object holds a pointer, size and capacity; the bytes live on the heap</text>

  <!-- string -->
  <rect x="644" y="186" width="216" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="210" font-size="14" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">std::string name</text>
  <text x="660" y="236" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">data</text>
  <text x="660" y="258" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">size      25</text>
  <text x="660" y="280" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">capacity  36</text>
  <line x1="704" y1="232" x2="880" y2="232" stroke="#16a34a" stroke-width="2"/>
  <polygon points="878,226 878,238 890,232" fill="#16a34a"/>
  <text x="892" y="196" font-size="12" fill="#14532d">heap: 25 bytes + \0, room for 36</text>
  <rect x="892" y="204" width="244" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="908" y="237" font-size="13" fill="#14532d" font-family="Consolas, 'Courier New', monospace">Trần Thị Bích Ngọc\0</text>
  <text x="892" y="280" font-size="12" fill="#14532d">a longer name gets a new, bigger buffer</text>

  <!-- vector -->
  <rect x="644" y="330" width="216" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="354" font-size="13" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">std::vector&lt;Student&gt;</text>
  <text x="660" y="380" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">data</text>
  <text x="660" y="402" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">size      41</text>
  <text x="660" y="424" font-size="13" fill="#334155" font-family="Consolas, 'Courier New', monospace">capacity  64</text>
  <line x1="704" y1="376" x2="880" y2="376" stroke="#16a34a" stroke-width="2"/>
  <polygon points="878,370 878,382 890,376" fill="#16a34a"/>
  <text x="892" y="340" font-size="12" fill="#14532d">heap: 64 Student slots</text>
  <rect x="892" y="348" width="160" height="56" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="972" y="381" font-size="13" fill="#14532d" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">[0] .. [40]</text>
  <rect x="1052" y="348" width="84" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1094" y="381" font-size="12" fill="#15803d" text-anchor="middle">23 free</text>
  <text x="892" y="424" font-size="12" fill="#14532d">student 41 is one more push_back</text>

  <line x1="644" y1="462" x2="1136" y2="462" stroke="#86efac" stroke-width="1"/>
  <text x="644" y="488" font-size="13" fill="#334155">push_back when size == capacity: allocate a block twice as big,</text>
  <text x="644" y="508" font-size="13" fill="#334155">move the elements over, free the old block.</text>
  <text x="644" y="538" font-size="13" font-weight="700" fill="#15803d">score is its own member: a longer name can never reach it</text>
</svg>
