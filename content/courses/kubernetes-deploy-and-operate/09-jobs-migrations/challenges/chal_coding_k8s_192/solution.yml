# Rice Rocket release 1.5.0. CI applies the Job, waits for it, then updates the api image:
#   kubectl apply -f k8s/jobs.yaml
#   kubectl wait --for=condition=complete job/migrate-1-5-0 --timeout=300s
#   kubectl set image deployment/api api=ghcr.io/rice-rocket/api:1.5.0
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-1-5-0
  namespace: rice-rocket
spec:
  # @piece job-retries: Retry a failed migration once, and stop it after 5 minutes
  backoffLimit: 1
  activeDeadlineSeconds: 300
  # @end
  # @piece job-cleanup: Delete the finished Job and its pods a day later
  ttlSecondsAfterFinished: 86400
  # @end
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # @piece job-restart-policy: A failed attempt gets a new pod, its logs stay readable
      restartPolicy: Never
      # @end
      containers:
        - name: migrate
          image: ghcr.io/rice-rocket/api:1.5.0
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: api-secrets
---
# Nightly cleanup of abandoned carts, while almost nobody orders.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: expire-carts
  namespace: rice-rocket
spec:
  # @piece cron-schedule: Every night at 03:00 Ho Chi Minh City time
  schedule: "0 3 * * *"
  timeZone: Asia/Ho_Chi_Minh
  # @end
  # @piece cron-concurrency: One run at a time; skip a run more than 10 minutes late
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # @end
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # @piece cron-run-deadline: Stop a nightly run that takes longer than one hour
      activeDeadlineSeconds: 3600
      # @end
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: expire-carts
              image: ghcr.io/rice-rocket/api:1.5.0
              command: ["node", "dist/jobs/expire-carts.js"]
              envFrom:
                - secretRef:
                    name: api-secrets
