# Rice Rocket api: 6 replicas carry the lunch and dinner peaks, so a rollout must never
# leave fewer than 6 pods serving, must say when it is stuck and must be easy to undo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rice-rocket
  annotations:
    kubernetes.io/change-cause: "api 1.5.1: retry MoMo payment webhooks"
spec:
  replicas: 6
  # [ ] Roll out by adding a pod before removing one
  # [ ] Count a new pod only after 10 seconds of ready
  # [ ] Report a stuck rollout after 5 minutes
  # [ ] Keep the last versions for rollout undo
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # [ ] The exact version this rollout ships
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
