# Rice Rocket api in namespace rice-rocket: settings in a ConfigMap, secrets from the Secret
# api-secrets, which the team creates out of band and never commits:
#   kubectl -n rice-rocket create secret generic api-secrets \
#     --from-file=db-password=./db-password.txt --from-file=jwt-secret=./jwt-secret.txt
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: rice-rocket
# @piece configmap-data: The api's settings that are not secret
data:
  NODE_ENV: production
  PORT: "3000"
  DATABASE_HOST: db.internal.ricerocket.vn
  DATABASE_USER: rocket
  DATABASE_NAME: rocket
  JWT_SECRET_FILE: /run/secrets/jwt_secret
# @end
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rice-rocket
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/rice-rocket/api:1.4.0
          ports:
            - name: http
              containerPort: 3000
          # @piece env-from-config: Every ConfigMap key as an environment variable
          envFrom:
            - configMapRef:
                name: api-config
          # @end
          env:
            # @piece db-password-ref: DATABASE_PASSWORD from the out-of-band Secret
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: db-password
            # @end
          # @piece jwt-mount: Mount the JWT secret read-only under /run/secrets
          volumeMounts:
            - name: jwt
              mountPath: /run/secrets
              readOnly: true
          # @end
      # @piece jwt-volume: A volume holding only the JWT secret, as jwt_secret
      volumes:
        - name: jwt
          secret:
            secretName: api-secrets
            items:
              - key: jwt-secret
                path: jwt_secret
      # @end
