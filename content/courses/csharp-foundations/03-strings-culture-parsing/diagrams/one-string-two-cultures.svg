<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One upload, two cultures: Parse and ToString read the server's settings</text>
  <text x="40" y="82" font-size="16" fill="#475569">The same line from a teacher, imported before and after the worker moved to an image with LANG=vi_VN.UTF-8</text>

  <!-- input -->
  <rect x="330" y="104" width="540" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="350" y="138" font-size="16" fill="#334155" font-family="Consolas, 'Courier New', monospace">HS-1024,Nguyễn Gia Bảo,8.5,7,9.5</text>
  <line x1="480" y1="160" x2="300" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="160" x2="900" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- left: invariant -->
  <rect x="40" y="200" width="540" height="270" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="62" y="232" font-size="17" font-weight="700" fill="#15803d">Old image: CurrentCulture = invariant ("")</text>
  <text x="62" y="262" font-size="14" fill="#166534">decimal separator "."   thousands separator ","</text>
  <text x="62" y="300" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">double.Parse("8.5")</text><text x="312" y="300" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">= 8.5</text>
  <text x="62" y="330" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">average</text><text x="312" y="330" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">= 8.33...</text>
  <text x="62" y="360" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">$"{average:F1}"</text><text x="312" y="360" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">= "8.3"</text>
  <text x="62" y="404" font-size="14" font-weight="700" fill="#15803d">CSV row: 3 columns</text>
  <text x="62" y="436" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">HS-1024,Nguyễn Gia Bảo,8.3</text>

  <!-- right: vi-VN -->
  <rect x="620" y="200" width="540" height="270" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="642" y="232" font-size="17" font-weight="700" fill="#b91c1c">New image: CurrentCulture = vi-VN</text>
  <text x="642" y="262" font-size="14" fill="#7f1d1d">decimal separator ","   thousands separator "."</text>
  <text x="642" y="300" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">double.Parse("8.5")</text><text x="892" y="300" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">= 85</text>
  <text x="642" y="330" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">average</text><text x="892" y="330" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">= 62.33...</text>
  <text x="642" y="360" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">$"{average:F1}"</text><text x="892" y="360" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">= "62,3"</text>
  <text x="642" y="404" font-size="14" font-weight="700" fill="#b91c1c">CSV row: 4 columns - the comma splits the score</text>
  <text x="642" y="436" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">HS-1024,Nguyễn Gia Bảo,62,3</text>

  <!-- fix -->
  <rect x="40" y="500" width="1120" height="180" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="62" y="534" font-size="18" font-weight="700" fill="#15803d">The fix: name the culture every time text and numbers meet</text>
  <text x="62" y="570" font-size="15" font-weight="700" fill="#166534">Data for programs (uploads, CSV, JSON, logs): the invariant culture</text>
  <text x="62" y="598" font-size="14" fill="#166534" font-family="Consolas, 'Courier New', monospace">decimal.TryParse(text, NumberStyles.Float, CultureInfo.InvariantCulture, out var score)</text>
  <text x="62" y="624" font-size="14" fill="#166534" font-family="Consolas, 'Courier New', monospace">string.Create(CultureInfo.InvariantCulture, $"{id},{name},{average:F1}")   -&gt; 8.3</text>
  <text x="62" y="658" font-size="15" font-weight="700" fill="#166534">Text for people (the SMS to parents): the culture they read - vi-VN, chosen explicitly   -&gt; 8,3</text>
</svg>
