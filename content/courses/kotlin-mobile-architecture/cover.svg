<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Mobile app architecture in Kotlin (unidirectional data flow and a screen state machine). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15112A"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C3B1FF"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7F52FF"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3DBE7B"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <path d="M112 152 H204 L158 198 L204 244 H112 Z" fill="#7F52FF"/>
    <path d="M112 152 H158 L112 198 Z" fill="#C3B1FF" fill-opacity="0.55"/>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#C3B1FF">KOTLIN · APP ARCHITECTURE</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Mobile App</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Architecture</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Reducers · State machines · Caching · Tests</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#E2D9FF">
      <rect x="110" y="660" width="150" height="52" rx="26" fill="#1E1638" stroke="#7F52FF"/>
      <text x="185" y="695" text-anchor="middle">reduce</text>
      <rect x="276" y="660" width="150" height="52" rx="26" fill="#1E1638" stroke="#7F52FF"/>
      <text x="351" y="695" text-anchor="middle">sealed</text>
      <rect x="442" y="660" width="207" height="52" rx="26" fill="#1E1638" stroke="#7F52FF"/>
      <text x="545.5" y="695" text-anchor="middle">Repository</text>
      <rect x="665" y="660" width="150" height="52" rx="26" fill="#1E1638" stroke="#7F52FF"/>
      <text x="740" y="695" text-anchor="middle">Paging</text>
    </g>
  </g>

  <!-- Actions go through one reducer to a new state the UI renders; the screen state machine includes empty, error and retry -->
  <g id="art" font-family="Consolas, Menlo, monospace">
    <text x="900" y="254" font-size="20" letter-spacing="3" fill="#C3B1FF">UNIDIRECTIONAL DATA FLOW</text>
    <g font-size="22" text-anchor="middle">
    <rect x="900" y="276" width="120" height="64" rx="14" fill="#1A1430" stroke="#7F52FF" stroke-width="2"/>
    <text x="960" y="316" fill="#F4F2F8">UI</text>
    <rect x="1056" y="276" width="140" height="64" rx="14" fill="#1A1430" stroke="#7F52FF" stroke-width="2"/>
    <text x="1126" y="316" fill="#F4F2F8">Action</text>
    <rect x="1232" y="276" width="140" height="64" rx="14" fill="#7F52FF" fill-opacity="0.35" stroke="#7F52FF" stroke-width="3"/>
    <text x="1302" y="316" fill="#F4F2F8" font-weight="700">reduce</text>
    <rect x="1408" y="276" width="122" height="64" rx="14" fill="#1A1430" stroke="#7F52FF" stroke-width="2"/>
    <text x="1469" y="316" fill="#F4F2F8">State</text>
    </g>
    <path d="M1022 308 H1050" stroke="#C3B1FF" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1198 308 H1226" stroke="#C3B1FF" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1374 308 H1402" stroke="#C3B1FF" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1469 342 V380 H960 V348" stroke="#C3B1FF" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1214" y="408" font-size="20" fill="#B8B2C8" text-anchor="middle">render(state)</text>
    <text x="900" y="474" font-size="20" letter-spacing="3" fill="#C3B1FF">SCREEN STATE</text>
    <g font-size="22" text-anchor="middle">
    <rect x="900" y="548" width="180" height="64" rx="14" fill="#2A2410" stroke="#F2C14E" stroke-width="2"/>
    <text x="990" y="588" fill="#F2C14E">Loading</text>
    <rect x="1310" y="490" width="220" height="52" rx="12" fill="#10281C" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1420" y="524" fill="#3DBE7B">Content</text>
    <rect x="1310" y="554" width="220" height="52" rx="12" fill="#1A1430" stroke="#6F6A80" stroke-width="2"/>
    <text x="1420" y="588" fill="#B8B2C8">Empty</text>
    <rect x="1310" y="618" width="220" height="52" rx="12" fill="#2A1218" stroke="#F2555A" stroke-width="2"/>
    <text x="1420" y="652" fill="#F2555A">Error</text>
    </g>
    <path d="M1082 570 C1200 570, 1200 516, 1304 516" stroke="#3DBE7B" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
    <path d="M1082 580 H1304" stroke="#6F6A80" stroke-width="3" fill="none" marker-end="url(#arrowMuted)"/>
    <path d="M1082 590 C1200 590, 1200 644, 1304 644" stroke="#F2555A" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
    <path d="M1308 662 C1150 700, 990 700, 990 618" stroke="#F2C14E" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrowAmber)"/>
    <text x="1110" y="668" font-size="20" fill="#F2C14E">retry</text>
  </g>
</svg>
