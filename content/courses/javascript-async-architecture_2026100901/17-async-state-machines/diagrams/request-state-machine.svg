<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A request lifecycle as a state machine</text>
  <text x="40" y="82" font-size="16" fill="#475569">Each state carries only the fields that are valid in it. The arrows are the only legal moves.</text>

  <!-- transitions (drawn first, behind the states) -->
  <!-- idle -> loading -->
  <line x1="220" y1="315" x2="468" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="303" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">FETCH</text>

  <!-- loading self loop -->
  <path d="M545 270 C 515 205, 645 205, 615 268" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="196" font-size="14" text-anchor="middle" fill="#0f172a"><tspan font-weight="700">FETCH</tspan> (requestId + 1)</text>

  <!-- loading -> success -->
  <line x1="690" y1="295" x2="928" y2="186" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="294" font-size="14" fill="#166534"><tspan font-weight="700">RESOLVE</tspan> (current id)</text>

  <!-- loading -> error -->
  <line x1="690" y1="335" x2="928" y2="444" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="356" font-size="14" fill="#991b1b"><tspan font-weight="700">REJECT</tspan> (current id)</text>

  <!-- success -> loading -->
  <path d="M930 160 C 790 110, 700 160, 672 268" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="790" y="132" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">FETCH</text>

  <!-- error -> loading (retry) -->
  <path d="M930 475 C 800 520, 700 450, 667 363" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="725" y="522" font-size="14" fill="#92400e"><tspan font-weight="700">RETRY</tspan> (attempt &lt; 3)</text>

  <!-- loading -> cancelled -->
  <line x1="620" y1="360" x2="620" y2="498" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="632" y="435" font-size="14" font-weight="700" fill="#0f172a">CANCEL</text>

  <!-- cancelled -> loading -->
  <line x1="540" y1="500" x2="540" y2="362" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="528" y="435" font-size="14" font-weight="700" text-anchor="end" fill="#0f172a">FETCH</text>

  <!-- states -->
  <rect x="60" y="280" width="160" height="70" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="140" y="310" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">idle</text>
  <text x="140" y="332" font-size="13" text-anchor="middle" fill="#475569">requestId: 0</text>

  <rect x="470" y="270" width="220" height="90" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="580" y="308" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">loading</text>
  <text x="580" y="332" font-size="13" text-anchor="middle" fill="#0e7490">requestId, attempt</text>

  <rect x="930" y="140" width="210" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1035" y="170" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">success</text>
  <text x="1035" y="192" font-size="13" text-anchor="middle" fill="#166534">requestId, data</text>

  <rect x="930" y="420" width="210" height="70" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1035" y="450" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">error</text>
  <text x="1035" y="472" font-size="13" text-anchor="middle" fill="#991b1b">requestId, attempt, error</text>

  <rect x="470" y="500" width="220" height="70" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="530" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">cancelled</text>
  <text x="580" y="552" font-size="13" text-anchor="middle" fill="#6d28d9">requestId</text>

  <!-- note -->
  <rect x="60" y="420" width="340" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="450" font-size="15" font-weight="700" fill="#92400e">Ignored: return the same object</text>
  <text x="80" y="476" font-size="14" fill="#78350f">RESOLVE / REJECT for an older requestId</text>
  <text x="80" y="498" font-size="14" fill="#78350f">CANCEL or RETRY in the wrong state</text>
  <text x="80" y="520" font-size="14" fill="#78350f">unknown events</text>
  <text x="80" y="540" font-size="13" fill="#92400e">FETCH is allowed from every state.</text>
</svg>
