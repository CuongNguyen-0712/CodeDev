<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Same 400 ms of work, very different responsiveness</text>
  <text x="40" y="82" font-size="16" fill="#475569">The browser can only handle input and paint between tasks. Slicing creates those gaps.</text>
  <text x="40" y="186" font-size="18" font-weight="700" fill="#b91c1c">Before</text>
  <text x="40" y="208" font-size="13" fill="#64748b">one long task</text>
  <rect x="220" y="160" width="720" height="56" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="580" y="194" font-size="15" text-anchor="middle" fill="#b91c1c">filterRows + renderTable: one 400 ms long task</text>
  <rect x="940" y="160" width="27" height="56" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="967" y="160" width="18" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="328" y="130" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed">click</text>
  <line x1="328" y1="136" x2="328" y2="154" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="323,150 333,150 328,158" fill="#7c3aed"/>
  <path d="M328 232 L328 240 L985 240 L985 232" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="656.5" y="260" font-size="14" font-weight="700" text-anchor="middle" fill="#b91c1c">click to next paint: about 365 ms - poor INP</text>
  <text x="40" y="346" font-size="18" font-weight="700" fill="#0e7490">After</text>
  <text x="40" y="368" font-size="13" fill="#64748b">sliced, yields every ~45 ms</text>
  <rect x="220" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="310" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="427" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="517" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="607" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="697" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="787" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="877" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="967" y="320" width="81" height="56" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="260.5" y="354" font-size="13" text-anchor="middle" fill="#0e7490">slice</text>
  <rect x="391" y="320" width="18" height="56" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="409" y="320" width="12.600000000000023" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="328" y="290" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed">click</text>
  <line x1="328" y1="296" x2="328" y2="314" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="323,310 333,310 328,318" fill="#7c3aed"/>
  <path d="M328 392 L328 400 L421.6 400 L421.6 392" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="374.8" y="420" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d">about 50 ms - good INP</text>
  <line x1="220" y1="470" x2="1150" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1150,464 1162,470 1150,476" fill="#94a3b8"/>
  <line x1="220" y1="465" x2="220" y2="475" stroke="#94a3b8" stroke-width="2"/>
