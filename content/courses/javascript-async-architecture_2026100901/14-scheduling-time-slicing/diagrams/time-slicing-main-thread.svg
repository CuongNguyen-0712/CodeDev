  <line x1="940" y1="465" x2="940" y2="475" stroke="#94a3b8" stroke-width="2"/>
  <text x="940" y="494" font-size="13" text-anchor="middle" fill="#64748b">400 ms</text>
  <line x1="1120" y1="465" x2="1120" y2="475" stroke="#94a3b8" stroke-width="2"/>
  <text x="1120" y="494" font-size="13" text-anchor="middle" fill="#64748b">500 ms</text>
  <rect x="220" y="514" width="22" height="16" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="252" y="528" font-size="14" fill="#334155">long task</text>
  <rect x="410" y="514" width="22" height="16" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="442" y="528" font-size="14" fill="#334155">work slice</text>
  <rect x="600" y="514" width="22" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="632" y="528" font-size="14" fill="#334155">click handler</text>
  <rect x="790" y="514" width="22" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="822" y="528" font-size="14" fill="#334155">paint (frame)</text>
