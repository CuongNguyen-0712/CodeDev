<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One thread, one call stack, two queues and a render step</text>
  <text x="40" y="82" font-size="16" fill="#475569">After every task the loop drains all microtasks, may render a frame, and only then picks the next task.</text>

  <!-- Call stack -->
  <text x="40" y="132" font-size="18" font-weight="700" fill="#334155">Call stack</text>
  <text x="40" y="154" font-size="13" fill="#64748b">runs to completion, never interrupted</text>
  <rect x="40" y="170" width="250" height="250" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="58" y="252" width="214" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="165" y="280" font-size="14" text-anchor="middle" fill="#334155">store.set({ balance })</text>
  <rect x="58" y="304" width="214" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="165" y="332" font-size="14" text-anchor="middle" fill="#334155">confirmTopUp()</text>
  <rect x="58" y="356" width="214" height="44" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="165" y="384" font-size="14" text-anchor="middle" fill="#0e7490">task: click handler</text>

  <!-- Host -->
  <rect x="340" y="114" width="460" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="570" y="140" font-size="16" font-weight="700" text-anchor="middle" fill="#b45309">Host (Web APIs)</text>
  <text x="570" y="162" font-size="13" text-anchor="middle" fill="#92400e">timers · network · DOM events · MessageChannel</text>
  <line x1="450" y1="178" x2="450" y2="232" stroke="#d97706" stroke-width="2"/>
  <polygon points="444,228 456,228 450,240" fill="#d97706"/>
  <line x1="690" y1="178" x2="690" y2="232" stroke="#d97706" stroke-width="2"/>
  <polygon points="684,228 696,228 690,240" fill="#d97706"/>
  <text x="570" y="214" font-size="12" text-anchor="middle" fill="#92400e">callbacks come back as tasks</text>

  <!-- Task queue -->
  <text x="340" y="262" font-size="15" font-weight="700" fill="#0e7490">Task queue (macrotasks)</text>
  <rect x="340" y="272" width="200" height="48" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="440" y="293" font-size="13" text-anchor="middle" fill="#0e7490">renderBalance</text>
  <text x="440" y="310" font-size="11" text-anchor="middle" fill="#64748b">setTimeout(..., 0)</text>
  <rect x="550" y="272" width="110" height="48" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="605" y="301" font-size="13" text-anchor="middle" fill="#0e7490">keydown</text>
  <rect x="670" y="272" width="130" height="48" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="735" y="301" font-size="13" text-anchor="middle" fill="#0e7490">fetch response</text>

  <!-- Microtask queue -->
  <text x="340" y="362" font-size="15" font-weight="700" fill="#6d28d9">Microtask queue</text>
  <rect x="340" y="372" width="200" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="393" font-size="13" text-anchor="middle" fill="#6d28d9">showModal</text>
  <text x="440" y="410" font-size="11" text-anchor="middle" fill="#64748b">code after await</text>
  <rect x="550" y="372" width="110" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="605" y="401" font-size="13" text-anchor="middle" fill="#6d28d9">.then()</text>
  <rect x="670" y="372" width="130" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="735" y="401" font-size="13" text-anchor="middle" fill="#6d28d9">queueMicrotask</text>

  <!-- Loop steps -->
  <text x="850" y="132" font-size="18" font-weight="700" fill="#334155">Each turn of the loop</text>
  <rect x="850" y="150" width="300" height="64" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="870" y="178" font-size="15" font-weight="700" fill="#0e7490">1  Run ONE task</text>
  <text x="870" y="200" font-size="13" fill="#64748b">oldest runnable task, until the stack is empty</text>
  <line x1="1000" y1="214" x2="1000" y2="236" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="994,232 1006,232 1000,244" fill="#94a3b8"/>
  <rect x="850" y="246" width="300" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="870" y="274" font-size="15" font-weight="700" fill="#6d28d9">2  Run EVERY microtask</text>
  <text x="870" y="296" font-size="13" fill="#64748b">including microtasks queued meanwhile</text>
  <line x1="1000" y1="310" x2="1000" y2="332" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="994,328 1006,328 1000,340" fill="#94a3b8"/>
  <rect x="850" y="342" width="300" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="870" y="370" font-size="15" font-weight="700" fill="#15803d">3  Render, if a frame is due</text>
  <text x="870" y="392" font-size="13" fill="#64748b">rAF callbacks, style, layout, paint</text>
  <path d="M1150 374 L1172 374 L1172 182 L1162 182" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1164,176 1164,188 1152,182" fill="#94a3b8"/>

  <!-- Incident -->
  <rect x="40" y="458" width="1110" height="96" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="490" font-size="16" font-weight="700" fill="#b91c1c">The top-up incident</text>
  <text x="64" y="516" font-size="14" fill="#334155">showModal sits in the microtask queue, renderBalance in the task queue. Step 2 always comes before the next step 1,</text>
  <text x="64" y="538" font-size="14" fill="#334155">so the modal reads the balance from the DOM before the render task has written it: "New balance: $0.00".</text>
</svg>
