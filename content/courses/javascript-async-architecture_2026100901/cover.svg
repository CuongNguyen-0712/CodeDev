<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: JavaScript asynchronous architecture (event loop, task queues, promises). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1426"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DF1E"/>
      <stop offset="0.5" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="110" y="150" width="96" height="96" rx="16" fill="#F7DF1E"/>
    <text x="194" y="230" text-anchor="end" font-size="52" font-weight="800" fill="#16120A">JS</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#F7DF1E">JAVASCRIPT · ASYNC</text>
    <text x="106" y="430" font-size="86" font-weight="800" fill="#F4F2F8">Asynchronous</text>
    <text x="106" y="530" font-size="86" font-weight="800" fill="#F4F2F8">Architecture</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Event loop · Promises · Concurrency control</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#D2C6FE">
      <rect x="110" y="660" width="210" height="52" rx="26" fill="#2A2142" stroke="#57439A"/>
      <text x="215" y="695" text-anchor="middle">await</text>
      <rect x="336" y="660" width="250" height="52" rx="26" fill="#2A2142" stroke="#57439A"/>
      <text x="461" y="695" text-anchor="middle">AbortSignal</text>
      <rect x="602" y="660" width="190" height="52" rx="26" fill="#2A2142" stroke="#57439A"/>
      <text x="697" y="695" text-anchor="middle">retry</text>
    </g>
  </g>

  <!-- Event loop -->
  <g transform="translate(1180 450)">
    <circle r="210" fill="#15111F" stroke="#2D2839" stroke-width="2"/>
    <circle r="170" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round" stroke-dasharray="880 188" transform="rotate(-70)"/>
    <!-- arrowhead at the end of the arc: the loop keeps turning clockwise -->
    <polygon points="-87.6,-151.1 -99.9,-114.6 -124.7,-140.8" fill="#FACC15"/>
    <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
      <text y="-8" font-size="40" font-weight="800" fill="#F4F2F8">Event</text>
      <text y="42" font-size="40" font-weight="800" fill="#F4F2F8">Loop</text>
    </g>
  </g>

  <!-- Call stack (left of loop) -->
  <g font-family="Consolas, Menlo, monospace" font-size="22" fill="#EEEBF4">
    <text x="770" y="292" fill="#ABA5BB" font-size="20" letter-spacing="3">CALL STACK</text>
    <rect x="770" y="306" width="150" height="46" rx="8" fill="#2D2839" stroke="#4A4458"/>
    <text x="786" y="336">fetch()</text>
    <rect x="770" y="360" width="150" height="46" rx="8" fill="#2D2839" stroke="#4A4458"/>
    <text x="786" y="390">render()</text>
    <rect x="770" y="414" width="150" height="46" rx="8" fill="#7C3AED"/>
    <text x="786" y="444" fill="#FFFFFF">main()</text>
  </g>

  <!-- Queues (below the loop) -->
  <g font-family="Consolas, Menlo, monospace" font-size="20">
    <text x="1000" y="726" fill="#C4B5FD" letter-spacing="3">MICROTASKS</text>
    <rect x="1000" y="740" width="70" height="34" rx="17" fill="#7C3AED"/>
    <rect x="1080" y="740" width="70" height="34" rx="17" fill="#8B5CF6"/>
    <rect x="1160" y="740" width="70" height="34" rx="17" fill="#A78BFA"/>
    <text x="1260" y="726" fill="#FDBA74" letter-spacing="3">MACROTASKS</text>
    <rect x="1260" y="740" width="70" height="34" rx="8" fill="#FB923C"/>
    <rect x="1340" y="740" width="70" height="34" rx="8" fill="#F59E0B"/>
  </g>
</svg>
