<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Lazy pagination: the consumer pulls, pages are fetched on demand</text>
  <text x="40" y="82" font-size="16" fill="#475569">Every next() travels down the chain; a page is requested only when the previous one is used up.</text>

  <!-- pull direction -->
  <text x="40" y="124" font-size="14" font-weight="600" fill="#b45309">next() - pull requests travel toward the API</text>
  <line x1="40" y1="138" x2="1156" y2="138" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- chain -->
  <rect x="40" y="156" width="170" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">for await</text>
  <text x="125" y="214" font-size="13" text-anchor="middle" fill="#1d4ed8">renders rows</text>

  <rect x="230" y="156" width="170" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="315" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">take(50)</text>
  <text x="315" y="214" font-size="13" text-anchor="middle" fill="#6d28d9">stops after 50</text>

  <rect x="420" y="156" width="170" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="505" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">filter()</text>
  <text x="505" y="214" font-size="13" text-anchor="middle" fill="#6d28d9">flagged only</text>

  <rect x="610" y="156" width="170" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="695" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">map()</text>
  <text x="695" y="214" font-size="13" text-anchor="middle" fill="#6d28d9">toRow()</text>

  <rect x="800" y="156" width="170" height="80" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="885" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">paginate()</text>
  <text x="885" y="214" font-size="13" text-anchor="middle" fill="#0e7490">async function*</text>

  <rect x="990" y="156" width="170" height="80" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1075" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Orders API</text>
  <text x="1075" y="214" font-size="13" text-anchor="middle" fill="#475569">fetchPage(cursor)</text>

  <!-- value direction -->
  <line x1="1160" y1="254" x2="44" y2="254" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="1160" y="278" font-size="14" font-weight="600" text-anchor="end" fill="#0e7490">{ value, done } - one item at a time travels back to the consumer</text>

  <!-- pages strip -->
  <text x="40" y="324" font-size="17" font-weight="700" fill="#0f172a">Pages requested to show 50 flagged orders (100 orders per page, about 1 in 6 flagged)</text>

  <rect x="40" y="340" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="368" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">page 1</text>
  <text x="115" y="392" font-size="12" text-anchor="middle" fill="#166534">fetched (cursor null)</text>

  <rect x="210" y="340" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="285" y="368" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">page 2</text>
  <text x="285" y="392" font-size="12" text-anchor="middle" fill="#166534">fetched (cursor c2)</text>

  <rect x="380" y="340" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="455" y="368" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">page 3</text>
  <text x="455" y="392" font-size="12" text-anchor="middle" fill="#166534">fetched (cursor c3)</text>

  <rect x="550" y="340" width="150" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="625" y="368" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">page 4</text>
  <text x="625" y="392" font-size="13" text-anchor="middle" fill="#64748b">never requested</text>

  <rect x="720" y="340" width="150" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="795" y="368" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">page 5</text>
  <text x="795" y="392" font-size="13" text-anchor="middle" fill="#64748b">never requested</text>

  <text x="930" y="382" font-size="22" font-weight="700" text-anchor="middle" fill="#94a3b8">...</text>

  <rect x="990" y="340" width="170" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1075" y="368" font-size="15" font-weight="700" text-anchor="middle" fill="#64748b">page 1,900</text>
  <text x="1075" y="392" font-size="13" text-anchor="middle" fill="#64748b">never requested</text>

  <!-- early exit -->
  <text x="40" y="460" font-size="17" font-weight="700" fill="#0f172a">Early exit closes the whole chain</text>

  <rect x="40" y="478" width="240" height="72" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="508" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">50th row rendered</text>
  <text x="160" y="532" font-size="13" text-anchor="middle" fill="#6d28d9">take() returns</text>

  <line x1="282" y1="514" x2="316" y2="514" stroke="#334155" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <rect x="320" y="478" width="240" height="72" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="508" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">for await exits</text>
  <text x="440" y="532" font-size="13" text-anchor="middle" fill="#b45309">calls source.return()</text>

  <line x1="562" y1="514" x2="596" y2="514" stroke="#334155" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <rect x="600" y="478" width="240" height="72" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="720" y="508" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">paginate resumes</text>
  <text x="720" y="532" font-size="13" text-anchor="middle" fill="#0e7490">at its yield, as a return</text>

  <line x1="842" y1="514" x2="876" y2="514" stroke="#334155" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <rect x="880" y="478" width="280" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="508" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">finally { } runs</text>
  <text x="1020" y="532" font-size="13" text-anchor="middle" fill="#166534">no request for page 4</text>
</svg>
