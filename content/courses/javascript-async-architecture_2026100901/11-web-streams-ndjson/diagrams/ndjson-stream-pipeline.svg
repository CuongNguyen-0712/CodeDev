<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Parsing an NDJSON export while it downloads</text>
  <text x="40" y="82" font-size="16" fill="#475569">Bytes flow right through pipeThrough(); demand flows left, so a slow consumer slows the download.</text>

  <!-- pipeline -->
  <rect x="40" y="122" width="196" height="86" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="138" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Export API</text>
  <text x="138" y="182" font-size="13" text-anchor="middle" fill="#475569">NDJSON over HTTP</text>

  <line x1="239" y1="165" x2="268" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="271" y="122" width="196" height="86" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="369" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">response.body</text>
  <text x="369" y="182" font-size="12" text-anchor="middle" fill="#0e7490">ReadableStream of Uint8Array</text>

  <line x1="470" y1="165" x2="499" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="502" y="122" width="196" height="86" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">TextDecoderStream</text>
  <text x="600" y="182" font-size="13" text-anchor="middle" fill="#6d28d9">bytes to text</text>

  <line x1="701" y1="165" x2="730" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="733" y="122" width="196" height="86" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="831" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">NDJSON transform</text>
  <text x="831" y="182" font-size="13" text-anchor="middle" fill="#6d28d9">text to row objects</text>

  <line x1="932" y1="165" x2="961" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="964" y="122" width="196" height="86" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1062" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Consumer</text>
  <text x="1062" y="182" font-size="13" text-anchor="middle" fill="#166534">appends table rows</text>

  <!-- backpressure -->
  <line x1="1160" y1="232" x2="44" y2="232" stroke="#be123c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowRose)"/>
  <text x="1160" y="256" font-size="14" font-weight="600" text-anchor="end" fill="#be123c">backpressure: a stage pulls from the one before only while its queue is below highWaterMark</text>

  <!-- raw chunks -->
  <text x="40" y="306" font-size="17" font-weight="700" fill="#0f172a">What reader.read() really delivers</text>

  <rect x="40" y="322" width="360" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="56" y="359" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">chunk 1: {"id":1,"name":"Caf<tspan dx="8" fill="#be123c" font-weight="700">C3</tspan></text>
  <text x="40" y="408" font-size="13" fill="#be123c">ends inside the 2-byte "é" (C3 | A9)</text>

  <rect x="420" y="322" width="360" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="436" y="359" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">chunk 2: <tspan fill="#be123c" font-weight="700">A9</tspan><tspan dx="8">"}</tspan>\n{"id":2,"na</text>
  <text x="420" y="408" font-size="13" fill="#b45309">ends in the middle of row 2</text>

  <rect x="800" y="322" width="360" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="816" y="359" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">chunk 3: me":"Bo"}\n{"id":3,</text>
  <text x="800" y="408" font-size="13" fill="#b45309">the rest of row 2, the start of row 3</text>

  <!-- clean rows -->
  <text x="40" y="460" font-size="17" font-weight="700" fill="#0f172a">After TextDecoder with { stream: true } and a line buffer</text>

  <rect x="40" y="476" width="360" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="510" font-size="15" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#166534">{"id":1,"name":"Café"}</text>

  <rect x="420" y="476" width="360" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="510" font-size="15" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#166534">{"id":2,"name":"Bo"}</text>

  <rect x="800" y="476" width="360" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="980" y="510" font-size="15" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#64748b">{"id":3,   waits for "\n"</text>

  <text x="40" y="578" font-size="14" fill="#475569">Incomplete bytes wait inside the decoder, an incomplete line waits in the parser's buffer: nothing is lost and nothing is parsed twice.</text>
</svg>
