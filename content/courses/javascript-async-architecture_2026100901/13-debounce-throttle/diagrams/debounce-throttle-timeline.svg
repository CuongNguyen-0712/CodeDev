<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One stream of events, four ways to shape it</text>
  <text x="40" y="82" font-size="16" fill="#475569">Grey ticks are raw input events. Dots are the moments your handler actually runs.</text>
  <text x="40" y="166" font-size="18" font-weight="700" fill="#334155">Input events</text>
  <text x="40" y="188" font-size="13" fill="#64748b">keystrokes / scroll / resize</text>
  <line x1="250" y1="172" x2="1150" y2="172" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="260" y1="156" x2="260" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="284" y1="156" x2="284" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="308" y1="156" x2="308" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="332" y1="156" x2="332" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="356" y1="156" x2="356" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="380" y1="156" x2="380" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="404" y1="156" x2="404" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="620" y1="156" x2="620" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="660" y1="156" x2="660" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="700" y1="156" x2="700" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="740" y1="156" x2="740" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="780" y1="156" x2="780" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="820" y1="156" x2="820" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="860" y1="156" x2="860" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="900" y1="156" x2="900" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="940" y1="156" x2="940" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="980" y1="156" x2="980" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="1020" y1="156" x2="1020" y2="188" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 136 L260 128 L404 128 L404 136" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="332" y="120" font-size="13" text-anchor="middle" fill="#64748b">short burst</text>
  <path d="M620 136 L620 128 L1020 128 L1020 136" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="820" y="120" font-size="13" text-anchor="middle" fill="#64748b">long burst (user never pauses for 200 ms)</text>
  <text x="40" y="244" font-size="18" font-weight="700" fill="#0e7490">Trailing debounce</text>
  <text x="40" y="266" font-size="13" fill="#64748b">wait 200 ms</text>
  <line x1="250" y1="250" x2="1150" y2="250" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="484" cy="250" r="9" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1100" cy="250" r="9" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
  <text x="40" y="324" font-size="18" font-weight="700" fill="#6d28d9">Leading debounce</text>
  <text x="40" y="346" font-size="13" fill="#64748b">wait 200 ms, no trailing</text>
  <line x1="250" y1="330" x2="1150" y2="330" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="260" cy="330" r="9" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <circle cx="620" cy="330" r="9" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <text x="40" y="404" font-size="18" font-weight="700" fill="#b45309">Debounce + maxWait</text>
  <text x="40" y="426" font-size="13" fill="#64748b">wait 200, maxWait 600</text>
  <line x1="250" y1="410" x2="1150" y2="410" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="484" cy="410" r="9" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <circle cx="860" cy="410" r="9" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1100" cy="410" r="9" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="40" y="484" font-size="18" font-weight="700" fill="#15803d">Throttle</text>
  <text x="40" y="506" font-size="13" fill="#64748b">every 300 ms, leading + trailing</text>
  <line x1="250" y1="490" x2="1150" y2="490" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="260" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="380" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="620" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="740" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="860" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="980" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1100" cy="490" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <text x="1100" y="232" font-size="12" text-anchor="middle" fill="#0e7490">fires only after the pause</text>
  <text x="860" y="392" font-size="12" text-anchor="middle" fill="#b45309">forced by maxWait</text>
  <line x1="260" y1="545" x2="1150" y2="545" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1150,539 1162,545 1150,551" fill="#94a3b8"/>
  <line x1="260" y1="540" x2="260" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="570" font-size="13" text-anchor="middle" fill="#64748b">0 ms</text>
  <line x1="460" y1="540" x2="460" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <text x="460" y="570" font-size="13" text-anchor="middle" fill="#64748b">500 ms</text>
  <line x1="660" y1="540" x2="660" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <text x="660" y="570" font-size="13" text-anchor="middle" fill="#64748b">1000 ms</text>
  <line x1="860" y1="540" x2="860" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <text x="860" y="570" font-size="13" text-anchor="middle" fill="#64748b">1500 ms</text>
  <line x1="1060" y1="540" x2="1060" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <text x="1060" y="570" font-size="13" text-anchor="middle" fill="#64748b">2000 ms</text>
</svg>
