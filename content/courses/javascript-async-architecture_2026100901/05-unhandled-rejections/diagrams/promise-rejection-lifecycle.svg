<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">When does a rejection become "unhandled"?</text>
  <text x="40" y="82" font-size="16" fill="#475569">The runtime waits until the current task and its microtasks are done, then reports every rejected promise without a handler.</text>

  <!-- start -->
  <rect x="40" y="140" width="220" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="150" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Promise rejects</text>
  <text x="150" y="204" font-size="13" text-anchor="middle" fill="#475569">fetch fails, reject(err), throw</text>

  <line x1="262" y1="185" x2="326" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision -->
  <rect x="330" y="130" width="300" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="166" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Handler attached before the</text>
  <text x="480" y="188" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">task and its microtasks end?</text>
  <text x="480" y="216" font-size="13" text-anchor="middle" fill="#6d28d9">await, .catch, .then(f, r), Promise.all ...</text>

  <!-- yes -->
  <line x1="632" y1="185" x2="696" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664" y="174" font-size="13" font-weight="700" text-anchor="middle" fill="#16a34a">yes</text>
  <rect x="700" y="130" width="460" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="166" font-size="17" font-weight="700" fill="#166534">Handled</text>
  <text x="720" y="192" font-size="14" fill="#0f172a">The error reaches your code: a catch block, a fallback,</text>
  <text x="720" y="214" font-size="14" fill="#0f172a">an error state in the UI. Nothing is reported globally.</text>

  <!-- no -->
  <line x1="480" y1="242" x2="480" y2="296" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="494" y="274" font-size="13" font-weight="700" fill="#dc2626">no</text>
  <rect x="330" y="300" width="300" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="338" font-size="17" font-weight="700" text-anchor="middle" fill="#991b1b">Unhandled rejection</text>
  <text x="480" y="364" font-size="13" text-anchor="middle" fill="#b91c1c">reported once, at the end of that task</text>
  <text x="480" y="384" font-size="13" text-anchor="middle" fill="#b91c1c">the error never reaches your code</text>

  <line x1="632" y1="330" x2="696" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="632" y1="370" x2="696" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="270" width="460" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="302" font-size="16" font-weight="700" fill="#1d4ed8">Browser (window or worker)</text>
  <text x="720" y="328" font-size="14" fill="#0f172a">unhandledrejection event, console: Uncaught (in promise)</text>
  <text x="720" y="352" font-size="14" fill="#0f172a">error-tracking SDK captures it - the page keeps running</text>

  <rect x="700" y="390" width="460" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="720" y="422" font-size="16" font-weight="700" fill="#92400e">Node.js 15+</text>
  <text x="720" y="448" font-size="14" fill="#0f172a">unhandledRejection, then the process exits (default mode)</text>

  <!-- late handler -->
  <line x1="480" y1="402" x2="480" y2="476" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="494" y="446" font-size="13" fill="#475569">handler attached later</text>
  <rect x="40" y="480" width="590" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="60" y="512" font-size="16" font-weight="700" fill="#334155">Handled late: rejectionhandled (Node: rejectionHandled)</text>
  <text x="60" y="538" font-size="14" fill="#0f172a">The report already went out. Attach handlers when the promise</text>
  <text x="60" y="558" font-size="14" fill="#0f172a">is created - not after the next await.</text>

  <rect x="700" y="490" width="460" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="522" font-size="16" font-weight="700" fill="#166534">Fix at the source</text>
  <text x="720" y="548" font-size="14" fill="#0f172a">await it, join it, or detach it with a .catch handler</text>
</svg>
