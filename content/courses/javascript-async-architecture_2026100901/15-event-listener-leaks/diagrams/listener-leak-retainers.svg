<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">How one forgotten listener keeps a whole view alive</text>
  <text x="40" y="82" font-size="16" fill="#475569">The view left the DOM, but long-lived objects still reference closures that reference it.</text>
  <text x="170" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Alive after the route change</text>
  <text x="560" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Listener closures</text>
  <text x="990" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">What they keep alive</text>
  <rect x="40" y="150" width="260" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="177" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">window</text>
  <text x="170" y="198" font-size="13" text-anchor="middle" fill="#475569">resize, keydown, scroll</text>
  <line x1="300" y1="181" x2="426" y2="181" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="150" width="260" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="560" y="177" font-size="15" text-anchor="middle" fill="#7c2d12" font-family="Consolas, 'Courier New', monospace">() =&gt; layout(panel)</text>
  <text x="560" y="198" font-size="13" text-anchor="middle" fill="#9a3412">inline arrow, never removed</text>
  <path d="M690 181 C 750 181, 760 305, 816 305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="240" width="260" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="267" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">WebSocket</text>
  <text x="170" y="288" font-size="13" text-anchor="middle" fill="#475569">one per session</text>
  <line x1="300" y1="271" x2="426" y2="271" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="240" width="260" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="560" y="267" font-size="15" text-anchor="middle" fill="#7c2d12" font-family="Consolas, 'Courier New', monospace">onMessage(event)</text>
  <text x="560" y="288" font-size="13" text-anchor="middle" fill="#9a3412">subscribed, no unsubscribe</text>
  <path d="M690 271 C 750 271, 760 305, 816 305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="260" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="357" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">price store</text>
  <text x="170" y="378" font-size="13" text-anchor="middle" fill="#475569">shared singleton</text>
  <line x1="300" y1="361" x2="426" y2="361" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="330" width="260" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="560" y="357" font-size="15" text-anchor="middle" fill="#7c2d12" font-family="Consolas, 'Courier New', monospace">(price) =&gt; render(price)</text>
  <text x="560" y="378" font-size="13" text-anchor="middle" fill="#9a3412">return value ignored</text>
  <path d="M690 361 C 750 361, 760 305, 816 305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="420" width="260" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="447" font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a">timer list</text>
  <text x="170" y="468" font-size="13" text-anchor="middle" fill="#475569">setInterval(id)</text>
  <line x1="300" y1="451" x2="426" y2="451" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="420" width="260" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="560" y="447" font-size="15" text-anchor="middle" fill="#7c2d12" font-family="Consolas, 'Courier New', monospace">() =&gt; poll(stock)</text>
  <text x="560" y="468" font-size="13" text-anchor="middle" fill="#9a3412">clearInterval missing</text>
  <path d="M690 451 C 750 451, 760 305, 816 305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="820" y="150" width="340" height="332" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="990" y="182" font-size="16" font-weight="700" text-anchor="middle" fill="#b91c1c">Unmounted conversation view</text>
  <text x="990" y="204" font-size="13" text-anchor="middle" fill="#b91c1c">detached from the document, never freed</text>
  <rect x="850" y="226" width="280" height="64" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="990" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">&lt;div class=conversation&gt;</text>
  <text x="990" y="275" font-size="13" text-anchor="middle" fill="#64748b">+ 2,000 message nodes</text>
  <rect x="850" y="308" width="280" height="64" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="990" y="336" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">component state</text>
  <text x="990" y="357" font-size="13" text-anchor="middle" fill="#64748b">message cache, drafts</text>
  <rect x="850" y="390" width="280" height="64" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="990" y="418" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">images and canvases</text>
  <text x="990" y="439" font-size="13" text-anchor="middle" fill="#64748b">decoded bitmaps</text>
  <rect x="40" y="520" width="1120" height="84" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="553" font-size="17" font-weight="700" text-anchor="middle" fill="#15803d">Cleanup cuts every arrow on the left: controller.abort() for { signal } listeners, unsubscribe(), clearInterval(id)</text>
  <text x="600" y="580" font-size="14" text-anchor="middle" fill="#166534">Nothing reachable from a long-lived object points into the view any more, so the garbage collector frees all of it.</text>
</svg>
