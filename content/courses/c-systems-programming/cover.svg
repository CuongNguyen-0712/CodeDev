<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Systems programming in C (ring buffer with head/tail, arena allocator). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#659AD2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#659AD2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A8B9CC"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#659AD2"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <polygon points="158,146 204,172 204,224 158,250 112,224 112,172" fill="#659AD2"/>
    <text x="158" y="213.64" text-anchor="middle" font-size="46" font-weight="800" fill="#0B0F18">C</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#A8B9CC">C · SYSTEMS PROGRAMMING</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Allocators, Rings</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">&amp; Parsers</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Arenas · Alignment · Hash tables · Bit flags</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CFE0F4">
      <rect x="110" y="660" width="136" height="52" rx="26" fill="#152031" stroke="#659AD2"/>
      <text x="178" y="695" text-anchor="middle">arena</text>
      <rect x="262" y="660" width="164" height="52" rx="26" fill="#152031" stroke="#659AD2"/>
      <text x="344" y="695" text-anchor="middle">alignof</text>
      <rect x="442" y="660" width="178" height="52" rx="26" fill="#152031" stroke="#659AD2"/>
      <text x="531" y="695" text-anchor="middle">ring[16]</text>
      <rect x="636" y="660" width="93" height="52" rx="26" fill="#152031" stroke="#659AD2"/>
      <text x="682.5" y="695" text-anchor="middle">UB</text>
    </g>
  </g>

