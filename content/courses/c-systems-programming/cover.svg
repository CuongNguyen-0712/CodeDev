    <path d="M1127.5 601.5 A162 162 0 0 1 1074.9 611.9 L1072.9 546.0 A96 96 0 0 0 1104.1 539.8 Z" fill="#659AD2" fill-opacity="0.71" stroke="#659AD2" stroke-width="2"/>
    <path d="M1065.1 611.9 A162 162 0 0 1 1012.5 601.5 L1035.9 539.8 A96 96 0 0 0 1067.1 546.0 Z" fill="#659AD2" fill-opacity="0.80" stroke="#659AD2" stroke-width="2"/>
    <path d="M1003.5 597.7 A162 162 0 0 1 958.9 567.9 L1004.2 519.9 A96 96 0 0 0 1030.6 537.6 Z" fill="#659AD2" fill-opacity="0.89" stroke="#659AD2" stroke-width="2"/>
    <path d="M952.1 561.1 A162 162 0 0 1 922.3 516.5 L982.4 489.4 A96 96 0 0 0 1000.1 515.8 Z" fill="#151C29" fill-opacity="1" stroke="#2C3E57" stroke-width="2"/>
    <path d="M918.5 507.5 A162 162 0 0 1 908.1 454.9 L974.0 452.9 A96 96 0 0 0 980.2 484.1 Z" fill="#151C29" fill-opacity="1" stroke="#2C3E57" stroke-width="2"/>
    <path d="M908.1 445.1 A162 162 0 0 1 918.5 392.5 L980.2 415.9 A96 96 0 0 0 974.0 447.1 Z" fill="#151C29" fill-opacity="1" stroke="#2C3E57" stroke-width="2"/>
    <path d="M922.3 383.5 A162 162 0 0 1 952.1 338.9 L1000.1 384.2 A96 96 0 0 0 982.4 410.6 Z" fill="#151C29" fill-opacity="1" stroke="#2C3E57" stroke-width="2"/>
    <path d="M958.9 332.1 A162 162 0 0 1 1003.5 302.3 L1030.6 362.4 A96 96 0 0 0 1004.2 380.1 Z" fill="#151C29" fill-opacity="1" stroke="#2C3E57" stroke-width="2"/>
    <path d="M1012.5 298.5 A162 162 0 0 1 1065.1 288.1 L1067.1 354.0 A96 96 0 0 0 1035.9 360.2 Z" fill="#151C29" fill-opacity="1" stroke="#2C3E57" stroke-width="2"/>
    <circle cx="1070" cy="450" r="82" fill="#151C29" stroke="#2C3E57" stroke-width="2"/>
    <text x="1070" y="444" font-family="Consolas, Menlo, monospace" font-size="30" fill="#F4F2F8" text-anchor="middle" font-weight="700">ring</text>
    <text x="1070" y="478" font-family="Consolas, Menlo, monospace" font-size="22" fill="#B8B2C8" text-anchor="middle">7 / 16</text>
    <path d="M1279 364 L1233 383" stroke="#A8B9CC" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1239" y="350" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#A8B9CC" text-anchor="start">TAIL</text>
    <path d="M910 610 L946 574" stroke="#F2C14E" stroke-width="4" marker-end="url(#arrowAmber)"/>
    <text x="922" y="640" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#F2C14E" text-anchor="start">HEAD</text>
    <text x="1360" y="268" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#A8B9CC" text-anchor="start">ARENA</text>
    <rect x="1360" y="290" width="80" height="380" rx="12" fill="#151C29" stroke="#2C3E57" stroke-width="2"/>
    <rect x="1368" y="298" width="64" height="70" rx="6" fill="#659AD2" fill-opacity="0.9"/>
    <rect x="1368" y="374" width="64" height="40" rx="6" fill="#659AD2" fill-opacity="0.65"/>
    <rect x="1368" y="420" width="64" height="96" rx="6" fill="#659AD2" fill-opacity="0.45"/>
    <path d="M1450 524 H1500" stroke="#F2C14E" stroke-width="4" marker-start="url(#arrowAmber)"/>
    <text x="1508" y="532" font-family="Consolas, Menlo, monospace" font-size="22" fill="#F2C14E" >top</text>
    <text x="1460" y="360" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >align 16</text>
  </g>
</svg>
