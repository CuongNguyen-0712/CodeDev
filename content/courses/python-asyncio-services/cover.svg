<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Async Python services (TaskGroup timeline, timeout cancelling a task, bounded queue). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3776AB" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3776AB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFD43B"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3776AB"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="146" width="62" height="62" rx="16" fill="#3776AB"/>
    <rect x="142" y="176" width="62" height="62" rx="16" fill="#FFD43B"/>
    <circle cx="132" cy="166" r="6" fill="#0F1724"/>
    <circle cx="184" cy="218" r="6" fill="#0F1724"/>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#FFD43B">PYTHON · ASYNCIO</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Async Python</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Services</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">TaskGroup · Timeouts · Backpressure</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CFE0F4">
      <rect x="110" y="660" width="193" height="52" rx="26" fill="#14223A" stroke="#3776AB"/>
      <text x="206.5" y="695" text-anchor="middle">TaskGroup</text>
      <rect x="319" y="660" width="193" height="52" rx="26" fill="#14223A" stroke="#3776AB"/>
      <text x="415.5" y="695" text-anchor="middle">timeout()</text>
      <rect x="528" y="660" width="193" height="52" rx="26" fill="#14223A" stroke="#3776AB"/>
      <text x="624.5" y="695" text-anchor="middle">Queue(10)</text>
    </g>
  </g>

  <!-- Tasks in one TaskGroup run concurrently; the timeout cancels the slow one and the group waits for all -->
  <g id="art">
    <text x="900" y="254" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#FFD43B" text-anchor="start">async with TaskGroup()</text>
    <rect x="930" y="276" width="600" height="320" rx="18" fill="none" stroke="#FFD43B" stroke-opacity="0.6" stroke-width="2"/>
    <text x="900" y="322" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >t1</text>
    <rect x="960" y="300" width="300" height="30" rx="15" fill="#3776AB" fill-opacity="0.85"/>
    <text x="900" y="378" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >t2</text>
    <rect x="1000" y="356" width="380" height="30" rx="15" fill="#3776AB" fill-opacity="0.85"/>
    <text x="900" y="434" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >t3</text>
    <rect x="940" y="412" width="230" height="30" rx="15" fill="#3776AB" fill-opacity="0.85"/>
    <text x="900" y="490" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >t4</text>
    <rect x="1060" y="468" width="340" height="30" rx="15" fill="#3776AB" fill-opacity="0.85"/>
    <rect x="1400" y="468" width="80" height="30" rx="15" fill="#F2555A" fill-opacity="0.25" stroke="#F2555A" stroke-dasharray="6 6"/>
    <text x="900" y="546" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >t5</text>
    <rect x="990" y="524" width="260" height="30" rx="15" fill="#3776AB" fill-opacity="0.85"/>
    <path d="M1400 284 V588" stroke="#F2555A" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="1410" y="310" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F2555A" >timeout</text>
    <text x="900" y="642" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#FFD43B" text-anchor="start">QUEUE</text>
    <rect x="1020" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1060" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1100" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1140" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1180" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1220" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1260" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1300" y="618" width="32" height="32" rx="6" fill="#FFD43B" fill-opacity="0.8" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1340" y="618" width="32" height="32" rx="6" fill="#141C2C" fill-opacity="1" stroke="#FFD43B" stroke-opacity="0.5"/>
    <rect x="1380" y="618" width="32" height="32" rx="6" fill="#141C2C" fill-opacity="1" stroke="#FFD43B" stroke-opacity="0.5"/>
    <text x="1430" y="642" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >8/10</text>
  </g>
</svg>
