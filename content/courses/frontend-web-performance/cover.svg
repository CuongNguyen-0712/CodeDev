<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Frontend performance (Core Web Vitals and a long task split by yielding to the main thread). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17160D"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7DF1E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F7DF1E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFF0A0"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F7DF1E"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3DBE7B"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#F7DF1E"/>
    <text x="194" y="232" text-anchor="end" font-size="40" font-weight="800" fill="#17160D">JS</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#FFF0A0">JAVASCRIPT · WEB PERFORMANCE</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Frontend</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Performance</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Web Vitals · Long tasks · Caching · Budgets</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#FBF1B4">
      <rect x="110" y="660" width="107" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="163.5" y="695" text-anchor="middle">LCP</text>
      <rect x="233" y="660" width="107" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="286.5" y="695" text-anchor="middle">INP</text>
      <rect x="356" y="660" width="107" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="409.5" y="695" text-anchor="middle">CLS</text>
      <rect x="479" y="660" width="164" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="561" y="695" text-anchor="middle">yield()</text>
    </g>
  </g>

  <!-- Field metrics against their thresholds, and one long task split into chunks so input runs in between -->
  <g id="art" font-family="Consolas, Menlo, monospace">
    <text x="900" y="254" font-size="20" letter-spacing="3" fill="#FFF0A0">CORE WEB VITALS</text>
    <rect x="900" y="272" width="198" height="132" rx="14" fill="#1B1A12" stroke="#3DBE7B" stroke-width="2"/>
    <text x="922" y="306" font-size="20" fill="#B8B2C8">LCP</text>
    <text x="922" y="356" font-size="38" font-weight="700" fill="#3DBE7B">2.1 s</text>
    <text x="922" y="388" font-size="16" fill="#6F6A80">good ≤ 2.5 s</text>
    <rect x="1116" y="272" width="198" height="132" rx="14" fill="#1B1A12" stroke="#F2C14E" stroke-width="2"/>
    <text x="1138" y="306" font-size="20" fill="#B8B2C8">INP</text>
    <text x="1138" y="356" font-size="38" font-weight="700" fill="#F2C14E">380 ms</text>
    <text x="1138" y="388" font-size="16" fill="#6F6A80">good ≤ 200 ms</text>
    <rect x="1332" y="272" width="198" height="132" rx="14" fill="#1B1A12" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1354" y="306" font-size="20" fill="#B8B2C8">CLS</text>
    <text x="1354" y="356" font-size="38" font-weight="700" fill="#3DBE7B">0.02</text>
    <text x="1354" y="388" font-size="16" fill="#6F6A80">good ≤ 0.1</text>
    <text x="900" y="464" font-size="20" letter-spacing="3" fill="#FFF0A0">MAIN THREAD</text>
    <text x="900" y="512" font-size="20" fill="#B8B2C8">before</text>
    <rect x="1000" y="486" width="40" height="36" rx="6" fill="#4A4420"/>
    <rect x="1048" y="486" width="400" height="36" rx="6" fill="#F2555A" fill-opacity="0.75"/>
    <text x="1248" y="511" font-size="20" fill="#F4F2F8" text-anchor="middle">long task 220 ms</text>
    <path d="M1460 470 V530" stroke="#F2C14E" stroke-width="3"/>
    <text x="1468" y="512" font-size="18" fill="#F2C14E">click</text>
    <text x="900" y="592" font-size="20" fill="#B8B2C8">after</text>
    <rect x="1000" y="566" width="40" height="36" rx="6" fill="#4A4420"/>
    <rect x="1048" y="566" width="76" height="36" rx="6" fill="#3DBE7B" fill-opacity="0.7"/>
    <rect x="1140" y="566" width="76" height="36" rx="6" fill="#3DBE7B" fill-opacity="0.7"/>
    <rect x="1232" y="566" width="76" height="36" rx="6" fill="#3DBE7B" fill-opacity="0.7"/>
    <rect x="1324" y="566" width="76" height="36" rx="6" fill="#3DBE7B" fill-opacity="0.7"/>
    <rect x="1416" y="566" width="76" height="36" rx="6" fill="#3DBE7B" fill-opacity="0.7"/>
    <path d="M1132 552 V616" stroke="#F2C14E" stroke-width="3"/>
    <text x="1140" y="636" font-size="18" fill="#F2C14E">click handled</text>
    <text x="900" y="682" font-size="20" fill="#F4F2F8"><tspan fill="#82AAFF">scheduler.yield</tspan>() between chunks</text>
  </g>
</svg>
