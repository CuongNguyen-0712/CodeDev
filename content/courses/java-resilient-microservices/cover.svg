<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Resilient Java microservices (circuit breaker states, retries, transactional outbox). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19130E"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F89820" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F89820" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7FA7C9"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F89820"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#F89820"/>
    <path d="M140 172 q8 -10 0 -18 M158 172 q8 -10 0 -18 M176 172 q8 -10 0 -18" fill="none" stroke="#2A1D10" stroke-width="4" stroke-linecap="round"/>
    <text x="158" y="232" text-anchor="middle" font-size="48" font-weight="800" fill="#2A1D10">J</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#7FA7C9">JAVA · MICROSERVICES</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Resilient</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Microservices</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Retries · Circuit breakers · Outbox · Sagas</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#FCE0BC">
      <rect x="110" y="660" width="164" height="52" rx="26" fill="#2A1D10" stroke="#F89820"/>
      <text x="192" y="695" text-anchor="middle">timeout</text>
      <rect x="290" y="660" width="164" height="52" rx="26" fill="#2A1D10" stroke="#F89820"/>
      <text x="372" y="695" text-anchor="middle">breaker</text>
      <rect x="470" y="660" width="150" height="52" rx="26" fill="#2A1D10" stroke="#F89820"/>
      <text x="545" y="695" text-anchor="middle">outbox</text>
      <rect x="636" y="660" width="121" height="52" rx="26" fill="#2A1D10" stroke="#F89820"/>
      <text x="696.5" y="695" text-anchor="middle">saga</text>
    </g>
  </g>

  <!-- Circuit breaker state machine: closed, open after failures, half-open to probe -->
  <g id="art">
    <text x="900" y="236" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#7FA7C9" text-anchor="start">CIRCUIT BREAKER</text>
    <circle cx="1000" cy="340" r="74" fill="#3DBE7B" fill-opacity="0.14" stroke="#3DBE7B" stroke-width="4"/>
    <text x="1000" y="348" font-family="Consolas, Menlo, monospace" font-size="24" fill="#3DBE7B" text-anchor="middle" font-weight="700">CLOSED</text>
    <circle cx="1420" cy="340" r="74" fill="#F2555A" fill-opacity="0.14" stroke="#F2555A" stroke-width="4"/>
    <text x="1420" y="348" font-family="Consolas, Menlo, monospace" font-size="24" fill="#F2555A" text-anchor="middle" font-weight="700">OPEN</text>
    <circle cx="1210" cy="580" r="74" fill="#F2C14E" fill-opacity="0.14" stroke="#F2C14E" stroke-width="4"/>
    <text x="1210" y="588" font-family="Consolas, Menlo, monospace" font-size="24" fill="#F2C14E" text-anchor="middle" font-weight="700">HALF-OPEN</text>
    <path d="M1080 320 C1180 280, 1240 280, 1340 320" stroke="#B8B2C8" stroke-width="3" fill="none" marker-end="url(#arrowMuted)"/>
    <text x="1210" y="270" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" text-anchor="middle">failures &gt; 50%</text>
    <path d="M1400 418 C1380 500, 1330 560, 1290 572" stroke="#B8B2C8" stroke-width="3" fill="none" marker-end="url(#arrowMuted)"/>
    <text x="1420" y="520" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >after 30s</text>
    <path d="M1132 566 C1080 540, 1030 480, 1012 420" stroke="#B8B2C8" stroke-width="3" fill="none" marker-end="url(#arrowMuted)"/>
    <text x="904" y="520" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >probe ok</text>
    <rect x="904" y="672" width="16" height="16" rx="3" fill="#F89820"/>
    <text x="932" y="686" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" >fail fast instead of piling up threads</text>
  </g>
</svg>
