<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: system design capstone (the learning platform: API, Postgres as source of truth, Redis leaderboard, queue and workers). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B9A4F5"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#7C3AED"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="6">
      <rect x="134" y="170" width="22" height="22" rx="4"/>
      <rect x="162" y="204" width="22" height="22" rx="4"/>
      <path d="M145 192 L145 215 L162 215"/>
    </g>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#B9A4F5">SYSTEM DESIGN · CAPSTONE</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">System Design</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Capstone</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Consistency · Caching · Backpressure · Recovery</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#E4DCFB">
      <rect x="110" y="660" width="96" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="158" y="695" text-anchor="middle">429</text>
      <rect x="222" y="660" width="150" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="297" y="695" text-anchor="middle">outbox</text>
      <rect x="388" y="660" width="236" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="506" y="695" text-anchor="middle">idempotency</text>
    </g>
  </g>

  <!-- Architecture -->
  <g font-family="Consolas, Menlo, monospace" font-size="20">
    <rect x="900" y="170" width="600" height="560" rx="18" fill="#15111F" stroke="#2C2440" stroke-width="2"/>

    <rect x="1080" y="200" width="240" height="64" rx="10" fill="#1E1533" stroke="#7C3AED"/>
    <text x="1200" y="240" text-anchor="middle" fill="#E4DCFB">web + API</text>

    <path d="M1150 266 L1060 340" stroke="#B9A4F5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1250 266 L1340 340" stroke="#B9A4F5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="930" y="344" width="230" height="84" rx="10" fill="#10241A" stroke="#3DBE7B"/>
    <text x="1045" y="380" text-anchor="middle" fill="#9FE3BF">PostgreSQL</text>
    <text x="1045" y="410" text-anchor="middle" font-size="17" fill="#B8B2C8">source of truth</text>

    <rect x="1240" y="344" width="230" height="84" rx="10" fill="#1E1533" stroke="#7C3AED"/>
    <text x="1355" y="380" text-anchor="middle" fill="#E4DCFB">Redis</text>
    <text x="1355" y="410" text-anchor="middle" font-size="17" fill="#B8B2C8">leaderboard, cache</text>

    <path d="M1162 386 L1236 386" stroke="#B9A4F5" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1200" y="460" text-anchor="middle" font-size="17" fill="#B8B2C8">rebuild</text>

    <rect x="930" y="500" width="230" height="64" rx="10" fill="#1E1533" stroke="#7C3AED"/>
    <text x="1045" y="539" text-anchor="middle" fill="#E4DCFB">submission queue</text>
    <rect x="1240" y="500" width="230" height="64" rx="10" fill="#1E1533" stroke="#7C3AED"/>
    <text x="1355" y="539" text-anchor="middle" fill="#E4DCFB">runner workers</text>
    <path d="M1162 532 L1236 532" stroke="#B9A4F5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="930" y="604" width="540" height="96" rx="10" fill="#2A1418" stroke="#F2555A"/>
    <text x="954" y="644" font-size="20" fill="#F2A3A6">Review: Redis down -&gt; API 500?</text>
    <text x="954" y="680" font-size="20" fill="#9FE3BF">Fix: fall back to Postgres, rebuild later</text>
  </g>
</svg>
