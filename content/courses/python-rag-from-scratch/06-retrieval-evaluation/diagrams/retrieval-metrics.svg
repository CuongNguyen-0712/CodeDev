<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">recall@k, MRR@k and hit rate@k for one query</text>
  <text x="40" y="82" font-size="16" fill="#475569">Query "how long do refunds take" · relevant: kb-refunds, kb-payments · k = 3</text>

  <!-- ranked list -->
  <text x="60" y="132" font-size="18" font-weight="700" fill="#0f172a">Retrieved, in rank order</text>
  <rect x="40" y="146" width="560" height="236" rx="10" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="590" y="168" font-size="13" font-weight="700" text-anchor="end" fill="#0e7490">top-k (what the prompt gets)</text>
  <g font-size="16">
    <rect x="60" y="180" width="520" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="80" y="214" font-weight="700" fill="#334155">1   kb-billing</text><text x="560" y="214" text-anchor="end" fill="#64748b">not relevant</text>
    <rect x="60" y="246" width="520" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="280" font-weight="700" fill="#15803d">2   kb-refunds</text><text x="560" y="280" text-anchor="end" fill="#15803d">relevant · first hit</text>
    <rect x="60" y="312" width="520" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="80" y="346" font-weight="700" fill="#334155">3   kb-plans</text><text x="560" y="346" text-anchor="end" fill="#64748b">not relevant</text>
    <rect x="60" y="398" width="520" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="80" y="432" font-weight="700" fill="#b45309">4   kb-payments</text><text x="560" y="432" text-anchor="end" fill="#b45309">relevant, but below k: earns nothing</text>
  </g>

  <!-- metrics -->
  <rect x="660" y="146" width="500" height="88" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="684" y="178" font-size="17" font-weight="700" fill="#0e7490">recall@3 = 1 / 2 = 0.5</text>
  <text x="684" y="206" font-size="14" fill="#334155">relevant found in the top-k ÷ relevant documents</text>
  <text x="684" y="224" font-size="13" fill="#64748b">(÷ k would be precision@3 = 1/3 - a different metric)</text>

  <rect x="660" y="250" width="500" height="88" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="684" y="282" font-size="17" font-weight="700" fill="#15803d">reciprocal rank = 1 / 2 = 0.5</text>
  <text x="684" y="310" font-size="14" fill="#334155">1 ÷ rank of the first relevant document in the top-k</text>
  <text x="684" y="328" font-size="13" fill="#64748b">MRR = the average over all labelled queries</text>

  <rect x="660" y="354" width="500" height="88" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="684" y="386" font-size="17" font-weight="700" fill="#6d28d9">hit = 1</text>
  <text x="684" y="414" font-size="14" fill="#334155">at least one relevant document in the top-k</text>
  <text x="684" y="432" font-size="13" fill="#64748b">hit rate = share of labelled queries with a hit</text>

  <rect x="40" y="484" width="1120" height="84" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="514" font-size="16" font-weight="700" fill="#b91c1c">Average over labelled queries only</text>
  <text x="60" y="540" font-size="14" fill="#334155">A query with no relevant documents cannot be scored: counting it as 0 lowers every metric each time the golden set grows.</text>
  <text x="60" y="560" font-size="14" fill="#334155">A document returned twice takes two slots but counts once.</text>
</svg>
