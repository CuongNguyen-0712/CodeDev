<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">BM25: repetition saturates, length normalises</text>
  <text x="40" y="82" font-size="16" fill="#475569">Term-frequency part f·(k1+1) / (f + k1·(1 − b + b·|D|/avgdl)) with k1 = 1.5</text>

  <!-- left panel: saturation -->
  <text x="60" y="130" font-size="17" font-weight="700" fill="#0f172a">Saturation (document of average length)</text>
  <line x1="60" y1="470" x2="570" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <line x1="60" y1="470" x2="60" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="110" y="490">1</text><text x="160" y="490">2</text><text x="210" y="490">3</text><text x="260" y="490">4</text><text x="310" y="490">5</text>
    <text x="360" y="490">6</text><text x="410" y="490">7</text><text x="460" y="490">8</text><text x="510" y="490">9</text><text x="560" y="490">10</text>
  </g>
  <text x="315" y="516" font-size="13" text-anchor="middle" fill="#475569">occurrences of the term in the document (f)</text>
  <!-- raw count -->
  <line x1="60" y1="470" x2="310" y2="150" stroke="#ef4444" stroke-width="3"/>
  <text x="200" y="176" font-size="14" font-weight="700" fill="#b91c1c">raw count: keeps growing</text>
  <!-- asymptote -->
  <line x1="60" y1="310" x2="570" y2="310" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="420" y="300" font-size="13" fill="#0e7490">ceiling k1 + 1 = 2.5</text>
  <!-- bm25 curve -->
  <polyline points="60,470 110,406 160,378.6 210,363.3 260,353.6 310,346.9 360,342 460,335.3 560,330.9" fill="none" stroke="#0891b2" stroke-width="3"/>
  <circle cx="110" cy="406" r="4" fill="#0891b2"/><circle cx="160" cy="378.6" r="4" fill="#0891b2"/><circle cx="560" cy="330.9" r="4" fill="#0891b2"/>
  <text x="168" y="404" font-size="13" fill="#0e7490">2nd mention: +0.43</text>
  <text x="430" y="352" font-size="13" fill="#0e7490">10th mention: +0.03</text>
  <text x="380" y="395" font-size="14" font-weight="700" fill="#0e7490">BM25</text>

  <!-- right panel: length -->
  <text x="640" y="130" font-size="17" font-weight="700" fill="#0f172a">Same 2 mentions, different lengths (avgdl = 150)</text>
  <line x1="640" y1="470" x2="1160" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <rect x="670" y="258" width="90" height="212" rx="4" fill="#0891b2"/>
  <text x="715" y="250" font-size="15" font-weight="700" text-anchor="middle" fill="#0e7490">1.77</text>
  <rect x="780" y="383" width="90" height="87" rx="4" fill="#d97706"/>
  <text x="825" y="375" font-size="15" font-weight="700" text-anchor="middle" fill="#b45309">0.73</text>
  <rect x="930" y="299" width="90" height="171" rx="4" fill="#67e8f9"/>
  <text x="975" y="291" font-size="15" font-weight="700" text-anchor="middle" fill="#0e7490">1.43</text>
  <rect x="1040" y="299" width="90" height="171" rx="4" fill="#fcd34d"/>
  <text x="1085" y="291" font-size="15" font-weight="700" text-anchor="middle" fill="#b45309">1.43</text>
  <g font-size="13" text-anchor="middle" fill="#334155">
    <text x="715" y="490">60 words</text><text x="825" y="490">600 words</text>
    <text x="975" y="490">60 words</text><text x="1085" y="490">600 words</text>
  </g>
  <text x="770" y="516" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">b = 0.75 (default)</text>
  <text x="1030" y="516" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">b = 0 (length ignored)</text>

  <rect x="40" y="540" width="1120" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="568" font-size="15" fill="#334155">IDF(t) = ln((N − n(t) + 0.5) / (n(t) + 0.5) + 1) multiplies each term's part: rare terms count more, and the + 1 keeps it positive.</text>
</svg>
