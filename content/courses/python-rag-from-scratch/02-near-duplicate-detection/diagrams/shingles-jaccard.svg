<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Near-duplicates: Jaccard similarity of word 3-shingles</text>
  <text x="40" y="82" font-size="16" fill="#475569">similarity = |A ∩ B| / |A ∪ B|. Drop a document when it is ≥ 0.8 similar to a document already kept.</text>

  <!-- shingle example -->
  <rect x="40" y="110" width="1120" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="138" font-size="15" font-weight="700" fill="#334155">"Reset 2FA and confirm with the code..." →</text>
  <text x="60" y="164" font-size="14" fill="#475569">(reset, 2fa, and) · (2fa, and, confirm) · (and, confirm, with) · (confirm, with, the) · ... one shingle per position: n − k + 1</text>

  <!-- left: copy with footer (A is inside B: every shingle of A is also in B) -->
  <text x="40" y="226" font-size="18" font-weight="700" fill="#0f172a">Copy with a footer</text>
  <circle cx="300" cy="384" r="140" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="262" cy="396" r="112" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="448" y="276" font-size="15" font-weight="700" fill="#b45309">B: confluence-2fa</text>
  <text x="448" y="296" font-size="13" fill="#b45309">25 shingles</text>
  <text x="262" y="352" font-size="15" font-weight="700" text-anchor="middle" fill="#0e7490">A: help-2fa</text>
  <text x="262" y="402" font-size="30" font-weight="700" text-anchor="middle" fill="#334155">21</text>
  <text x="262" y="424" font-size="13" text-anchor="middle" fill="#475569">shared = all of A</text>
  <text x="407" y="392" font-size="22" font-weight="700" text-anchor="middle" fill="#b45309">+4</text>
  <text x="407" y="412" font-size="12" text-anchor="middle" fill="#b45309">footer</text>
  <rect x="40" y="530" width="520" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="561" font-size="16" font-weight="700" fill="#b91c1c">21 / 25 = 0.84 ≥ 0.8 → drop B (duplicate of A)</text>

  <!-- right: short quote -->
  <text x="640" y="226" font-size="18" font-weight="700" fill="#0f172a">Short FAQ that quotes the article</text>
  <circle cx="860" cy="380" r="140" fill="#ecfeff" fill-opacity="0.8" stroke="#0891b2" stroke-width="2"/>
  <circle cx="930" cy="400" r="62" fill="#f0fdf4" fill-opacity="0.9" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="300" font-size="15" font-weight="700" fill="#0e7490">A: help-2fa</text>
  <text x="800" y="320" font-size="13" fill="#0e7490">21 shingles</text>
  <text x="930" y="396" font-size="26" font-weight="700" text-anchor="middle" fill="#15803d">9</text>
  <text x="930" y="418" font-size="13" text-anchor="middle" fill="#15803d">faq-2fa</text>
  <rect x="640" y="530" width="520" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="561" font-size="16" font-weight="700" fill="#15803d">Jaccard 9 / 21 = 0.43 → keep (containment 9 / 9 = 1.0 ✗)</text>
</svg>
