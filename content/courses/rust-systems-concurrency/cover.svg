<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Rust for systems (zero-copy slices into one buffer, producers and consumers on a bounded queue). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A120F"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F07B3F" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F07B3F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DEA584"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F07B3F"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <circle cx="158" cy="198" r="44" fill="none" stroke="#F07B3F" stroke-width="12" stroke-dasharray="9 7"/>
    <circle cx="158" cy="198" r="34" fill="#F07B3F"/>
    <text x="158" y="214" text-anchor="middle" font-size="44" font-weight="800" fill="#1A120F">R</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#DEA584">RUST · SYSTEMS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Zero-Copy</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">&amp; Concurrency</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Arenas · Cow · Send &amp; Sync · MPMC</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#F6D5C1">
      <rect x="110" y="660" width="136" height="52" rx="26" fill="#2A1810" stroke="#F07B3F"/>
      <text x="178" y="695" text-anchor="middle">&amp;[u8]</text>
      <rect x="262" y="660" width="107" height="52" rx="26" fill="#2A1810" stroke="#F07B3F"/>
      <text x="315.5" y="695" text-anchor="middle">Cow</text>
      <rect x="385" y="660" width="107" height="52" rx="26" fill="#2A1810" stroke="#F07B3F"/>
      <text x="438.5" y="695" text-anchor="middle">Arc</text>
      <rect x="508" y="660" width="150" height="52" rx="26" fill="#2A1810" stroke="#F07B3F"/>
      <text x="583" y="695" text-anchor="middle">unsafe</text>
    </g>
  </g>

