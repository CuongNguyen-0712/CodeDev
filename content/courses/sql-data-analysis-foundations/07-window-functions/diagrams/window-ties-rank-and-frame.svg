  <text x="66" y="378" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">Paper filters (100)</text>
  <text x="305" y="378" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2</text>
  <text x="375" y="378" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">7</text>
  <text x="455" y="378" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">5</text>
  <text x="530" y="378" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">3</text>
  <text x="60" y="412" font-size="13" fill="#334155"><tspan font-weight="700">rank &lt;= 2 keeps:</tspan> ROW_NUMBER 2 rows (drops 2 tied), RANK 4, DENSE_RANK 4</text>
  <text x="60" y="434" font-size="13" fill="#334155"><tspan font-weight="700">rank &lt;= 3 keeps:</tspan> ROW_NUMBER 3 rows, RANK 4, DENSE_RANK 7</text>
  <!-- Right: running total, RANGE vs ROWS -->
  <rect x="615" y="108" width="545" height="340" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="635" y="140" font-size="18" font-weight="700" fill="#334155">Running total of 6 paid March orders</text>
  <text x="635" y="162" font-size="13" fill="#64748b" font-family="Consolas, 'Courier New', monospace">SUM(total_cents) OVER (ORDER BY day ...)</text>
  <text x="655" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">order</text>
  <text x="700" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="start" font-family="Consolas, 'Courier New', monospace">day</text>
  <text x="855" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">total</text>
  <text x="960" y="192" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">default RANGE</text>
  <text x="1085" y="192" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">ROWS</text>
  <line x1="631" y1="200" x2="1144" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="631" y="204" width="513" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="631" y="308" width="513" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
