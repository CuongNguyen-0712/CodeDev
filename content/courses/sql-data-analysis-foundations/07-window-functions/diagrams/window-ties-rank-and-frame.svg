  <text x="455" y="248" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2</text>
  <text x="530" y="248" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2</text>
