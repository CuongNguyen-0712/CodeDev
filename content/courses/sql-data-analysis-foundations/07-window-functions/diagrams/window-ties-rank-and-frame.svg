<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Ties decide the answer: rankings and running totals</text>
  <text x="40" y="82" font-size="16" fill="#475569">Rows with the same ORDER BY value are peers. Each ranking function, and each window frame, treats peers differently.</text>
  <!-- Left: ranking functions on ties -->
  <rect x="40" y="108" width="545" height="340" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="60" y="140" font-size="18" font-weight="700" fill="#0e7490">Ranking 7 products by units sold</text>
  <text x="60" y="162" font-size="13" fill="#64748b" font-family="Consolas, 'Courier New', monospace">... OVER (ORDER BY units_sold DESC)</text>
  <text x="60" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="start" font-family="Consolas, 'Courier New', monospace">name</text>
  <text x="305" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">units</text>
  <text x="375" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">ROW_NUMBER</text>
  <text x="455" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">RANK</text>
  <text x="530" y="192" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">DENSE_RANK</text>
