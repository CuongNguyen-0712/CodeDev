  <text x="305" y="222" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">5</text>
  <text x="375" y="222" font-size="14" fill="#334155" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">1</text>
  <text x="455" y="222" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">1</text>
