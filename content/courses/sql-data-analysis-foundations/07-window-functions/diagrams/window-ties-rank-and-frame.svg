  <text x="635" y="434" font-size="13" fill="#15803d"><tspan font-weight="700">ROWS:</tspan> one row at a time, or aggregate per day first and plot one point a day</text>
  <text x="40" y="478" font-size="18" font-weight="700" fill="#334155">The pattern</text>
  <rect x="40" y="494" width="340" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="524" font-size="15" font-weight="700" fill="#b45309">1  Aggregate to the grain you show</text>
  <text x="60" y="548" font-size="13" fill="#92400e">one row per day or per product,</text>
  <text x="60" y="566" font-size="13" fill="#92400e">with GROUP BY, before the window</text>
  <line x1="380" y1="536" x2="420" y2="536" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="416,530 416,542 428,536" fill="#94a3b8"/>
  <rect x="430" y="494" width="340" height="84" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="450" y="524" font-size="15" font-weight="700" fill="#0e7490">2  Window with a clear ORDER BY</text>
  <text x="450" y="548" font-size="13" fill="#155e75">decide what a tie means; write ROWS</text>
  <text x="450" y="566" font-size="13" fill="#155e75">when you mean one row at a time</text>
  <line x1="770" y1="536" x2="810" y2="536" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="806,530 806,542 818,536" fill="#94a3b8"/>
  <rect x="820" y="494" width="340" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="840" y="524" font-size="15" font-weight="700" fill="#15803d">3  Filter the rank outside</text>
  <text x="840" y="548" font-size="13" fill="#166534">rank in a CTE, then WHERE place &lt;= N</text>
  <text x="840" y="566" font-size="13" fill="#166534">(WHERE runs before window functions)</text>
