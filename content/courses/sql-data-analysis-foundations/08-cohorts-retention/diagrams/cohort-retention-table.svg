  <rect x="379" y="267" width="82" height="42" rx="8" fill="none" stroke="#0891b2" stroke-width="3"/>
  <text x="60" y="404" font-size="13" fill="#64748b">0.0 = observed, nobody came back (no row in the long result).</text>
  <text x="60" y="422" font-size="13" fill="#64748b">not yet = the month is after May 2026, so it cannot be measured. m0 is always 100.0.</text>
  <rect x="710" y="112" width="450" height="150" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="730" y="142" font-size="18" font-weight="700" fill="#b91c1c">Before: the dashboard says 60.0%</text>
  <text x="760" y="174" font-size="22" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">3</text>
  <text x="790" y="172" font-size="14" fill="#334155">paid ORDERS in May (Ana paid twice)</text>
  <line x1="740" y1="184" x2="1136" y2="184" stroke="#ef4444" stroke-width="2"/>
  <text x="760" y="210" font-size="22" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">5</text>
  <text x="790" y="208" font-size="14" fill="#334155">active in APRIL, grouped by signup month</text>
  <text x="730" y="246" font-size="13" fill="#64748b">a shrinking denominator: last month's survivors, not the cohort</text>
  <rect x="710" y="282" width="450" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="312" font-size="18" font-weight="700" fill="#15803d">After: 22.2%, the outlined cell</text>
  <text x="760" y="344" font-size="22" font-weight="700" fill="#15803d" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2</text>
  <text x="790" y="342" font-size="14" fill="#334155">DISTINCT customers active in month 2</text>
  <line x1="740" y1="354" x2="1136" y2="354" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="380" font-size="22" font-weight="700" fill="#15803d" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">9</text>
  <text x="790" y="378" font-size="14" fill="#334155">customers whose first PAID order was in March</text>
  <text x="730" y="416" font-size="13" fill="#64748b">the cohort size: the same denominator in every column of a row</text>
  <text x="40" y="468" font-size="18" font-weight="700" fill="#334155">Three CTE steps</text>
  <rect x="40" y="484" width="340" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="514" font-size="15" font-weight="700" fill="#b45309">1  Cohort per customer</text>
  <text x="60" y="538" font-size="13" fill="#92400e">first PAID order month (MIN),</text>
  <text x="60" y="556" font-size="13" fill="#92400e">plus a month index: year * 12 + month</text>
  <line x1="380" y1="526" x2="420" y2="526" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="416,520 416,532 428,526" fill="#94a3b8"/>
  <rect x="430" y="484" width="340" height="84" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="450" y="514" font-size="15" font-weight="700" fill="#0e7490">2  Activity per month offset</text>
  <text x="450" y="538" font-size="13" fill="#155e75">order month index - first month index,</text>
  <text x="450" y="556" font-size="13" fill="#155e75">COUNT(DISTINCT customer_id)</text>
  <line x1="770" y1="526" x2="810" y2="526" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="806,520 806,532 818,526" fill="#94a3b8"/>
  <rect x="820" y="484" width="340" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="840" y="514" font-size="15" font-weight="700" fill="#15803d">3  Divide by the cohort size</text>
  <text x="840" y="538" font-size="13" fill="#166534">ROUND(100.0 * active / cohort_size, 1)</text>
  <text x="840" y="556" font-size="13" fill="#166534">never by last month's actives</text>
</svg>
