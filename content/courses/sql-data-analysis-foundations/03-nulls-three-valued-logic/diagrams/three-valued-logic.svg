<text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">NULL makes a comparison UNKNOWN, and WHERE keeps only TRUE</text>
<text x="40" y="82" font-size="16" fill="#475569">SQL logic has three values. Any =, &lt;&gt;, &lt; or &gt; with a NULL side is UNKNOWN (SQLite shows it as NULL), even NULL = NULL.</text>
