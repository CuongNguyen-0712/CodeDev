<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">The API answers either way. The headers decide if the page may read it.</text>
  <text x="40" y="82" font-size="16" fill="#475569">fetch("https://api.codedev.test/admin/courses", { credentials: "include" }) from https://admin.codedev.test</text>

  <!-- Left: AI helper -->
  <rect x="40" y="112" width="545" height="300" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="146" font-size="18" font-weight="700" fill="#b91c1c">Before: the AI helper answers "*"</text>
  <text x="64" y="170" font-size="13" fill="#64748b">response headers from the API (status 200, JSON body included)</text>
  <rect x="64" y="184" width="497" height="64" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="210" font-size="14" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">Access-Control-Allow-Origin: *</text>
  <text x="80" y="234" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">Access-Control-Allow-Credentials: true</text>
  <line x1="312" y1="256" x2="312" y2="282" stroke="#ef4444" stroke-width="2"/>
  <polygon points="306,278 318,278 312,290" fill="#ef4444"/>
  <rect x="64" y="294" width="497" height="44" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="321" font-size="14" fill="#334155">Browser check: with credentials, "*" is never accepted</text>
  <text x="64" y="370" font-size="15" font-weight="700" fill="#b91c1c">The page gets: TypeError: Failed to fetch</text>
  <text x="64" y="394" font-size="13" fill="#64748b">curl shows 200 OK, because curl does not apply CORS at all</text>

  <!-- Right: exact allowlist -->
  <rect x="615" y="112" width="545" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="146" font-size="18" font-weight="700" fill="#15803d">After: echo an allowlisted origin</text>
  <text x="639" y="170" font-size="13" fill="#64748b">Origin "https://admin.codedev.test" is in the allowlist (whole string)</text>
  <rect x="639" y="184" width="497" height="88" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="210" font-size="14" fill="#15803d" font-family="Consolas, 'Courier New', monospace">Access-Control-Allow-Origin: https://admin.codedev.test</text>
  <text x="655" y="234" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">Access-Control-Allow-Credentials: true</text>
  <text x="655" y="258" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">Vary: Origin</text>
  <line x1="887" y1="278" x2="887" y2="290" stroke="#16a34a" stroke-width="2"/>
  <polygon points="881,286 893,286 887,298" fill="#16a34a"/>
  <rect x="639" y="300" width="497" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="327" font-size="14" fill="#334155">Browser check: exact origin + credentials "true" = pass</text>
  <text x="639" y="370" font-size="15" font-weight="700" fill="#15803d">The page reads the JSON</text>
  <text x="639" y="394" font-size="13" fill="#64748b">https://evil.example gets no Access-Control headers, so its read is blocked</text>

  <!-- Rules -->
  <text x="40" y="460" font-size="18" font-weight="700" fill="#334155">Three rules for an API called with cookies</text>
  <rect x="40" y="478" width="340" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="508" font-size="15" font-weight="700" fill="#b45309">1  Exact allowlist</text>
  <text x="60" y="532" font-size="13" fill="#92400e">compare whole strings: a look-alike such as</text>
  <text x="60" y="550" font-size="13" fill="#92400e">app.codedev.test.evil.example is rejected</text>
  <line x1="380" y1="520" x2="420" y2="520" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="416,514 416,526 428,520" fill="#94a3b8"/>
  <rect x="430" y="478" width="340" height="84" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="450" y="508" font-size="15" font-weight="700" fill="#0e7490">2  Echo the origin, never "*"</text>
  <text x="450" y="532" font-size="13" fill="#155e75">with Allow-Credentials: true; unknown</text>
  <text x="450" y="550" font-size="13" fill="#155e75">origins get no Access-Control headers</text>
  <line x1="770" y1="520" x2="810" y2="520" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="806,514 806,526 818,520" fill="#94a3b8"/>
  <rect x="820" y="478" width="340" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="840" y="508" font-size="15" font-weight="700" fill="#15803d">3  Vary: Origin, always</text>
  <text x="840" y="532" font-size="13" fill="#166534">the answer depends on Origin, so caches</text>
  <text x="840" y="550" font-size="13" fill="#166534">must never reuse it for another origin</text>
</svg>
