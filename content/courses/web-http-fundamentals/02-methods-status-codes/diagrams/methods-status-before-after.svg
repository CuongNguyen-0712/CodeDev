<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">The method says what you want. The status says what happened.</text>
  <text x="40" y="82" font-size="16" fill="#475569">Three requests from the enrollments incident. Crawlers, caches, retries and dashboards read these two fields, never your JSON.</text>

  <text x="40" y="116" font-size="18" font-weight="700" fill="#b91c1c">Before</text>
  <text x="625" y="116" font-size="18" font-weight="700" fill="#15803d">After</text>

  <!-- Row 1 -->
  <rect x="40" y="128" width="535" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="158" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">GET /v1/enrollments/42/delete</text>
  <text x="555" y="158" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="end" font-family="Consolas, 'Courier New', monospace">200 {"ok":true}</text>
  <text x="60" y="188" font-size="13" fill="#7f1d1d">GET is safe, so a link checker followed the link - and deleted data</text>
  <line x1="580" y1="167" x2="612" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="608,161 608,173 620,167" fill="#94a3b8"/>
  <rect x="625" y="128" width="535" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="158" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">DELETE /v1/enrollments/42</text>
  <text x="1140" y="158" font-size="15" font-weight="700" fill="#15803d" text-anchor="end" font-family="Consolas, 'Courier New', monospace">204 No Content</text>
  <text x="645" y="188" font-size="13" fill="#166534">never sent by crawlers; idempotent: a second call leaves the same state</text>

  <!-- Row 2 -->
  <rect x="40" y="218" width="535" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="248" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">POST /v1/enrollments  (again)</text>
  <text x="555" y="248" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="end" font-family="Consolas, 'Courier New', monospace">200 {"ok":false}</text>
  <text x="60" y="278" font-size="13" fill="#7f1d1d">the error graph counts a success; the client must parse the body to know</text>
  <line x1="580" y1="257" x2="612" y2="257" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="608,251 608,263 620,257" fill="#94a3b8"/>
  <rect x="625" y="218" width="535" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="248" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">POST /v1/enrollments  (again)</text>
  <text x="1140" y="248" font-size="15" font-weight="700" fill="#15803d" text-anchor="end" font-family="Consolas, 'Courier New', monospace">409 Conflict</text>
  <text x="645" y="278" font-size="13" fill="#166534">counted as a client error; the UI can say "Already enrolled"</text>

  <!-- Row 3 -->
  <rect x="40" y="308" width="535" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="338" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">GET /v1/users/me/enrollments</text>
  <text x="555" y="338" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="end" font-family="Consolas, 'Courier New', monospace">404</text>
  <text x="60" y="368" font-size="13" fill="#7f1d1d">a new learner's empty list looks like a missing resource: error screen</text>
  <line x1="580" y1="347" x2="612" y2="347" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="608,341 608,353 620,347" fill="#94a3b8"/>
  <rect x="625" y="308" width="535" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="338" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">GET /v1/users/me/enrollments</text>
  <text x="1140" y="338" font-size="15" font-weight="700" fill="#15803d" text-anchor="end" font-family="Consolas, 'Courier New', monospace">200 []</text>
  <text x="645" y="368" font-size="13" fill="#166534">the collection exists and is empty: the dashboard shows its empty state</text>

  <!-- Families -->
  <text x="40" y="430" font-size="18" font-weight="700" fill="#334155">Status code families: who has to act?</text>
  <rect x="40" y="446" width="208" height="120" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="58" y="474" font-size="16" font-weight="700" fill="#334155">1xx</text>
  <text x="58" y="498" font-size="13" fill="#475569">informational,</text>
  <text x="58" y="516" font-size="13" fill="#475569">interim answer;</text>
  <text x="58" y="534" font-size="13" fill="#475569">rarely handled by you</text>

  <rect x="268" y="446" width="208" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="286" y="474" font-size="16" font-weight="700" fill="#15803d">2xx success</text>
  <text x="286" y="498" font-size="13" fill="#166534">200 with a body,</text>
  <text x="286" y="516" font-size="13" fill="#166534">201 created + Location,</text>
  <text x="286" y="534" font-size="13" fill="#166534">204 no body at all</text>

  <rect x="496" y="446" width="208" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="514" y="474" font-size="16" font-weight="700" fill="#0e7490">3xx redirection</text>
  <text x="514" y="498" font-size="13" fill="#155e75">client takes another</text>
  <text x="514" y="516" font-size="13" fill="#155e75">step: follow Location,</text>
  <text x="514" y="534" font-size="13" fill="#155e75">or use its cache (304)</text>

  <rect x="724" y="446" width="208" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="742" y="474" font-size="16" font-weight="700" fill="#b45309">4xx client error</text>
  <text x="742" y="498" font-size="13" fill="#92400e">the request must</text>
  <text x="742" y="516" font-size="13" fill="#92400e">change: 400, 401, 403,</text>
  <text x="742" y="534" font-size="13" fill="#92400e">404, 409, 422, 429</text>

  <rect x="952" y="446" width="208" height="120" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="970" y="474" font-size="16" font-weight="700" fill="#b91c1c">5xx server error</text>
  <text x="970" y="498" font-size="13" fill="#7f1d1d">the server failed:</text>
  <text x="970" y="516" font-size="13" fill="#7f1d1d">500 a bug to fix,</text>
  <text x="970" y="534" font-size="13" fill="#7f1d1d">503 temporary, retry later</text>
</svg>
