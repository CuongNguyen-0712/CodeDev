<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A timeout does not tell you whether the server did it.</text>
  <text x="40" y="82" font-size="16" fill="#475569">The client retries. Whether that is safe depends on the method's semantics, or on a key the server can recognise.</text>

  <!-- Left: plain POST retried -->
  <rect x="40" y="112" width="545" height="300" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="146" font-size="18" font-weight="700" fill="#b91c1c">Before: POST /enrollments, retried</text>
  <text x="64" y="170" font-size="13" fill="#64748b">the first response was lost on a slow mobile network</text>

  <rect x="64" y="186" width="497" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="212" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">#1 POST  -> created enr_901   (timeout)</text>
  <rect x="64" y="234" width="497" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="260" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">#2 POST  -> created enr_902   201</text>
  <line x1="80" y1="290" x2="545" y2="290" stroke="#ef4444" stroke-width="2"/>
  <rect x="64" y="300" width="497" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="326" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">2 enrollments for 1 tap</text>
  <text x="64" y="370" font-size="15" font-weight="700" fill="#b91c1c">Same body twice is still two requests to create</text>
  <text x="64" y="394" font-size="13" fill="#64748b">POST means "make a new one": each request that arrives does it again</text>

  <!-- Right: with Idempotency-Key -->
  <rect x="615" y="112" width="545" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="146" font-size="18" font-weight="700" fill="#15803d">After: the same retry with Idempotency-Key</text>
  <text x="639" y="170" font-size="13" fill="#64748b">one key per user action, reused for every retry of it</text>

  <rect x="639" y="186" width="497" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="212" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">#1 key k7f2 -> created enr_901 (timeout)</text>
  <rect x="639" y="234" width="497" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="260" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">#2 key k7f2 -> stored reply: enr_901 201</text>
  <line x1="655" y1="290" x2="1120" y2="290" stroke="#16a34a" stroke-width="2"/>
  <rect x="639" y="300" width="497" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="326" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">1 enrollment, the client gets enr_901</text>
  <text x="639" y="370" font-size="15" font-weight="700" fill="#15803d">The server remembers the key and replays the result</text>
  <text x="639" y="394" font-size="13" fill="#64748b">a unique (user_id, course_id) constraint is a second line of defence</text>

  <!-- Method table -->
  <text x="40" y="452" font-size="18" font-weight="700" fill="#334155">Safe to repeat? RFC 9110 semantics</text>
  <rect x="40" y="470" width="200" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="498" font-size="15" font-weight="700" fill="#15803d">GET  HEAD</text>
  <text x="58" y="522" font-size="13" fill="#166534">safe and idempotent:</text>
  <text x="58" y="540" font-size="13" fill="#166534">read-only by contract</text>

  <rect x="260" y="470" width="200" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="278" y="498" font-size="15" font-weight="700" fill="#15803d">PUT</text>
  <text x="278" y="522" font-size="13" fill="#166534">idempotent: "set it to</text>
  <text x="278" y="540" font-size="13" fill="#166534">this", twice = once</text>

  <rect x="480" y="470" width="200" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="498" y="498" font-size="15" font-weight="700" fill="#15803d">DELETE</text>
  <text x="498" y="522" font-size="13" fill="#166534">idempotent: gone stays</text>
  <text x="498" y="540" font-size="13" fill="#166534">gone (2nd reply may be 404)</text>

  <rect x="700" y="470" width="220" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="718" y="498" font-size="15" font-weight="700" fill="#b91c1c">POST</text>
  <text x="718" y="522" font-size="13" fill="#991b1b">not idempotent: needs an</text>
  <text x="718" y="540" font-size="13" fill="#991b1b">Idempotency-Key to retry</text>

  <rect x="940" y="470" width="220" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="958" y="498" font-size="15" font-weight="700" fill="#b45309">PATCH</text>
  <text x="958" y="522" font-size="13" fill="#92400e">not idempotent in general:</text>
  <text x="958" y="540" font-size="13" fill="#92400e">depends on the patch</text>
</svg>
