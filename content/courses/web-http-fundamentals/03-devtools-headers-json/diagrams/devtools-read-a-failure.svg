<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Read the evidence in order: connection, status, headers, body.</text>
  <text x="40" y="82" font-size="16" fill="#475569">POST /v1/lessons/12/submissions during the deploy: the gateway answered 502 with an HTML page.</text>

  <!-- Before -->
  <rect x="40" y="108" width="535" height="300" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="142" font-size="18" font-weight="700" fill="#b91c1c">Before: parse first, guess later</text>

  <rect x="64" y="160" width="487" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="186" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">await fetch(...)  resolves: 502, text/html</text>
  <line x1="307" y1="200" x2="307" y2="216" stroke="#ef4444" stroke-width="2"/>
  <polygon points="301,212 313,212 307,222" fill="#ef4444"/>
  <rect x="64" y="222" width="487" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="248" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">await res.json()  on "&lt;!DOCTYPE html&gt;..."</text>
  <line x1="307" y1="262" x2="307" y2="278" stroke="#ef4444" stroke-width="2"/>
  <polygon points="301,274 313,274 307,284" fill="#ef4444"/>
  <rect x="64" y="284" width="487" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="310" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">SyntaxError: Unexpected token '&lt;'</text>
  <line x1="307" y1="324" x2="307" y2="340" stroke="#ef4444" stroke-width="2"/>
  <polygon points="301,336 313,336 307,346" fill="#ef4444"/>
  <rect x="64" y="346" width="487" height="44" rx="6" fill="#ef4444"/>
  <text x="307" y="374" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">catch: "You are offline. Check your connection."</text>

  <!-- After -->
  <rect x="625" y="108" width="535" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="649" y="142" font-size="18" font-weight="700" fill="#15803d">After: four questions, in order</text>

  <rect x="649" y="158" width="487" height="38" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="665" y="183" font-size="14" font-weight="700" fill="#334155">1  Did a response arrive?</text>
  <text x="1120" y="183" font-size="14" fill="#15803d" text-anchor="end">yes (fetch resolved)</text>
  <rect x="649" y="204" width="487" height="38" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="665" y="229" font-size="14" font-weight="700" fill="#334155">2  What is the status code?</text>
  <text x="1120" y="229" font-size="14" fill="#15803d" text-anchor="end">502: a server-side failure</text>
  <rect x="649" y="250" width="487" height="38" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="665" y="275" font-size="14" font-weight="700" fill="#334155">3  What is the Content-Type?</text>
  <text x="1120" y="275" font-size="14" fill="#15803d" text-anchor="end">text/html: read it as text</text>
  <rect x="649" y="296" width="487" height="38" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="665" y="321" font-size="14" font-weight="700" fill="#334155">4  Parse the body</text>
  <text x="1120" y="321" font-size="14" fill="#15803d" text-anchor="end">only when it is JSON</text>
  <rect x="649" y="346" width="487" height="44" rx="6" fill="#16a34a"/>
  <text x="892" y="366" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">"CodeDev had a problem saving your submission.</text>
  <text x="892" y="383" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Your code is still here - try again in a minute."</text>

  <!-- DevTools map -->
  <text x="40" y="446" font-size="18" font-weight="700" fill="#334155">Where DevTools answers each question</text>
  <rect x="40" y="460" width="208" height="110" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="58" y="488" font-size="15" font-weight="700" fill="#334155">Status column</text>
  <text x="58" y="512" font-size="13" fill="#475569">a code, or (failed) with</text>
  <text x="58" y="530" font-size="13" fill="#475569">a net::ERR_... reason</text>
  <text x="58" y="548" font-size="13" fill="#475569">when nothing came back</text>

  <rect x="268" y="460" width="208" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="286" y="488" font-size="15" font-weight="700" fill="#b45309">Headers</text>
  <text x="286" y="512" font-size="13" fill="#92400e">General: method, status;</text>
  <text x="286" y="530" font-size="13" fill="#92400e">Content-Type, Cache-</text>
  <text x="286" y="548" font-size="13" fill="#92400e">Control, Set-Cookie</text>

  <rect x="496" y="460" width="208" height="110" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="514" y="488" font-size="15" font-weight="700" fill="#0e7490">Payload</text>
  <text x="514" y="512" font-size="13" fill="#155e75">what you sent: query</text>
  <text x="514" y="530" font-size="13" fill="#155e75">string parameters and</text>
  <text x="514" y="548" font-size="13" fill="#155e75">the request body</text>

  <rect x="724" y="460" width="208" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="742" y="488" font-size="15" font-weight="700" fill="#b91c1c">Preview</text>
  <text x="742" y="512" font-size="13" fill="#7f1d1d">rendered for humans:</text>
  <text x="742" y="530" font-size="13" fill="#7f1d1d">JSON tree, HTML page;</text>
  <text x="742" y="548" font-size="13" fill="#7f1d1d">can hide the real bytes</text>

  <rect x="952" y="460" width="208" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="970" y="488" font-size="15" font-weight="700" fill="#15803d">Response</text>
  <text x="970" y="512" font-size="13" fill="#166534">the raw text, exactly</text>
  <text x="970" y="530" font-size="13" fill="#166534">what res.json() parses:</text>
  <text x="970" y="548" font-size="13" fill="#166534">check it on parse errors</text>
</svg>
