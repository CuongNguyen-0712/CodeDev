<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: AI & LLM foundations (a prompt split into tokens, next-token probabilities, context and cost meters). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A1C"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#14B8A6"/>
    <text x="158" y="211" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="800" fill="#FFFFFF">AI</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#5EEAD4">AI · LLM · FOUNDATIONS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">AI &amp; LLM</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Foundations</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Tokens · Context · Cost · Hallucination</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CCFBF1">
      <rect x="110" y="660" width="132" height="52" rx="26" fill="#0F2A28" stroke="#14B8A6"/>
      <text x="176" y="695" text-anchor="middle">tokens</text>
      <rect x="258" y="660" width="210" height="52" rx="26" fill="#0F2A28" stroke="#14B8A6"/>
      <text x="363" y="695" text-anchor="middle">temperature</text>
      <rect x="484" y="660" width="162" height="52" rx="26" fill="#0F2A28" stroke="#14B8A6"/>
      <text x="565" y="695" text-anchor="middle">citation</text>
    </g>
  </g>

  <!-- Token panel -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="900" y="170" width="600" height="560" rx="18" fill="#12171A" stroke="#22383A" stroke-width="2"/>
    <text x="930" y="220" font-size="18" letter-spacing="3" fill="#5EEAD4">PROMPT AS TOKENS</text>
    <g font-size="22" fill="#E6FFFA">
      <rect x="930" y="240" width="92" height="44" rx="8" fill="#163B38"/><text x="976" y="270" text-anchor="middle">Check</text>
      <rect x="1030" y="240" width="72" height="44" rx="8" fill="#1B2E3F"/><text x="1066" y="270" text-anchor="middle"> the</text>
      <rect x="1110" y="240" width="80" height="44" rx="8" fill="#163B38"/><text x="1150" y="270" text-anchor="middle"> loop</text>
      <rect x="1198" y="240" width="96" height="44" rx="8" fill="#1B2E3F"/><text x="1246" y="270" text-anchor="middle"> bound</text>
      <rect x="1302" y="240" width="40" height="44" rx="8" fill="#163B38"/><text x="1322" y="270" text-anchor="middle">?</text>
    </g>

    <text x="930" y="340" font-size="18" letter-spacing="3" fill="#5EEAD4">NEXT TOKEN</text>
    <g font-size="20">
      <text x="930" y="382" fill="#E6FFFA"> off</text>
      <rect x="1030" y="364" width="300" height="24" rx="6" fill="#14B8A6"/><text x="1470" y="382" text-anchor="end" fill="#B8B2C8">0.62</text>
      <text x="930" y="422" fill="#E6FFFA"> uses</text>
      <rect x="1030" y="404" width="110" height="24" rx="6" fill="#0F766E"/><text x="1470" y="422" text-anchor="end" fill="#B8B2C8">0.23</text>
      <text x="930" y="462" fill="#E6FFFA"> is</text>
      <rect x="1030" y="444" width="56" height="24" rx="6" fill="#115E59"/><text x="1470" y="462" text-anchor="end" fill="#B8B2C8">0.11</text>
    </g>

    <text x="930" y="530" font-size="18" letter-spacing="3" fill="#5EEAD4">CONTEXT WINDOW</text>
    <rect x="930" y="548" width="540" height="20" rx="10" fill="#22383A"/>
    <rect x="930" y="548" width="498" height="20" rx="10" fill="#F2C14E"/>
    <text x="1470" y="598" font-size="20" text-anchor="end" fill="#B8B2C8">7,450 / 8,000 tokens</text>

    <rect x="930" y="626" width="540" height="76" rx="10" fill="#10241A" stroke="#3DBE7B"/>
    <text x="954" y="660" font-size="20" fill="#9FE3BF">in 1,840 + out 220 tokens</text>
    <text x="954" y="690" font-size="20" fill="#9FE3BF">cost = tokens x price per 1M</text>
  </g>
</svg>
