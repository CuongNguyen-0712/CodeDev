<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: AI and LLM foundations (tokens into a model, an ungrounded answer, cost and latency). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112A"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C6AF2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7C6AF2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#7C6AF2"/>
    <text x="158" y="216" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF">AI</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#B9AEFF">AI · LLM · FOUNDATIONS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">How LLMs</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Really Work</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Tokens · Cost · Hallucinations · Choosing a model</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#E3DEFF">
      <rect x="110" y="660" width="122" height="52" rx="26" fill="#1B1730" stroke="#7C6AF2"/>
      <text x="170.8" y="695" text-anchor="middle">tokens</text>
      <rect x="247.6" y="660" width="137" height="52" rx="26" fill="#1B1730" stroke="#7C6AF2"/>
      <text x="316.2" y="695" text-anchor="middle">context</text>
      <rect x="400.79999999999995" y="660" width="200" height="52" rx="26" fill="#1B1730" stroke="#7C6AF2"/>
      <text x="500.6" y="695" text-anchor="middle">temperature</text>
    </g>
  </g>

  <!-- Tokens flow into a model; the answer carries a cost, a latency and a source check -->
  <g id="art" font-family="Consolas, Menlo, monospace">
    <g font-size="21">
      <rect x="900" y="250" width="92" height="46" rx="10" fill="#1B1730" stroke="#8B7CF6"/><text x="946" y="280" fill="#D9D3FF" text-anchor="middle">How</text>
      <rect x="1002" y="250" width="70" height="46" rx="10" fill="#1B1730" stroke="#8B7CF6"/><text x="1037" y="280" fill="#D9D3FF" text-anchor="middle">do</text>
      <rect x="1082" y="250" width="70" height="46" rx="10" fill="#1B1730" stroke="#8B7CF6"/><text x="1117" y="280" fill="#D9D3FF" text-anchor="middle">I</text>
      <rect x="1162" y="250" width="132" height="46" rx="10" fill="#1B1730" stroke="#8B7CF6"/><text x="1228" y="280" fill="#D9D3FF" text-anchor="middle">submit</text>
      <rect x="1304" y="250" width="56" height="46" rx="10" fill="#1B1730" stroke="#8B7CF6"/><text x="1332" y="280" fill="#D9D3FF" text-anchor="middle">?</text>
    </g>
    <text x="900" y="330" font-size="19" fill="#B8B2C8">5 tokens in · context 4,096 / 128,000</text>
    <path d="M1130 350 V400" stroke="#8C8399" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1010" y="404" width="240" height="64" rx="16" fill="#8B7CF6" fill-opacity="0.18" stroke="#8B7CF6" stroke-width="3"/>
    <text x="1130" y="444" font-size="24" fill="#D9D3FF" text-anchor="middle">LLM</text>
    <path d="M1130 468 V518" stroke="#8C8399" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="900" y="522" width="540" height="64" rx="14" fill="#1C1420" stroke="#F2555A" stroke-width="2"/>
    <text x="920" y="562" font-size="21" fill="#F2B8BA">submitLesson({ force: true })</text>
    <text x="1420" y="562" font-size="21" fill="#F2555A" text-anchor="end">no source</text>
    <text x="900" y="630" font-size="20" fill="#3DBE7B">$0.00042 · 1.8 s · p95 3.1 s</text>
    <text x="900" y="670" font-size="20" fill="#B8B2C8">temperature 0 · "I'm not sure" allowed</text>
  </g>
</svg>
