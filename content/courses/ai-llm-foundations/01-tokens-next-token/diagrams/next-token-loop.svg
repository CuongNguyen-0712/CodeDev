<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">An LLM writes one token at a time</text>
  <text x="40" y="82" font-size="16" fill="#475569">Text becomes tokens; the model scores every candidate next token, one is chosen and appended, and the loop repeats.</text>

  <!-- Tokenizer strip -->
  <text x="40" y="126" font-size="15" font-weight="700" fill="#334155">1. Tokenizer</text>
  <text x="170" y="126" font-size="14" fill="#64748b" font-family="Consolas, 'Courier New', monospace">"Check the loop bound"</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <rect x="40" y="142" width="150" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="164" text-anchor="middle" fill="#1e3a8a">"Check"</text>
    <text x="115" y="184" text-anchor="middle" font-size="13" fill="#64748b">id 4061</text>
    <rect x="205" y="142" width="150" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="164" text-anchor="middle" fill="#1e3a8a">" the"</text>
    <text x="280" y="184" text-anchor="middle" font-size="13" fill="#64748b">id 279</text>
    <rect x="370" y="142" width="150" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="445" y="164" text-anchor="middle" fill="#1e3a8a">" loop"</text>
    <text x="445" y="184" text-anchor="middle" font-size="13" fill="#64748b">id 6471</text>
    <rect x="535" y="142" width="150" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="164" text-anchor="middle" fill="#166534">" bound"</text>
    <text x="610" y="184" text-anchor="middle" font-size="13" fill="#64748b">id 6965</text>
  </g>
  <text x="710" y="164" font-size="13" fill="#64748b">ids are illustrative; each model family</text>
  <text x="710" y="184" font-size="13" fill="#64748b">has its own tokenizer and vocabulary</text>

  <!-- Loop -->
  <text x="40" y="236" font-size="15" font-weight="700" fill="#334155">2. The generation loop (one pass per output token)</text>
  <rect x="40" y="252" width="230" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="155" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Tokens so far</text>
  <text x="155" y="308" text-anchor="middle" font-size="13" fill="#475569" font-family="Consolas, 'Courier New', monospace">... Check the loop</text>
  <text x="155" y="334" text-anchor="middle" font-size="13" fill="#64748b">prompt + output</text>
  <text x="155" y="354" text-anchor="middle" font-size="13" fill="#64748b">written so far</text>

  <line x1="270" y1="312" x2="318" y2="312" stroke="#334155" stroke-width="2"/>
  <polygon points="318,306 330,312 318,318" fill="#334155"/>

  <rect x="330" y="252" width="170" height="120" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="415" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#3730a3">Model</text>
  <text x="415" y="324" text-anchor="middle" font-size="13" fill="#4338ca">scores every token</text>
  <text x="415" y="344" text-anchor="middle" font-size="13" fill="#4338ca">in the vocabulary</text>

  <line x1="500" y1="312" x2="548" y2="312" stroke="#334155" stroke-width="2"/>
  <polygon points="548,306 560,312 548,318" fill="#334155"/>

  <rect x="560" y="252" width="330" height="164" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="276" font-size="14" font-weight="700" fill="#0f172a">Next-token probabilities (toy)</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#334155">
    <text x="580" y="302">" bound"</text><rect x="690" y="291" width="124" height="14" fill="#16a34a"/><text x="822" y="302">0.62</text>
    <text x="580" y="326">" condition"</text><rect x="690" y="315" width="42" height="14" fill="#94a3b8"/><text x="740" y="326">0.21</text>
    <text x="580" y="350">" index"</text><rect x="690" y="339" width="18" height="14" fill="#94a3b8"/><text x="716" y="350">0.09</text>
    <text x="580" y="374">" counter"</text><rect x="690" y="363" width="10" height="14" fill="#94a3b8"/><text x="708" y="374">0.05</text>
    <text x="580" y="398">" end"</text><rect x="690" y="387" width="6" height="14" fill="#94a3b8"/><text x="704" y="398">0.03</text>
  </g>

  <line x1="890" y1="312" x2="938" y2="312" stroke="#334155" stroke-width="2"/>
  <polygon points="938,306 950,312 938,318" fill="#334155"/>

  <rect x="950" y="252" width="210" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1055" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Choose one token</text>
  <text x="1055" y="308" text-anchor="middle" font-size="13" fill="#166534" font-family="Consolas, 'Courier New', monospace">" bound"</text>
  <text x="1055" y="334" text-anchor="middle" font-size="13" fill="#166534">append it, stream it,</text>
  <text x="1055" y="354" text-anchor="middle" font-size="13" fill="#166534">run the model again</text>

  <!-- loop-back arrow -->
  <path d="M 1055 372 L 1055 436 L 155 436 L 155 384" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="149,384 155,372 161,384" fill="#334155"/>
  <text x="600" y="456" text-anchor="middle" font-size="13" fill="#475569">repeat until the model chooses an end-of-text token or the output limit is reached</text>

  <!-- Consequences -->
  <rect x="40" y="480" width="350" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="508" font-size="15" font-weight="700" fill="#b45309">Output length costs time</text>
  <text x="60" y="532" font-size="13" fill="#92400e">one sequential step per output token:</text>
  <text x="60" y="552" font-size="13" fill="#92400e">400 tokens take ~10x longer than 40</text>
  <rect x="425" y="480" width="350" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="445" y="508" font-size="15" font-weight="700" fill="#b91c1c">Likely is not the same as true</text>
  <text x="445" y="532" font-size="13" fill="#991b1b">the model picks probable tokens; it does</text>
  <text x="445" y="552" font-size="13" fill="#991b1b">not search your code, docs or database</text>
  <rect x="810" y="480" width="350" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="830" y="508" font-size="15" font-weight="700" fill="#1d4ed8">Everything is counted in tokens</text>
  <text x="830" y="532" font-size="13" fill="#1e40af">price, context limit and speed; ~4 chars</text>
  <text x="830" y="552" font-size="13" fill="#1e40af">per token in English; more in code, Vietnamese</text>
</svg>
