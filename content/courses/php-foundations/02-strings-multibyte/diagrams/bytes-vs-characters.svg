<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A PHP string is bytes: 'Đắc nhân tâm' is 12 characters and 17 bytes</text>
  <text x="40" y="82" font-size="16" fill="#475569">UTF-8 stores ASCII letters in 1 byte and Vietnamese letters in 2 or 3. The str* functions count and cut bytes.</text>
  <text x="80" y="134" font-size="14" font-weight="700" fill="#475569">characters (mb_strlen = 12)</text>
  <text x="1120" y="134" font-size="14" font-weight="700" fill="#475569" text-anchor="end">bytes (strlen = 17)</text>
  <rect x="80" y="150" width="116" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="138" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">Đ</text><rect x="80" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="108" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">C4</text><text x="108" y="270" font-size="11" text-anchor="middle" fill="#64748b">0</text><rect x="140" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="168" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">90</text><text x="168" y="270" font-size="11" text-anchor="middle" fill="#64748b">1</text><rect x="200" y="150" width="176" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="288" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">ắ</text><rect x="200" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="228" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">E1</text><text x="228" y="270" font-size="11" text-anchor="middle" fill="#64748b">2</text><rect x="260" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="288" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">BA</text><text x="288" y="270" font-size="11" text-anchor="middle" fill="#64748b">3</text><rect x="320" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="348" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">AF</text><text x="348" y="270" font-size="11" text-anchor="middle" fill="#64748b">4</text><rect x="380" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="408" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">c</text><rect x="380" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="408" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">63</text><text x="408" y="270" font-size="11" text-anchor="middle" fill="#64748b">5</text><rect x="440" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="468" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">␣</text><rect x="440" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="468" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">20</text><text x="468" y="270" font-size="11" text-anchor="middle" fill="#64748b">6</text><rect x="500" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="528" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">n</text><rect x="500" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="528" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">6E</text><text x="528" y="270" font-size="11" text-anchor="middle" fill="#64748b">7</text><rect x="560" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="588" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">h</text><rect x="560" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="588" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">68</text><text x="588" y="270" font-size="11" text-anchor="middle" fill="#64748b">8</text><rect x="620" y="150" width="116" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="678" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">â</text><rect x="620" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="648" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">C3</text><text x="648" y="270" font-size="11" text-anchor="middle" fill="#64748b">9</text><rect x="680" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="708" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">A2</text><text x="708" y="270" font-size="11" text-anchor="middle" fill="#64748b">10</text><rect x="740" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="768" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">n</text><rect x="740" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="768" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">6E</text><text x="768" y="270" font-size="11" text-anchor="middle" fill="#64748b">11</text><rect x="800" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="828" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">␣</text><rect x="800" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="828" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">20</text><text x="828" y="270" font-size="11" text-anchor="middle" fill="#64748b">12</text><rect x="860" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="888" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">t</text><rect x="860" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="888" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">74</text><text x="888" y="270" font-size="11" text-anchor="middle" fill="#64748b">13</text><rect x="920" y="150" width="116" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="978" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">â</text><rect x="920" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="948" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">C3</text><text x="948" y="270" font-size="11" text-anchor="middle" fill="#64748b">14</text><rect x="980" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="1008" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">A2</text><text x="1008" y="270" font-size="11" text-anchor="middle" fill="#64748b">15</text><rect x="1040" y="150" width="56" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="1068" y="187" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">m</text><rect x="1040" y="216" width="56" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="1068" y="239" font-size="14" text-anchor="middle" fill="#334155" font-family="Consolas, 'Courier New', monospace">6D</text><text x="1068" y="270" font-size="11" text-anchor="middle" fill="#64748b">16</text>
  <line x1="978" y1="136" x2="978" y2="286" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="970" y="308" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="end" font-family="Consolas, 'Courier New', monospace">substr($t, 0, 15)</text>
  <text x="970" y="328" font-size="13" fill="#7f1d1d" text-anchor="end">cuts â in half: the slip prints "Đắc nhân t�"</text>

  <rect x="40" y="370" width="1120" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="404" font-size="17" font-weight="700" fill="#334155">Use the mb_* functions for text (mbstring, UTF-8 by default)</text>
  <g font-size="15" font-family="Consolas, 'Courier New', monospace">
    <text x="64" y="442" fill="#b91c1c">strlen / substr</text><text x="330" y="442" fill="#15803d">mb_strlen / mb_substr</text>
    <text x="64" y="476" fill="#b91c1c">str_pad / printf('%-16s')</text><text x="330" y="476" fill="#15803d">mb_str_pad (PHP 8.3)</text>
    <text x="64" y="510" fill="#b91c1c">strtoupper / ucfirst</text><text x="330" y="510" fill="#15803d">mb_strtoupper / mb_ucfirst (8.4)</text>
    <text x="64" y="544" fill="#b91c1c">trim / str_split</text><text x="330" y="544" fill="#15803d">mb_trim (8.4) / mb_str_split</text>
  </g>
  <g font-size="14" fill="#334155">
    <text x="680" y="442">strlen is still right for byte limits:</text>
    <text x="680" y="464">a VARCHAR in bytes, an HTTP header, a file size.</text>
    <text x="680" y="510">strtoupper changes only a-z since PHP 8.2:</text>
    <text x="680" y="532">'Đắc nhân tâm' becomes 'ĐắC NHâN TâM'.</text>
  </g>
  <text x="64" y="590" font-size="14" fill="#475569">No mb_ version: strrev, wordwrap, ucwords and str_word_count work on bytes and ASCII letters only.</text>
  <text x="64" y="620" font-size="14" fill="#475569">Search functions (strpos, str_contains, str_replace, explode) are safe on UTF-8: a valid UTF-8 needle</text>
  <text x="64" y="642" font-size="14" fill="#475569">can only match at character boundaries. Positions from strpos are byte offsets, for substr, not mb_substr.</text>
</svg>
