<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Money as integer cents: never let a float touch an amount</text>
  <text x="40" y="82" font-size="16" fill="#475569">A binary float cannot store 19.99. An int can store 1999 exactly, and every sum of ints is exact.</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <rect x="40" y="108" width="160" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="72" y="139" fill="#334155">"19.99"</text>
    <rect x="260" y="108" width="300" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="276" y="139" fill="#b91c1c">19.989999999999998...</text>
    <rect x="620" y="108" width="300" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="636" y="139" fill="#b91c1c">* 100 = 1998.9999999...</text>
    <rect x="980" y="108" width="180" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="996" y="139" fill="#b91c1c">(int) 1998</text>

    <rect x="40" y="198" width="160" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="72" y="229" fill="#334155">"19.99"</text>
    <rect x="260" y="198" width="300" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="276" y="229" fill="#15803d">regex: "19" and "99"</text>
    <rect x="620" y="198" width="300" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="636" y="229" fill="#15803d">19 * 100 + 99</text>
    <rect x="980" y="198" width="180" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="996" y="229" fill="#15803d">1999</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="202" y1="133" x2="256" y2="133"/><line x1="562" y1="133" x2="616" y2="133"/><line x1="922" y1="133" x2="976" y2="133"/>
    <line x1="202" y1="223" x2="256" y2="223"/><line x1="562" y1="223" x2="616" y2="223"/><line x1="922" y1="223" x2="976" y2="223"/>
  </g>
  <text x="40" y="282" font-size="14" fill="#475569">"19.9" means 19.90: pad the decimals on the right, to "90". Padding on the left would give 19.09.</text>

  <rect x="40" y="306" width="540" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="340" font-size="17" font-weight="700" fill="#334155">Percentages in basis points, rounded half up</text>
  <g font-size="14" fill="#334155">
    <text x="64" y="372">1% = 100 basis points: 10% = 1000, 12.5% = 1250</text>
    <text x="64" y="410" font-family="Consolas, 'Courier New', monospace" font-weight="700">intdiv($cents * $bp + 5000, 10000)</text>
    <text x="64" y="440">adding half of the divisor before an integer division</text>
    <text x="64" y="460">rounds half up, with no float anywhere:</text>
    <text x="64" y="494" font-family="Consolas, 'Courier New', monospace">10% of 1005 cents = 100.5   -&gt; 101</text>
    <text x="64" y="518" font-family="Consolas, 'Courier New', monospace">10% of 1004 cents = 100.4   -&gt; 100</text>
    <text x="64" y="542" font-family="Consolas, 'Courier New', monospace">10% of 1999 cents = 199.9   -&gt; 200</text>
    <text x="64" y="580">Works for amounts and rates that are not negative.</text>
    <text x="64" y="602">printf('%.2f', 2.675) prints 2.67 while round(2.675, 2)</text>
    <text x="64" y="624">gives 2.68: two "roundings" of the same float disagree.</text>
  </g>

  <rect x="620" y="306" width="540" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="644" y="340" font-size="17" font-weight="700" fill="#334155">Round where the document shows a number</text>
  <g font-size="14" fill="#334155">
    <text x="644" y="372">Three postcards at 0.05 with 10% VAT:</text>
    <text x="644" y="408" font-family="Consolas, 'Courier New', monospace">per line   0.5 + 0.5 + 0.5 cents</text>
    <text x="644" y="430" font-family="Consolas, 'Courier New', monospace">           -&gt;  1  +  1  +  1  = 3 cents</text>
    <text x="644" y="466" font-family="Consolas, 'Courier New', monospace">on total   10% of 15 = 1.5 -&gt; 2 cents</text>
    <text x="644" y="504">Both are legal; the invoice must use one rule and</text>
    <text x="644" y="526">the sum of its printed lines must equal its total.</text>
    <text x="644" y="564">This shop rounds each line, so the VAT on the invoice</text>
    <text x="644" y="586">is the sum of the VAT printed on every line, and the</text>
    <text x="644" y="608">card is charged exactly the total on the PDF.</text>
  </g>
</svg>
