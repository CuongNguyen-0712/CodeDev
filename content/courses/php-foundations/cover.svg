<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Modern PHP 8.4 foundations (loose vs strict comparison, array union losing keys). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13131F"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#777BB4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#777BB4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8BBE6"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#777BB4"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3DBE7B"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <ellipse cx="158" cy="198" rx="54" ry="34" fill="#777BB4"/>
    <text x="158" y="211" text-anchor="middle" font-size="36" font-weight="800" font-style="italic" fill="#13131F">php</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#B8BBE6">PHP 8.4 · FOUNDATIONS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Modern PHP</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Foundations</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Strict types · Arrays · Enums · Safe input</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#DADCF4">
      <rect x="110" y="660" width="236" height="52" rx="26" fill="#1C1D33" stroke="#777BB4"/>
      <text x="228" y="695" text-anchor="middle">strict_types</text>
      <rect x="362" y="660" width="107" height="52" rx="26" fill="#1C1D33" stroke="#777BB4"/>
      <text x="415.5" y="695" text-anchor="middle">===</text>
      <rect x="485" y="660" width="121" height="52" rx="26" fill="#1C1D33" stroke="#777BB4"/>
      <text x="545.5" y="695" text-anchor="middle">enum</text>
      <rect x="622" y="660" width="136" height="52" rx="26" fill="#1C1D33" stroke="#777BB4"/>
      <text x="690" y="695" text-anchor="middle">match</text>
    </g>
  </g>

  <!-- Loose == says two different strings are equal; + on arrays keeps the left keys and drops the right values -->
  <g id="art" font-family="Consolas, Menlo, monospace">
    <text x="900" y="254" font-size="20" letter-spacing="3" fill="#B8BBE6">LOOSE VS STRICT</text>
    <rect x="900" y="276" width="630" height="176" rx="14" fill="#18182A" stroke="#3A3C66" stroke-width="2"/>
    <text x="930" y="340" font-size="28" fill="#F4F2F8"><tspan fill="#C3E88D">"1e1"</tspan> == <tspan fill="#C3E88D">"10"</tspan></text>
    <rect x="1370" y="306" width="130" height="48" rx="24" fill="#F2555A" fill-opacity="0.18" stroke="#F2555A" stroke-width="2"/>
    <text x="1435" y="339" font-size="24" font-weight="700" fill="#F2555A" text-anchor="middle">true</text>
    <path d="M930 364 H1500" stroke="#2A2C4A" stroke-width="2"/>
    <text x="930" y="420" font-size="28" fill="#F4F2F8"><tspan fill="#C3E88D">"1e1"</tspan> === <tspan fill="#C3E88D">"10"</tspan></text>
    <rect x="1370" y="386" width="130" height="48" rx="24" fill="#3DBE7B" fill-opacity="0.18" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1435" y="419" font-size="24" font-weight="700" fill="#3DBE7B" text-anchor="middle">false</text>
    <text x="900" y="512" font-size="20" letter-spacing="3" fill="#B8BBE6">ARRAY UNION +</text>
    <g font-size="26" font-weight="700" text-anchor="middle">
    <rect x="900" y="530" width="56" height="56" rx="10" fill="#777BB4" fill-opacity="0.85"/>
    <text x="928" y="567" fill="#13131F">a</text>
    <rect x="962" y="530" width="56" height="56" rx="10" fill="#777BB4" fill-opacity="0.85"/>
    <text x="990" y="567" fill="#13131F">b</text>
    <text x="1043" y="569" fill="#B8B2C8" font-size="34">+</text>
    <rect x="1068" y="530" width="56" height="56" rx="10" fill="#18182A" stroke="#F2555A" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1096" y="567" fill="#F2555A">x</text>
    <rect x="1130" y="530" width="56" height="56" rx="10" fill="#18182A" stroke="#F2555A" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1158" y="567" fill="#F2555A">y</text>
    <rect x="1192" y="530" width="56" height="56" rx="10" fill="#F2C14E" fill-opacity="0.85"/>
    <text x="1220" y="567" fill="#1A1405">z</text>
    <text x="1277" y="569" fill="#B8B2C8" font-size="34">=</text>
    <rect x="1306" y="530" width="56" height="56" rx="10" fill="#777BB4" fill-opacity="0.85"/>
    <text x="1334" y="567" fill="#13131F">a</text>
    <rect x="1368" y="530" width="56" height="56" rx="10" fill="#777BB4" fill-opacity="0.85"/>
    <text x="1396" y="567" fill="#13131F">b</text>
    <rect x="1430" y="530" width="56" height="56" rx="10" fill="#F2C14E" fill-opacity="0.85"/>
    <text x="1458" y="567" fill="#1A1405">z</text>
    </g>
    <g font-size="18" fill="#6F6A80" text-anchor="middle">
    <text x="928" y="612">0</text><text x="990" y="612">1</text>
    <text x="1096" y="612">0</text><text x="1158" y="612">1</text><text x="1220" y="612">2</text>
    <text x="1334" y="612">0</text><text x="1396" y="612">1</text><text x="1458" y="612">2</text>
    </g>
    <text x="900" y="660" font-size="22" fill="#F2555A">keys 0, 1 taken: x and y are lost</text>
  </g>
</svg>
