<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: observability with OpenTelemetry (a trace waterfall with a gap at the queue, and a burn-rate alert). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#0F766E"/>
    <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
      <line x1="132" y1="178" x2="184" y2="178"/>
      <line x1="146" y1="198" x2="176" y2="198"/>
      <line x1="160" y1="218" x2="186" y2="218"/>
    </g>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#5EEAD4">TYPESCRIPT · OBSERVABILITY</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Observability with</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">OpenTelemetry</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Logs · Metrics · Traces · SLO alerts</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CCF5EE">
      <rect x="110" y="660" width="194" height="52" rx="26" fill="#10262A" stroke="#14B8A6"/>
      <text x="207" y="695" text-anchor="middle">traceparent</text>
      <rect x="320" y="660" width="92" height="52" rx="26" fill="#10262A" stroke="#14B8A6"/>
      <text x="366" y="695" text-anchor="middle">p99</text>
      <rect x="428" y="660" width="194" height="52" rx="26" fill="#10262A" stroke="#14B8A6"/>
      <text x="525" y="695" text-anchor="middle">burn rate</text>
    </g>
  </g>

  <!-- Trace waterfall -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="900" y="170" width="600" height="560" rx="18" fill="#121A1F" stroke="#22343A" stroke-width="2"/>
    <text x="930" y="222" font-size="22" fill="#B8B2C8">POST /submissions   1.24 s</text>
    <line x1="924" y1="244" x2="1476" y2="244" stroke="#22343A"/>

    <g font-size="19">
      <text x="930" y="290" fill="#CCF5EE">web</text>
      <rect x="1150" y="272" width="320" height="26" rx="5" fill="#14B8A6"/>

      <text x="948" y="340" fill="#CCF5EE">submissions-api</text>
      <rect x="1150" y="322" width="80" height="26" rx="5" fill="#2DD4BF"/>

      <text x="966" y="390" fill="#CCF5EE">postgres insert</text>
      <rect x="1162" y="372" width="34" height="26" rx="5" fill="#5EEAD4"/>

      <text x="948" y="440" fill="#F2A3A6">queue wait</text>
      <rect x="1232" y="422" width="148" height="26" rx="5" fill="none" stroke="#F2555A" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="1306" y="441" text-anchor="middle" font-size="17" fill="#F2A3A6">800 ms</text>

      <text x="948" y="490" fill="#CCF5EE">runner-worker</text>
      <rect x="1382" y="472" width="88" height="26" rx="5" fill="#2DD4BF"/>
    </g>

    <rect x="924" y="540" width="552" height="160" rx="10" fill="#2A1418" stroke="#F2555A"/>
    <text x="948" y="580" font-size="20" fill="#F2A3A6">ALERT submissions-api availability</text>
    <text x="948" y="618" font-size="20" fill="#E4DCFB">burn rate 1h  16.2  &gt; 14.4</text>
    <text x="948" y="652" font-size="20" fill="#E4DCFB">burn rate 5m  18.9  &gt; 14.4</text>
    <text x="948" y="686" font-size="20" fill="#9FE3BF">page: budget gone in 2 days</text>
  </g>
</svg>
