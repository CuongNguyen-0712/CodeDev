<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A media query asks the window. A container query asks the slot.</text>
  <text x="40" y="82" font-size="16" fill="#475569">The same product card in a 600px main column and in a 300px sidebar, on a 1440px-wide window.</text>

  <!-- Left: media query -->
  <rect x="40" y="112" width="545" height="300" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="146" font-size="18" font-weight="700" fill="#b91c1c">Before: @media (min-width: 768px)</text>
  <text x="64" y="170" font-size="13" fill="#64748b">asks the window: 1440px wide, so it is true for every card</text>

  <rect x="64" y="184" width="497" height="146" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="76" y="202" font-size="12" fill="#64748b">window: 1440px</text>
  <rect x="76" y="210" width="300" height="110" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="226" font-size="12" fill="#64748b">main: 600px</text>
  <rect x="88" y="234" width="276" height="76" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="96" y="242" width="110" height="60" rx="3" fill="#e2e8f0"/>
  <rect x="216" y="248" width="130" height="7" rx="2" fill="#94a3b8"/>
  <rect x="216" y="262" width="110" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="216" y="276" width="120" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="216" y="290" width="50" height="12" rx="3" fill="#64748b"/>

  <rect x="388" y="210" width="161" height="110" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="396" y="226" font-size="12" fill="#64748b">sidebar: 300px</text>
  <rect x="396" y="234" width="145" height="76" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="402" y="242" width="110" height="60" rx="3" fill="#e2e8f0"/>
  <rect x="518" y="242" width="38" height="5" rx="2" fill="#ef4444"/>
  <rect x="518" y="252" width="30" height="5" rx="2" fill="#ef4444"/>
  <rect x="518" y="262" width="40" height="5" rx="2" fill="#ef4444"/>
  <rect x="518" y="272" width="26" height="5" rx="2" fill="#ef4444"/>
  <rect x="518" y="282" width="36" height="5" rx="2" fill="#ef4444"/>
  <rect x="518" y="292" width="34" height="5" rx="2" fill="#ef4444"/>
  <rect x="518" y="302" width="28" height="5" rx="2" fill="#ef4444"/>

  <text x="64" y="354" font-size="14" fill="#334155">Main card: two columns. Fine.</text>
  <text x="64" y="378" font-size="14" font-weight="700" fill="#b91c1c">Sidebar card: also two columns</text>
  <text x="64" y="398" font-size="13" fill="#b91c1c">32px left for the text: one word per line, the card overflows</text>

  <!-- Right: container query -->
  <rect x="615" y="112" width="545" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="146" font-size="18" font-weight="700" fill="#15803d">After: @container card (min-width: 30rem)</text>
  <text x="639" y="170" font-size="13" fill="#64748b">asks the slot: 600px matches (30rem = 480px), 300px does not</text>

  <rect x="639" y="184" width="497" height="146" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="651" y="202" font-size="12" fill="#64748b">window: 1440px</text>
  <rect x="651" y="210" width="300" height="110" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="659" y="226" font-size="12" fill="#64748b">main slot: 600px</text>
  <rect x="663" y="234" width="276" height="76" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="671" y="242" width="110" height="60" rx="3" fill="#dcfce7"/>
  <rect x="791" y="248" width="130" height="7" rx="2" fill="#94a3b8"/>
  <rect x="791" y="262" width="110" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="791" y="276" width="120" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="791" y="290" width="50" height="12" rx="3" fill="#16a34a"/>

  <rect x="963" y="210" width="161" height="110" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="971" y="226" font-size="12" fill="#64748b">sidebar slot: 300px</text>
  <rect x="971" y="234" width="145" height="78" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="977" y="240" width="133" height="30" rx="3" fill="#dcfce7"/>
  <rect x="977" y="276" width="120" height="6" rx="2" fill="#94a3b8"/>
  <rect x="977" y="287" width="96" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="977" y="298" width="44" height="9" rx="3" fill="#16a34a"/>

  <text x="639" y="354" font-size="14" fill="#334155">Main card: 600px slot, two columns.</text>
  <text x="639" y="378" font-size="14" font-weight="700" fill="#15803d">Sidebar card: 300px slot, one column</text>
  <text x="639" y="398" font-size="13" fill="#15803d">image on top, text at full width, the Buy button fits</text>

  <!-- Units -->
  <text x="40" y="452" font-size="18" font-weight="700" fill="#334155">What each unit is relative to</text>

  <rect x="40" y="468" width="180" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="56" y="500" font-size="20" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">px</text>
  <text x="56" y="526" font-size="13" fill="#475569">fixed CSS pixels;</text>
  <text x="56" y="546" font-size="13" fill="#475569">user font ignored</text>

  <rect x="228" y="468" width="180" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="244" y="500" font-size="20" font-weight="700" fill="#b45309" font-family="Consolas, 'Courier New', monospace">rem</text>
  <text x="244" y="526" font-size="13" fill="#92400e">html font size;</text>
  <text x="244" y="546" font-size="13" fill="#92400e">follows user default</text>

  <rect x="416" y="468" width="180" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="432" y="500" font-size="20" font-weight="700" fill="#b45309" font-family="Consolas, 'Courier New', monospace">em</text>
  <text x="432" y="526" font-size="13" fill="#92400e">current font size;</text>
  <text x="432" y="546" font-size="13" fill="#92400e">compounds if nested</text>

  <rect x="604" y="468" width="180" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="500" font-size="20" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">%</text>
  <text x="620" y="526" font-size="13" fill="#475569">a per-property basis;</text>
  <text x="620" y="546" font-size="13" fill="#475569">width: parent width</text>

  <rect x="792" y="468" width="180" height="92" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="808" y="500" font-size="20" font-weight="700" fill="#0e7490" font-family="Consolas, 'Courier New', monospace">vw / vh</text>
  <text x="808" y="526" font-size="13" fill="#155e75">1% of the viewport</text>
  <text x="808" y="546" font-size="13" fill="#155e75">width / height</text>

  <rect x="980" y="468" width="180" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="996" y="500" font-size="20" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">cqi</text>
  <text x="996" y="526" font-size="13" fill="#166534">1% of the query</text>
  <text x="996" y="546" font-size="13" fill="#166534">container's width</text>
</svg>
