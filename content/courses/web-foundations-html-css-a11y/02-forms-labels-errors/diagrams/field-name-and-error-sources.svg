<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Where a form field gets its name - and its error</text>
  <text x="40" y="82" font-size="16" fill="#475569">A screen reader reads the field's name, role, state and description. A placeholder is a hint, and a red border is not an error message.</text>

  <!-- Left: before -->
  <rect x="40" y="108" width="545" height="292" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="140" font-size="18" font-weight="700" fill="#b91c1c">Before: a hint instead of a label + red border</text>
  <rect x="64" y="156" width="497" height="86" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">
    <tspan x="80" y="182">&lt;span class="hint"&gt;Email&lt;/span&gt;</tspan>
    <tspan x="80" y="204">&lt;input type="text" name="f1"</tspan>
    <tspan x="139" y="226">class="has-error"&gt;  /* red border */</tspan>
  </text>
  <text x="64" y="272" font-size="13" fill="#64748b">Heard:</text>
  <rect x="64" y="282" width="497" height="36" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="305" font-size="15" font-weight="700" fill="#b91c1c">"edit text, blank"  - which field? what is wrong?</text>
  <text x="64" y="344" font-size="13" fill="#7f1d1d">The hint is not tied to the field, and it hides when you type.</text>
  <text x="64" y="364" font-size="13" fill="#7f1d1d">The error is colour only: invisible without red-green vision.</text>
  <text x="64" y="384" font-size="13" fill="#7f1d1d">No autocomplete token: autofill has to guess.</text>

  <!-- Right: after -->
  <rect x="615" y="108" width="545" height="292" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="140" font-size="18" font-weight="700" fill="#15803d">After: label + description + state</text>
  <rect x="639" y="156" width="497" height="138" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">
    <tspan x="655" y="180">&lt;label for="email"&gt;Email address&lt;/label&gt;</tspan>
    <tspan x="655" y="200">&lt;input id="email" type="email" name="email"</tspan>
    <tspan x="672" y="220">autocomplete="email" aria-invalid="true"</tspan>
    <tspan x="672" y="240">aria-describedby="email-hint email-error"&gt;</tspan>
    <tspan x="655" y="260">&lt;p id="email-error"&gt;Error: enter an email</tspan>
    <tspan x="672" y="280">like name@example.com&lt;/p&gt;</tspan>
  </text>
  <text x="639" y="318" font-size="13" fill="#64748b">Heard (wording varies by screen reader):</text>
  <rect x="639" y="326" width="497" height="64" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="350" font-size="15" font-weight="700" fill="#15803d">"Email address, edit text, invalid entry,</text>
  <text x="655" y="374" font-size="15" font-weight="700" fill="#15803d"> ...Error: enter an email like name@example.com"</text>

  <!-- Name ladder -->
  <text x="40" y="436" font-size="18" font-weight="700" fill="#334155">The name: the first source that gives text wins</text>
  <rect x="40" y="452" width="250" height="86" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="58" y="482" font-size="15" font-weight="700" fill="#0e7490">1  aria-labelledby</text>
  <text x="58" y="506" font-size="13" fill="#155e75">text of the referenced ids,</text>
  <text x="58" y="522" font-size="13" fill="#155e75">joined in list order</text>
  <line x1="290" y1="491" x2="318" y2="491" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="314,485 314,497 326,491" fill="#94a3b8"/>

  <rect x="330" y="452" width="250" height="86" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="348" y="482" font-size="15" font-weight="700" fill="#0e7490">2  aria-label</text>
  <text x="348" y="506" font-size="13" fill="#155e75">a string on the control,</text>
  <text x="348" y="522" font-size="13" fill="#155e75">invisible on screen</text>
  <line x1="580" y1="491" x2="608" y2="491" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="604,485 604,497 616,491" fill="#94a3b8"/>

  <rect x="620" y="452" width="250" height="86" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="638" y="482" font-size="15" font-weight="700" fill="#15803d">3  &lt;label&gt;</text>
  <text x="638" y="506" font-size="13" fill="#166534">for="id" or wrapping the field:</text>
  <text x="638" y="522" font-size="13" fill="#166534">visible and clickable - prefer it</text>
  <line x1="870" y1="491" x2="898" y2="491" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="894,485 894,497 906,491" fill="#94a3b8"/>

  <rect x="910" y="452" width="250" height="86" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="928" y="482" font-size="15" font-weight="700" fill="#b45309">4  title, placeholder</text>
  <text x="928" y="506" font-size="13" fill="#92400e">last-resort fallbacks,</text>
  <text x="928" y="522" font-size="13" fill="#92400e">not labels: treat as missing</text>

  <text x="40" y="566" font-size="14" fill="#475569">The description: aria-describedby="hint error" adds the hint and the error text after the name. aria-invalid="true" adds the state.</text>
</svg>
