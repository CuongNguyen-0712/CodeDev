<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">The cascade asks its questions in order. The first difference decides.</text>
  <text x="40" y="82" font-size="16" fill="#475569">Every declaration that sets the same property on the element competes. A later step only breaks ties.</text>

  <!-- Left: the six steps -->
  <rect x="40" y="108" width="520" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="140" r="14" fill="#475569"/>
  <text x="70" y="145" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="96" y="135" font-size="16" font-weight="700" fill="#334155">Origin and importance</text>
  <text x="96" y="157" font-size="13" fill="#64748b">!important beats normal; your CSS beats browser defaults</text>

  <rect x="40" y="180" width="520" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="212" r="14" fill="#475569"/>
  <text x="70" y="217" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="96" y="207" font-size="16" font-weight="700" fill="#334155">Context</text>
  <text x="96" y="229" font-size="13" fill="#64748b">shadow DOM: page styles vs component styles (not in this lesson)</text>

  <rect x="40" y="252" width="520" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="284" r="14" fill="#475569"/>
  <text x="70" y="289" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="96" y="279" font-size="16" font-weight="700" fill="#334155">Style attribute</text>
  <text x="96" y="301" font-size="13" fill="#64748b">style="..." beats any selector of the same importance</text>

  <rect x="40" y="324" width="520" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="70" cy="356" r="14" fill="#d97706"/>
  <text x="70" y="361" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="96" y="351" font-size="16" font-weight="700" fill="#b45309">Cascade layers</text>
  <text x="540" y="351" font-size="12" font-weight="700" fill="#b45309" text-anchor="end">decides the incident</text>
  <text x="96" y="373" font-size="13" fill="#92400e">unlayered &gt; later layer &gt; earlier layer (reversed for !important)</text>

  <rect x="40" y="396" width="520" height="64" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="70" cy="428" r="14" fill="#0891b2"/>
  <text x="70" y="433" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="96" y="423" font-size="16" font-weight="700" fill="#0e7490">Specificity (A, B, C)</text>
  <text x="540" y="423" font-size="12" font-weight="700" fill="#0e7490" text-anchor="end">decides the disabled state</text>
  <text x="96" y="445" font-size="13" fill="#155e75">compared column by column: one #id beats 11 .classes</text>

  <rect x="40" y="468" width="520" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="500" r="14" fill="#475569"/>
  <text x="70" y="505" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="96" y="495" font-size="16" font-weight="700" fill="#334155">Order of appearance</text>
  <text x="96" y="517" font-size="13" fill="#64748b">the declaration that comes last wins</text>

  <text x="40" y="566" font-size="13" fill="#64748b">Inheritance is not a step: a property inherits only when no declaration sets it on the element.</text>

  <!-- Right top: before -->
  <rect x="600" y="108" width="560" height="210" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="624" y="140" font-size="18" font-weight="700" fill="#b91c1c">Before: Pay now turns grey (checkout only)</text>
  <rect x="624" y="156" width="512" height="36" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="179" font-size="14" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">form button</text>
  <text x="780" y="179" font-size="14" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">unlayered</text>
  <text x="980" y="179" font-size="14" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">(0,0,2)</text>
  <text x="1120" y="179" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="end">WINS</text>
  <rect x="624" y="200" width="512" height="36" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="640" y="223" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">.btn-primary</text>
  <text x="780" y="223" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">@layer components</text>
  <text x="980" y="223" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">(0,1,0)</text>
  <text x="624" y="266" font-size="15" font-weight="700" fill="#b91c1c">Step 4 decides: unlayered beats every layer.</text>
  <text x="624" y="292" font-size="13" fill="#64748b">Specificity is never compared, so (0,1,0) cannot help.</text>

  <!-- Right bottom: after -->
  <rect x="600" y="336" width="560" height="224" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="624" y="368" font-size="18" font-weight="700" fill="#15803d">After: the date picker goes into an early layer</text>
  <text x="624" y="394" font-size="13" fill="#166534" font-family="Consolas, 'Courier New', monospace">@layer reset, vendor, base, components, utilities;</text>
  <rect x="624" y="408" width="512" height="36" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="640" y="431" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">form button</text>
  <text x="780" y="431" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">@layer vendor</text>
  <text x="980" y="431" font-size="14" fill="#334155" font-family="Consolas, 'Courier New', monospace">(0,0,2)</text>
  <rect x="624" y="452" width="512" height="36" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="475" font-size="14" fill="#15803d" font-family="Consolas, 'Courier New', monospace">.btn-primary</text>
  <text x="780" y="475" font-size="14" fill="#15803d" font-family="Consolas, 'Courier New', monospace">@layer components</text>
  <text x="980" y="475" font-size="14" fill="#15803d" font-family="Consolas, 'Courier New', monospace">(0,1,0)</text>
  <text x="1120" y="475" font-size="13" font-weight="700" fill="#15803d" text-anchor="end">WINS</text>
  <text x="624" y="514" font-size="15" font-weight="700" fill="#15803d">Step 4: components is declared after vendor.</text>
  <text x="624" y="540" font-size="13" fill="#64748b">Disabled: same layer, so step 5 decides: .btn:disabled (0,2,0) wins.</text>
</svg>
