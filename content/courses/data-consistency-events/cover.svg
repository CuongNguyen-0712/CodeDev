<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: data consistency (a transaction writing the row and the outbox, a publisher, an idempotent consumer). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1A19"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3BA7A0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3BA7A0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#3BA7A0"/>
    <text x="158" y="214" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">EV</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#9EDCD7">OUTBOX · EVENTS · SAGAS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Data</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Consistency</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Outbox · Idempotent consumers · Sagas</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#D2F2EF">
      <rect x="110" y="660" width="122" height="52" rx="26" fill="#10231F" stroke="#3BA7A0"/>
      <text x="170.8" y="695" text-anchor="middle">outbox</text>
      <rect x="247.6" y="660" width="106" height="52" rx="26" fill="#10231F" stroke="#3BA7A0"/>
      <text x="300.6" y="695" text-anchor="middle">inbox</text>
      <rect x="369.6" y="660" width="122" height="52" rx="26" fill="#10231F" stroke="#3BA7A0"/>
      <text x="430.4" y="695" text-anchor="middle">replay</text>
    </g>
  </g>

  <g id="art" font-family="Consolas, Menlo, monospace">
    <rect x="880" y="230" width="270" height="150" rx="14" fill="#10231F" stroke="#3BA7A0" stroke-width="2"/>
    <text x="900" y="268" font-size="19" fill="#9EDCD7" text-anchor="start">BEGIN</text>
    <text x="900" y="302" font-size="19" fill="#D2F2EF" text-anchor="start">INSERT enrollments</text>
    <text x="900" y="336" font-size="19" fill="#3DBE7B" text-anchor="start">INSERT outbox</text>
    <text x="900" y="370" font-size="19" fill="#9EDCD7" text-anchor="start">COMMIT</text>
    <path d="M1150 305 H1210" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="1214" y="270" width="226" height="70" rx="14" fill="#15131D" stroke="#3BA7A0" stroke-width="2"/>
    <text x="1327" y="312" font-size="20" fill="#D2F2EF" text-anchor="middle">publisher</text>
    <path d="M1327 340 V420" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="1180" y="424" width="260" height="110" rx="14" fill="#13201A" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1200" y="462" font-size="19" fill="#9BE7BD" text-anchor="start">consumer (inbox)</text>
    <text x="1200" y="498" font-size="18" fill="#B8B2C8" text-anchor="start">evt_812 seen → skip</text>
    <text x="880" y="450" font-size="19" fill="#B8B2C8" text-anchor="start">at-least-once</text>
    <text x="880" y="488" font-size="19" fill="#B8B2C8" text-anchor="start">order per enrollment_id</text>
    <text x="880" y="560" font-size="19" fill="#F2C14E" text-anchor="start">saga: pay → enroll → certificate</text>
    <text x="880" y="596" font-size="19" fill="#F2C14E" text-anchor="start">compensate: refund on failure</text>
  </g>
</svg>
