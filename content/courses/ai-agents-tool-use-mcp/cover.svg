<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: AI agents, tool use and MCP (an agent run where each tool call passes a permission policy). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B9A4F5"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#7C3AED"/>
    <text x="158" y="211" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="800" fill="#FFFFFF">&gt;_</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#B9A4F5">AI · AGENTS · MCP</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">AI Agents,</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Tool Use &amp; MCP</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Agent loop · Permissions · Budgets</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#E4DCFB">
      <rect x="110" y="660" width="164" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="192" y="695" text-anchor="middle">tools/call</text>
      <rect x="290" y="660" width="122" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="351" y="695" text-anchor="middle">audit</text>
      <rect x="428" y="660" width="174" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="515" y="695" text-anchor="middle">maxSteps</text>
    </g>
  </g>

  <!-- Agent run panel -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="900" y="170" width="600" height="560" rx="18" fill="#15111F" stroke="#2C2440" stroke-width="2"/>
    <rect x="900" y="170" width="600" height="56" rx="18" fill="#1C1629"/>
    <rect x="900" y="208" width="600" height="18" fill="#1C1629"/>
    <circle cx="934" cy="198" r="8" fill="#F2555A"/>
    <circle cx="960" cy="198" r="8" fill="#F2C14E"/>
    <circle cx="986" cy="198" r="8" fill="#3DBE7B"/>
    <text x="1020" y="206" font-size="22" fill="#B8B2C8">study-plan-agent run</text>

    <g font-size="21">
      <text x="930" y="270" fill="#6F6A80">Tool call</text>
      <text x="1370" y="270" fill="#6F6A80">Policy</text>
      <line x1="924" y1="286" x2="1476" y2="286" stroke="#2C2440"/>

      <text x="930" y="326" fill="#E4DCFB">get_progress</text>
      <text x="1370" y="326" fill="#3DBE7B">allow</text>

      <text x="930" y="372" fill="#E4DCFB">search_lessons</text>
      <text x="1370" y="372" fill="#3DBE7B">allow</text>

      <text x="930" y="418" fill="#E4DCFB">create_study_plan</text>
      <text x="1370" y="418" fill="#F2C14E">ask</text>
    </g>

    <rect x="924" y="452" width="552" height="112" rx="10" fill="#2A1418" stroke="#F2555A"/>
    <text x="948" y="492" font-size="20" fill="#F2A3A6">delete_test_data(env: production)</text>
    <text x="948" y="528" font-size="20" fill="#F2A3A6">source: text inside ticket #4821</text>
    <path d="M1200 568 C1200 600 1200 610 1200 626" stroke="#B9A4F5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="924" y="632" width="552" height="72" rx="10" fill="#10241A" stroke="#3DBE7B"/>
    <text x="948" y="676" font-size="20" fill="#9FE3BF">deny: destructive in production</text>
  </g>
</svg>
