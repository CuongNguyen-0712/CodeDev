# Rice Rocket image build: every pull request into main builds the api image; pushes to main and
# release tags (v1.4.0) push it to GHCR with tags that name the commit, the branch and the release.
name: image

on:
  # @piece triggers: Pull requests into main, pushes to main, release tags
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # @end

# @piece packages-permission: What the GITHUB_TOKEN of this job may do
permissions:
  contents: read
  packages: write
# @end

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # @piece login-ghcr: Sign in to ghcr.io, except on pull requests
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # @end
      # @piece meta-tags: Tags naming the commit, branch, pull request and release
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rice-rocket/api
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # @end
      # @piece build-push: Build api/, push except on pull requests, reuse the cache
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # @end
