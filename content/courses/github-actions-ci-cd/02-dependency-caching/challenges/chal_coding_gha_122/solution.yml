# Rice Rocket CI: the test job, with npm's download cache kept between runs.
# The api lives in api/ (Node version in api/.nvmrc, dependencies locked in api/package-lock.json).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: api/.nvmrc
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          # @piece cache-path: What to keep between runs
          path: ~/.npm
          # @end
          # @piece cache-key: The key: runner OS and the exact lockfile
          key: npm-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}
          # @end
          # @piece restore-keys: Fallback after the lockfile changed
          restore-keys: |
            npm-${{ runner.os }}-
          # @end
      # @piece install-always: Install the locked dependencies
      - run: npm ci
      # @end
      - run: npm test
