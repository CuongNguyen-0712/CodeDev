# Rice Rocket CI: integration tests of the api on every supported Node and Postgres version.
# Staging runs Postgres 16, production Postgres 17; Node 25 is tried early, without blocking merges.
name: integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # [ ] Let every combination finish when one fails
      matrix:
        # [ ] The Node and Postgres versions to support
        # [ ] One extra, experimental combination
    # [ ] A failure that must not fail the whole run
    # [ ] Postgres of the matrix version, ready before tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:integration
        # [ ] Where the tests find the database
