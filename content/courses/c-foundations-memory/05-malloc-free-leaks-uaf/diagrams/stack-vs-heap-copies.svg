<text x="644" y="484" font-size="14" font-weight="700" fill="#15803d">printf shows TEA-500, MUG-01, CARD-TET</text>
<text x="644" y="506" font-size="13" fill="#14532d">one owner per block: free(recent[i]) exactly once, then recent[i] = NULL</text>
<text x="40" y="566" font-size="13" fill="#475569">Addresses are illustrative. The stack frame of main lives until main returns; a heap block lives until free() is called on it.</text>
