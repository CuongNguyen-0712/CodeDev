<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">0x100 into one byte: a BOOL typedef truncates, bool converts</text>
  <text x="40" y="82" font-size="16" fill="#475569">flags &amp; 0x100 is the int 256. Where it is stored decides whether the label says HANG LE VO (fragile).</text>

  <!-- Left: unsigned char BOOL -->
  <rect x="40" y="108" width="550" height="252" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="64" y="140" font-size="16" font-weight="700" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">BOOL fragile = flags &amp; 0x100;</text>
  <text x="64" y="164" font-size="13" fill="#7f1d1d">typedef unsigned char BOOL;  (old C89 header)</text>
  <text x="64" y="192" font-size="13" fill="#334155">int 256 in memory (4 bytes, little-endian x86-64)</text>
  <text x="90" y="210" font-size="12" fill="#64748b">+0</text>
  <text x="160" y="210" font-size="12" fill="#64748b">+1</text>
  <text x="230" y="210" font-size="12" fill="#64748b">+2</text>
  <text x="300" y="210" font-size="12" fill="#64748b">+3</text>
  <rect x="64" y="216" width="70" height="44" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <rect x="134" y="216" width="70" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="204" y="216" width="70" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="274" y="216" width="70" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="99" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">00</text>
  <text x="169" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">01</text>
  <text x="239" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">00</text>
  <text x="309" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">00</text>
  <text x="370" y="234" font-size="13" fill="#7f1d1d">the 1 bit lives in byte +1</text>
  <text x="370" y="254" font-size="13" fill="#7f1d1d">256 mod 256 = 0</text>
  <line x1="99" y1="262" x2="99" y2="290" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrRed)"/>
  <rect x="64" y="296" width="70" height="44" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="99" y="324" font-size="16" text-anchor="middle" font-weight="700" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">00</text>
  <text x="152" y="314" font-size="14" font-weight="700" fill="#b91c1c">fragile = 0</text>
  <text x="152" y="334" font-size="13" fill="#7f1d1d">no warning with -Wall -Wextra; a normal label is printed</text>

  <!-- Right: bool -->
  <rect x="610" y="108" width="550" height="252" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="634" y="140" font-size="16" font-weight="700" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">bool fragile = flags &amp; 0x100;</text>
  <text x="634" y="164" font-size="13" fill="#14532d">C23: bool is a keyword (1 byte on this platform)</text>
  <text x="634" y="192" font-size="13" fill="#334155">the same int 256</text>
  <text x="660" y="210" font-size="12" fill="#64748b">+0</text>
  <text x="730" y="210" font-size="12" fill="#64748b">+1</text>
  <text x="800" y="210" font-size="12" fill="#64748b">+2</text>
  <text x="870" y="210" font-size="12" fill="#64748b">+3</text>
  <rect x="634" y="216" width="280" height="44" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <line x1="704" y1="216" x2="704" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="774" y1="216" x2="774" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="844" y1="216" x2="844" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="669" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">00</text>
  <text x="739" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">01</text>
  <text x="809" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">00</text>
  <text x="879" y="244" font-size="16" text-anchor="middle" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">00</text>
  <text x="940" y="234" font-size="13" fill="#14532d">the whole value is tested:</text>
  <text x="940" y="254" font-size="13" fill="#14532d">non-zero becomes true</text>
  <path d="M774 262 L774 276 L669 276 L669 290" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrGreen)"/>
  <rect x="634" y="296" width="70" height="44" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="669" y="324" font-size="16" text-anchor="middle" font-weight="700" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">01</text>
  <text x="722" y="314" font-size="14" font-weight="700" fill="#15803d">fragile = true (1)</text>
  <text x="722" y="334" font-size="13" fill="#14532d">the label prints HANG LE VO</text>

  <!-- Bottom: old idiom -> C23 -->
  <rect x="40" y="384" width="1120" height="192" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="414" font-size="14" font-weight="700" fill="#334155">Old idiom</text>
  <text x="394" y="414" font-size="14" font-weight="700" fill="#334155">C23 replacement</text>
  <text x="790" y="414" font-size="14" font-weight="700" fill="#334155">Why</text>

  <text x="64" y="450" font-size="14" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">#define MAX_LABEL 32 + 1</text>
  <line x1="336" y1="446" x2="376" y2="446" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="394" y="450" font-size="14" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">constexpr int MAX_LABEL = 32 + 1;</text>
  <text x="790" y="450" font-size="13" fill="#334155">MAX_LABEL * 2 is 34 as text, 66 as an object</text>

  <text x="64" y="484" font-size="14" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">BOOL f = x; f == TRUE</text>
  <line x1="336" y1="480" x2="376" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="394" y="484" font-size="14" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">bool f = x; if (f)</text>
  <text x="790" y="484" font-size="13" fill="#334155">bool turns every non-zero value into 1</text>

  <text x="64" y="518" font-size="14" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">print_skus(..., 0)</text>
  <line x1="336" y1="514" x2="376" y2="514" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="394" y="518" font-size="14" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">print_skus(..., nullptr)</text>
  <text x="790" y="518" font-size="13" fill="#334155">0 is a 4-byte int; nullptr has pointer size (8)</text>

  <text x="64" y="552" font-size="14" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">memset(pin, 0, 8)</text>
  <line x1="336" y1="548" x2="376" y2="548" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="394" y="552" font-size="14" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">memset_explicit(pin, 0, 8)</text>
  <text x="790" y="552" font-size="13" fill="#334155">-O2 may delete the memset; this call stays</text>
</svg>
