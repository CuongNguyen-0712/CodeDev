<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Seven days are indexes 0 to 6: the range [0, 7)</text>
  <text x="40" y="82" font-size="16" fill="#475569">int scans[7] is 7 ints of 4 bytes = 28 bytes. scans[7] is one past the end: reading it is undefined behaviour.</text>

  <!-- Top: the array in memory -->
  <rect x="40" y="104" width="1120" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="184" font-size="16" font-weight="700" fill="#334155">scans</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" text-anchor="middle">
    <g font-size="13" fill="#475569">
      <text x="185" y="140">[0]</text><text x="305" y="140">[1]</text><text x="425" y="140">[2]</text><text x="545" y="140">[3]</text>
      <text x="665" y="140">[4]</text><text x="785" y="140">[5]</text><text x="905" y="140">[6]</text>
    </g>
    <text x="1025" y="140" font-size="13" fill="#b91c1c" font-weight="700">[7]</text>

    <g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
      <rect x="130" y="150" width="110" height="50" rx="6"/><rect x="250" y="150" width="110" height="50" rx="6"/>
      <rect x="370" y="150" width="110" height="50" rx="6"/><rect x="490" y="150" width="110" height="50" rx="6"/>
      <rect x="610" y="150" width="110" height="50" rx="6"/><rect x="730" y="150" width="110" height="50" rx="6"/>
      <rect x="850" y="150" width="110" height="50" rx="6"/>
    </g>
    <rect x="970" y="150" width="110" height="50" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>

    <g font-size="17" fill="#0f172a">
      <text x="185" y="181">412</text><text x="305" y="181">389</text><text x="425" y="181">450</text><text x="545" y="181">401</text>
      <text x="665" y="181">467</text><text x="785" y="181">488</text><text x="905" y="181">530</text>
    </g>
    <text x="1025" y="181" font-size="17" fill="#b91c1c" font-weight="700">???</text>

    <g font-size="12" fill="#64748b">
      <text x="185" y="218">+0</text><text x="305" y="218">+4</text><text x="425" y="218">+8</text><text x="545" y="218">+12</text>
      <text x="665" y="218">+16</text><text x="785" y="218">+20</text><text x="905" y="218">+24</text>
    </g>
    <text x="1025" y="218" font-size="12" fill="#b91c1c">+28</text>
  </g>

  <!-- bracket under [0, 7) -->
  <path d="M130 230 L130 240 L960 240 L960 230" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="130" y="266" font-size="15" font-weight="700" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">for (size_t i = 0; i &lt; 7; i++)</text>
  <text x="130" y="288" font-size="13" fill="#334155">7 reads, last index 6 = n - 1. Length of [start, end) is end - start.</text>
  <text x="1025" y="266" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">i &lt;= 7 reads</text>
  <text x="1025" y="286" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">this too: UB</text>

  <!-- Bottom left: wrong window loop -->
  <rect x="40" y="318" width="550" height="256" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="64" y="348" font-size="16" font-weight="700" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">start + 3 &lt; 7</text>
  <text x="64" y="370" font-size="13" fill="#7f1d1d">starts 0 to 3 only: the busiest window, Fri to Sun, is never checked</text>

  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="94" y="396">Mon</text><text x="160" y="396">Tue</text><text x="226" y="396">Wed</text><text x="292" y="396">Thu</text>
    <text x="358" y="396">Fri</text><text x="424" y="396">Sat</text><text x="490" y="396">Sun</text>
  </g>
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="64" y="402" width="60" height="8" rx="2"/><rect x="130" y="402" width="60" height="8" rx="2"/><rect x="196" y="402" width="60" height="8" rx="2"/>
    <rect x="262" y="402" width="60" height="8" rx="2"/><rect x="328" y="402" width="60" height="8" rx="2"/><rect x="394" y="402" width="60" height="8" rx="2"/>
    <rect x="460" y="402" width="60" height="8" rx="2"/>
  </g>

  <g font-size="12" font-family="'JetBrains Mono', Consolas, monospace">
    <rect x="64" y="420" width="192" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="76" y="436" fill="#334155">start 0: 1251</text>
    <rect x="130" y="448" width="192" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="142" y="464" fill="#334155">start 1: 1240</text>
    <rect x="196" y="476" width="192" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="208" y="492" fill="#334155">start 2: 1318</text>
    <rect x="262" y="504" width="192" height="22" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="274" y="520" fill="#b91c1c" font-weight="700">start 3: 1356 "best"</text>
    <rect x="328" y="532" width="192" height="22" rx="4" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="340" y="548" fill="#b91c1c">start 4: skipped</text>
  </g>

  <!-- Bottom right: right window loop -->
  <rect x="610" y="318" width="550" height="256" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="634" y="348" font-size="16" font-weight="700" fill="#15803d" font-family="'JetBrains Mono', Consolas, monospace">start + k &lt;= n</text>
  <text x="634" y="370" font-size="13" fill="#14532d">starts 0 to n - k: n - k + 1 = 5 windows, each [start, start + 3)</text>

  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="664" y="396">Mon</text><text x="730" y="396">Tue</text><text x="796" y="396">Wed</text><text x="862" y="396">Thu</text>
    <text x="928" y="396">Fri</text><text x="994" y="396">Sat</text><text x="1060" y="396">Sun</text>
  </g>
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="634" y="402" width="60" height="8" rx="2"/><rect x="700" y="402" width="60" height="8" rx="2"/><rect x="766" y="402" width="60" height="8" rx="2"/>
    <rect x="832" y="402" width="60" height="8" rx="2"/><rect x="898" y="402" width="60" height="8" rx="2"/><rect x="964" y="402" width="60" height="8" rx="2"/>
    <rect x="1030" y="402" width="60" height="8" rx="2"/>
  </g>

  <g font-size="12" font-family="'JetBrains Mono', Consolas, monospace">
    <rect x="634" y="420" width="192" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="646" y="436" fill="#334155">start 0: 1251</text>
    <rect x="700" y="448" width="192" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="712" y="464" fill="#334155">start 1: 1240</text>
    <rect x="766" y="476" width="192" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="778" y="492" fill="#334155">start 2: 1318</text>
    <rect x="832" y="504" width="192" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="844" y="520" fill="#334155">start 3: 1356</text>
    <rect x="898" y="532" width="192" height="22" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="910" y="548" fill="#15803d" font-weight="700">start 4: 1485 best</text>
  </g>
</svg>
