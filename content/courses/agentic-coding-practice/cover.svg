<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: agentic coding (spec to tasks, an agent loop with tests and mutation score, a command policy). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C130F"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#D97757"/>
    <text x="158" y="214" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">AG</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#F2B59C">CODING AGENTS · HARNESS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Agentic Coding</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">in Practice</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Spec · Skills · Feedback · Least privilege</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#F8DCCF">
      <rect x="110" y="660" width="168" height="52" rx="26" fill="#2A1A14" stroke="#D97757"/>
      <text x="194.2" y="695" text-anchor="middle">AGENTS.md</text>
      <rect x="294.4" y="660" width="153" height="52" rx="26" fill="#2A1A14" stroke="#D97757"/>
      <text x="370.8" y="695" text-anchor="middle">SKILL.md</text>
      <rect x="463.2" y="660" width="153" height="52" rx="26" fill="#2A1A14" stroke="#D97757"/>
      <text x="539.6" y="695" text-anchor="middle">mutation</text>
    </g>
  </g>

  <g id="art" font-family="Consolas, Menlo, monospace">
    <rect x="900" y="240" width="240" height="56" rx="14" fill="#15131D" stroke="#D97757" stroke-width="2"/>
    <text x="1020" y="276" font-size="21" fill="#F8DCCF" text-anchor="middle">spec.md</text>
    <path d="M1140 268 H1190" stroke="#8C8399" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1194" y="240" width="240" height="56" rx="14" fill="#15131D" stroke="#D97757" stroke-width="2"/>
    <text x="1314" y="276" font-size="21" fill="#F8DCCF" text-anchor="middle">3 small tasks</text>
    <rect x="900" y="340" width="534" height="170" rx="14" fill="#1A1512" stroke="#4A3A33" stroke-width="2"/>
    <text x="925" y="380" font-size="21" fill="#F2B59C" text-anchor="start">agent: edit  run  check</text>
    <text x="925" y="420" font-size="21" fill="#3DBE7B" text-anchor="start">npm test        42 passed</text>
    <text x="925" y="455" font-size="21" fill="#3DBE7B" text-anchor="start">mutation score  91%</text>
    <text x="925" y="490" font-size="21" fill="#F2555A" text-anchor="start">rm -rf / , psql $PROD_URL</text>
    <text x="1410" y="490" font-size="21" fill="#F2555A" text-anchor="end">blocked</text>
    <text x="900" y="560" font-size="19" fill="#B8B2C8" text-anchor="start">allowed paths: src/courses/**  tests/**</text>
    <text x="900" y="600" font-size="19" fill="#B8B2C8" text-anchor="start">budget: 20 min · 1 human merges</text>
  </g>
</svg>
