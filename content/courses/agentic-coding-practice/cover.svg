<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: agentic coding in practice (an agent run inside a harness: spec, skill, hooks, policy, scope and mutation gates). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D160C"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#F59E0B"/>
    <text x="158" y="211" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="800" fill="#1A1206">[ ]</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#FCD34D">AGENTS · SPEC · HARNESS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Agentic Coding</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">in Practice</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Spec · Skills · Hooks · Least privilege</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#FEF3C7">
      <rect x="110" y="660" width="176" height="52" rx="26" fill="#2A1E0B" stroke="#F59E0B"/>
      <text x="198" y="695" text-anchor="middle">SKILL.md</text>
      <rect x="302" y="660" width="118" height="52" rx="26" fill="#2A1E0B" stroke="#F59E0B"/>
      <text x="361" y="695" text-anchor="middle">hooks</text>
      <rect x="436" y="660" width="176" height="52" rx="26" fill="#2A1E0B" stroke="#F59E0B"/>
      <text x="524" y="695" text-anchor="middle">mutation</text>
    </g>
  </g>

  <!-- Agent session panel -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="900" y="170" width="600" height="560" rx="18" fill="#17130D" stroke="#3A2F1C" stroke-width="2"/>
    <rect x="900" y="170" width="600" height="56" rx="18" fill="#201A10"/>
    <rect x="900" y="208" width="600" height="18" fill="#201A10"/>
    <text x="930" y="206" font-size="22" fill="#F4F2F8">agent: task 3 of 5 (course reviews)</text>

    <g font-size="20">
      <text x="930" y="272" fill="#FCD34D">feedforward</text>
      <text x="930" y="306" fill="#E8E2D4">spec.md  AGENTS.md  skill: add-endpoint</text>

      <text x="930" y="360" fill="#FCD34D">feedback</text>
      <rect x="924" y="374" width="552" height="34" rx="6" fill="#10241A"/>
      <text x="940" y="398" fill="#9FE3BF">lint            pass</text>
      <rect x="924" y="414" width="552" height="34" rx="6" fill="#10241A"/>
      <text x="940" y="438" fill="#9FE3BF">related tests   12 / 12 pass</text>
      <rect x="924" y="454" width="552" height="34" rx="6" fill="#2A2410"/>
      <text x="940" y="478" fill="#F2C14E">mutation score  0.64 &lt; 0.80</text>
    </g>

    <rect x="924" y="512" width="552" height="88" rx="10" fill="#2A1418" stroke="#F2555A"/>
    <text x="948" y="548" font-size="20" fill="#F2A3A6">deny: npm run migrate -- --env prod</text>
    <text x="948" y="582" font-size="20" fill="#F2A3A6">out of scope: billing/config.ts</text>
    <rect x="924" y="618" width="552" height="86" rx="10" fill="#1E1533" stroke="#B9A4F5"/>
    <text x="948" y="654" font-size="20" fill="#E4DCFB">reviewer: explain-back before merge</text>
    <text x="948" y="686" font-size="20" fill="#E4DCFB">owner: you, not the agent</text>
  </g>
</svg>
