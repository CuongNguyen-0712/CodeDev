<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Shared fixture vs test data builder</text>
  <text x="40" y="82" font-size="16" fill="#475569">Object spread copies only the top level, so every test reaches the same lines array. A builder hands out deep copies.</text>

  <!-- Left panel: shared fixture -->
  <rect x="40" y="104" width="540" height="428" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="134" font-size="18" font-weight="700" fill="#b91c1c">Shared fixture: { ...baseOrder }</text>

  <rect x="160" y="154" width="300" height="136" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="180" y="180" font-size="15" font-weight="700" fill="#0f172a">baseOrder (one object per file)</text>
  <text x="180" y="206" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#334155">lines: [</text>
  <text x="196" y="228" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#334155">MUG-01 x2</text>
  <rect x="190" y="236" width="252" height="26" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="200" y="254" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#b91c1c">GIFT-WRAP x1  (leaked)</text>
  <text x="180" y="280" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#334155">]</text>

  <rect x="60" y="370" width="236" height="124" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="76" y="396" font-size="15" font-weight="700" fill="#0f172a">test A: gift wrap</text>
  <text x="76" y="420" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">{ ...baseOrder }</text>
  <text x="76" y="442" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">addLine(GIFT-WRAP)</text>
  <text x="76" y="476" font-size="14" font-weight="700" fill="#15803d">3299 - passes</text>

  <rect x="324" y="370" width="236" height="124" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="340" y="396" font-size="15" font-weight="700" fill="#0f172a">test B: total</text>
  <text x="340" y="420" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">{ ...baseOrder }</text>
  <text x="340" y="442" font-size="13" fill="#475569">reads 2 lines, not 1</text>
  <text x="340" y="476" font-size="14" font-weight="700" fill="#b91c1c">3299 !== 2999 - fails</text>

  <line x1="178" y1="368" x2="236" y2="266" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="166" y="318" font-size="13" font-weight="700" fill="#b91c1c">push</text>
  <line x1="442" y1="368" x2="384" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="430" y="326" font-size="13" fill="#475569">same array</text>

  <text x="60" y="514" font-size="14" fill="#475569">Test B passes alone and fails when the whole file runs.</text>

  <!-- Right panel: builder -->
  <rect x="620" y="104" width="540" height="428" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="134" font-size="18" font-weight="700" fill="#15803d">Test data builder: anOrder(overrides)</text>

  <rect x="760" y="154" width="260" height="100" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="780" y="182" font-size="15" font-weight="700" fill="#0f172a">anOrder(overrides)</text>
  <text x="780" y="206" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">structuredClone(DEFAULTS)</text>
  <text x="780" y="230" font-size="13" fill="#475569">merge overrides, next id</text>

  <line x1="840" y1="256" x2="770" y2="318" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="940" y1="256" x2="1010" y2="318" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="650" y="290" font-size="13" font-weight="700" fill="#15803d">fresh copy</text>
  <text x="1040" y="290" font-size="13" font-weight="700" fill="#15803d">fresh copy</text>

  <rect x="640" y="322" width="244" height="172" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="656" y="348" font-size="15" font-weight="700" fill="#0f172a">ORD-1 (test A)</text>
  <text x="656" y="374" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">lines: MUG-01 x2,</text>
  <text x="712" y="394" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">GIFT-WRAP x1</text>
  <text x="656" y="418" font-size="13" fill="#475569">customer: the default</text>
  <text x="656" y="440" font-size="13" fill="#475569">only its own lines change</text>
  <text x="656" y="476" font-size="14" font-weight="700" fill="#15803d">3299 - passes</text>

  <rect x="900" y="322" width="244" height="172" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="916" y="348" font-size="15" font-weight="700" fill="#0f172a">ORD-2 (test B)</text>
  <rect x="912" y="358" width="220" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="922" y="376" font-size="12" font-weight="700" fill="#2563eb">override</text>
  <text x="922" y="394" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#2563eb">customer.country "VN"</text>
  <text x="916" y="422" font-size="13" fill="#475569">name and email kept (merged)</text>
  <text x="916" y="444" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">lines: MUG-01 x2</text>
  <text x="916" y="476" font-size="14" font-weight="700" fill="#15803d">2999 - passes</text>

  <text x="640" y="514" font-size="14" fill="#475569">Each test owns its data: any order, alone or together.</text>

  <text x="40" y="568" font-size="15" fill="#334155"><tspan font-weight="700" fill="#b91c1c">{ ...shared }</tspan> copies one level deep. <tspan font-weight="700" fill="#15803d">anOrder()</tspan> clones the defaults, merges nested overrides and replaces arrays - on every call.</text>
</svg>
