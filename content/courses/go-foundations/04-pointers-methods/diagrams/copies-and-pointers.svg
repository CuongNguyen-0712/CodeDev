<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A copy or the original? Range values, indexes and receivers</text>
  <text x="40" y="82" font-size="16" fill="#475569">Every assignment, call and range variable in Go copies the value. A pointer copies only an address.</text>

  <!-- Left: range value copy -->
  <rect x="40" y="108" width="540" height="300" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="140" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">for _, p := range parcels {</text>
  <text x="94" y="164" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">p.Status = "delivered"</text>
  <text x="64" y="188" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">}</text>

  <text x="64" y="222" font-size="13" fill="#7f1d1d">parcels (the backing array)</text>
  <rect x="64" y="232" width="150" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="76" y="254" font-size="13" font-weight="700" fill="#334155">SP-2001</text>
  <text x="76" y="273" font-size="12" fill="#475569">out_for_delivery</text>
  <rect x="222" y="232" width="150" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="234" y="254" font-size="13" font-weight="700" fill="#334155">SP-2002</text>
  <text x="234" y="273" font-size="12" fill="#475569">out_for_delivery</text>
  <rect x="380" y="232" width="150" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="392" y="254" font-size="13" font-weight="700" fill="#334155">SP-2003</text>
  <text x="392" y="273" font-size="12" fill="#475569">out_for_delivery</text>

  <line x1="139" y1="284" x2="139" y2="322" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="308" font-size="13" fill="#7f1d1d">copied into p</text>
  <rect x="64" y="326" width="150" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="76" y="348" font-size="13" font-weight="700" fill="#b91c1c">p: SP-2001</text>
  <text x="76" y="367" font-size="12" fill="#b91c1c">delivered</text>
  <text x="230" y="348" font-size="14" font-weight="700" fill="#b91c1c">Only the copy changes.</text>
  <text x="230" y="370" font-size="13" fill="#7f1d1d">p is dropped after the iteration;</text>
  <text x="230" y="390" font-size="13" fill="#7f1d1d">the array still says out_for_delivery.</text>

  <!-- Right: index -->
  <rect x="620" y="108" width="540" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="140" font-size="16" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">for i := range parcels {</text>
  <text x="674" y="164" font-size="16" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">parcels[i].Status = "delivered"</text>
  <text x="644" y="188" font-size="16" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">}</text>

  <text x="644" y="222" font-size="13" fill="#14532d">parcels (the backing array)</text>
  <rect x="644" y="232" width="150" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="656" y="254" font-size="13" font-weight="700" fill="#15803d">SP-2001</text>
  <text x="656" y="273" font-size="12" fill="#15803d">delivered</text>
  <rect x="802" y="232" width="150" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="814" y="254" font-size="13" font-weight="700" fill="#334155">SP-2002</text>
  <text x="814" y="273" font-size="12" fill="#475569">out_for_delivery</text>
  <rect x="960" y="232" width="150" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="972" y="254" font-size="13" font-weight="700" fill="#15803d">SP-2003</text>
  <text x="972" y="273" font-size="12" fill="#15803d">delivered</text>

  <line x1="719" y1="326" x2="719" y2="290" stroke="#16a34a" stroke-width="2"/>
  <polygon points="712,294 719,282 726,294" fill="#16a34a"/>
  <text x="644" y="348" font-size="14" font-weight="700" fill="#15803d">parcels[i] is the element itself.</text>
  <text x="644" y="370" font-size="13" fill="#14532d">p := &amp;parcels[i] works too: a pointer into</text>
  <text x="644" y="390" font-size="13" fill="#14532d">the array, not a copy of the element.</text>

  <!-- Bottom: receivers -->
  <rect x="40" y="432" width="1120" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="464" font-size="16" font-weight="700" fill="#334155">Methods follow the same rule: the receiver is just the first parameter</text>
  <text x="64" y="500" font-size="15" font-weight="700" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">func (r Route) AddStop(id string)</text>
  <text x="520" y="500" font-size="14" fill="#334155">r is a copy of the route: appended stops are lost</text>
  <text x="64" y="534" font-size="15" font-weight="700" fill="#15803d" font-family="Consolas, 'Courier New', monospace">func (r *Route) AddStop(id string)</text>
  <text x="520" y="534" font-size="14" fill="#334155">r is the route's address: changes are kept</text>
  <text x="64" y="568" font-size="15" font-weight="700" fill="#b45309" font-family="Consolas, 'Courier New', monospace">route.AddStop("SP-2004")</text>
  <text x="520" y="568" font-size="14" fill="#334155">Go passes &amp;route for you when route is addressable</text>
  <text x="520" y="590" font-size="13" fill="#64748b">(a variable, a slice element, a field of one - not a map value)</text>
</svg>
