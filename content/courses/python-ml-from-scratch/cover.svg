    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#FFD43B">PYTHON · MACHINE LEARNING</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">ML Foundations</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">from Scratch</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Features · kNN · Regression · Evaluation</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CFE0F4">
