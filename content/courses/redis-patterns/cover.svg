<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Redis patterns (cache-aside with TTL, a sorted-set leaderboard, PostgreSQL as the source of truth). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C0F0F"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DC382C" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#DC382C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#DC382C"/>
    <text x="158" y="214" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">R</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#F59A92">REDIS · POSTGRESQL</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Redis</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Patterns</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Cache · Sessions · Rate limits · Leaderboards</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#FAD4D1">
      <rect x="110" y="660" width="75" height="52" rx="26" fill="#2A1312" stroke="#DC382C"/>
      <text x="147.4" y="695" text-anchor="middle">TTL</text>
      <rect x="200.8" y="660" width="90" height="52" rx="26" fill="#2A1312" stroke="#DC382C"/>
      <text x="246.0" y="695" text-anchor="middle">ZADD</text>
      <rect x="307.20000000000005" y="660" width="200" height="52" rx="26" fill="#2A1312" stroke="#DC382C"/>
      <text x="407.0" y="695" text-anchor="middle">cache-aside</text>
    </g>
  </g>

  <g id="art" font-family="Consolas, Menlo, monospace">
    <rect x="900" y="240" width="220" height="60" rx="14" fill="#15131D" stroke="#DC382C" stroke-width="2"/>
    <text x="1010" y="278" font-size="22" fill="#FAD4D1" text-anchor="middle">API</text>
    <path d="M1120 270 H1190" stroke="#8C8399" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1194" y="240" width="240" height="60" rx="14" fill="#2A1312" stroke="#DC382C" stroke-width="2"/>
    <text x="1314" y="278" font-size="22" fill="#F59A92" text-anchor="middle">Redis (cache)</text>
    <path d="M1010 300 V360" stroke="#8C8399" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="900" y="364" width="220" height="60" rx="14" fill="#15131D" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1010" y="402" font-size="22" fill="#9BE7BD" text-anchor="middle">PostgreSQL</text>
    <text x="900" y="456" font-size="18" fill="#3DBE7B" text-anchor="start">source of truth</text>
    <rect x="1194" y="330" width="240" height="220" rx="14" fill="#1A1316" stroke="#4A3346" stroke-width="2"/>
    <text x="1214" y="368" font-size="19" fill="#F59A92" text-anchor="start">ZREVRANGE top 3</text>
    <text x="1214" y="408" font-size="19" fill="#F4F2F8" text-anchor="start">1  linh     1420</text>
    <text x="1214" y="444" font-size="19" fill="#F4F2F8" text-anchor="start">2  minh     1388</text>
    <text x="1214" y="480" font-size="19" fill="#F4F2F8" text-anchor="start">3  an       1301</text>
    <text x="1214" y="528" font-size="19" fill="#3DBE7B" text-anchor="start">v=42 > v=41 ✓</text>
    <text x="900" y="520" font-size="19" fill="#B8B2C8" text-anchor="start">GET course:42</text>
    <text x="900" y="556" font-size="19" fill="#B8B2C8" text-anchor="start">TTL 300 s · invalidate</text>
  </g>
</svg>
