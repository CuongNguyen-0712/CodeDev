<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: background jobs (a queue with retries and backoff, a dead-letter queue for the poison message). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C130C"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8803A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#E8803A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#E8803A"/>
    <text x="158" y="214" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">Q</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#F5C19B">QUEUES · WORKERS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Background</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Jobs</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Retries · Idempotent workers · Dead letters</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#FBE1CD">
      <rect x="110" y="660" width="137" height="52" rx="26" fill="#2A1A10" stroke="#E8803A"/>
      <text x="178.6" y="695" text-anchor="middle">backoff</text>
      <rect x="263.2" y="660" width="75" height="52" rx="26" fill="#2A1A10" stroke="#E8803A"/>
      <text x="300.6" y="695" text-anchor="middle">DLQ</text>
      <rect x="354" y="660" width="184" height="52" rx="26" fill="#2A1A10" stroke="#E8803A"/>
      <text x="446.0" y="695" text-anchor="middle">idempotent</text>
    </g>
  </g>

  <g id="art" font-family="Consolas, Menlo, monospace">
    <text x="880" y="250" font-size="20" fill="#F5C19B" text-anchor="start">queue  grade-submissions</text>
    <rect x="880" y="270" width="80" height="56" rx="14" fill="#2A1418" stroke="#F2555A" stroke-width="2"/>
    <rect x="972" y="270" width="80" height="56" rx="14" fill="#2A1A10" stroke="#E8803A" stroke-width="2"/>
    <rect x="1064" y="270" width="80" height="56" rx="14" fill="#2A1A10" stroke="#E8803A" stroke-width="2"/>
    <rect x="1156" y="270" width="80" height="56" rx="14" fill="#2A1A10" stroke="#E8803A" stroke-width="2"/>
    <rect x="1248" y="270" width="80" height="56" rx="14" fill="#2A1A10" stroke="#E8803A" stroke-width="2"/>
    <rect x="1340" y="270" width="80" height="56" rx="14" fill="#2A1A10" stroke="#E8803A" stroke-width="2"/>
    <text x="920" y="306" font-size="18" fill="#F2555A" text-anchor="middle">bad</text>
    <path d="M920 330 V420" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="860" y="424" width="200" height="56" rx="14" fill="#2A1418" stroke="#F2555A" stroke-width="2"/>
    <text x="960" y="460" font-size="19" fill="#F2B8BA" text-anchor="middle">dead-letter</text>
    <text x="1090" y="380" font-size="18" fill="#B8B2C8" text-anchor="start">retry 1s · 2s · 4s · 8s (+jitter)</text>
    <text x="1090" y="420" font-size="18" fill="#B8B2C8" text-anchor="start">max attempts 5</text>
    <path d="M1300 330 V500" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="1190" y="504" width="250" height="56" rx="14" fill="#13201A" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1315" y="540" font-size="19" fill="#9BE7BD" text-anchor="middle">worker (idempotent)</text>
    <text x="880" y="610" font-size="19" fill="#3DBE7B" text-anchor="start">lag p95 4 s · oldest 12 s</text>
  </g>
</svg>
