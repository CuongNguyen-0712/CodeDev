<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: AI-assisted development (an AI diff under review with injection, a swallowed error and an invented package). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A1C"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14A39A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#14A39A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#14A39A"/>
    <text x="158" y="216" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF">AI</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#7FE0D6">CLAUDE CODE · COPILOT · CURSOR</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">AI-Assisted</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Development</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Spec first · Tests as contract · Review every diff</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#C9F3EE">
      <rect x="110" y="660" width="137" height="52" rx="26" fill="#0F2426" stroke="#14A39A"/>
      <text x="178.6" y="695" text-anchor="middle">spec.md</text>
      <rect x="263.2" y="660" width="106" height="52" rx="26" fill="#0F2426" stroke="#14A39A"/>
      <text x="316.2" y="695" text-anchor="middle">tests</text>
      <rect x="385.2" y="660" width="122" height="52" rx="26" fill="#0F2426" stroke="#14A39A"/>
      <text x="446.0" y="695" text-anchor="middle">review</text>
    </g>
  </g>

  <!-- An AI diff under review: one line flagged, tests as the contract -->
  <g id="art" font-family="Consolas, Menlo, monospace" font-size="20">
    <rect x="880" y="230" width="560" height="380" rx="18" fill="#101A1C" stroke="#1F5E63" stroke-width="2"/>
    <text x="905" y="270" fill="#8FD9D2">search.repository.ts  +12 -3</text>
    <rect x="896" y="292" width="528" height="34" rx="6" fill="#3DBE7B" fill-opacity="0.12"/>
    <text x="905" y="316" fill="#8FE3B4">+ const rows = await db.query(</text>
    <rect x="896" y="332" width="528" height="34" rx="6" fill="#F2555A" fill-opacity="0.16"/>
    <text x="905" y="356" fill="#F2B8BA">+   `... LIKE '%${q}%'`)</text>
    <text x="1410" y="356" fill="#F2555A" text-anchor="end">injection</text>
    <rect x="896" y="372" width="528" height="34" rx="6" fill="#3DBE7B" fill-opacity="0.12"/>
    <text x="905" y="396" fill="#8FE3B4">+ catch (e) { }</text>
    <text x="1410" y="396" fill="#F2C14E" text-anchor="end">swallowed</text>
    <rect x="896" y="412" width="528" height="34" rx="6" fill="#3DBE7B" fill-opacity="0.12"/>
    <text x="905" y="436" fill="#8FE3B4">+ import "lodash-utils-pro"</text>
    <text x="1410" y="436" fill="#F2C14E" text-anchor="end">not on npm</text>
    <line x1="905" y1="470" x2="1415" y2="470" stroke="#1F5E63" stroke-width="2"/>
    <text x="905" y="510" fill="#3DBE7B">tests  14 passed · 2 hidden failing</text>
    <text x="905" y="550" fill="#B8B2C8">review: request changes</text>
    <text x="905" y="590" fill="#8FD9D2">AGENTS.md · spec.md · acceptance.test.ts</text>
  </g>
</svg>
