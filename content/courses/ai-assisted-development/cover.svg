<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: AI-assisted development (an AI-generated pull request under review: green CI, two blocking comments). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1020"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#EC4899"/>
    <text x="158" y="211" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="800" fill="#FFFFFF">&gt;_</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#F9A8D4">AI · CODING AGENTS · REVIEW</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">AI-Assisted</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Development</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Spec · Tests · Diff review · Vibe-coding limits</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#FCE7F3">
      <rect x="110" y="660" width="112" height="52" rx="26" fill="#2A1424" stroke="#EC4899"/>
      <text x="166" y="695" text-anchor="middle">spec</text>
      <rect x="238" y="660" width="112" height="52" rx="26" fill="#2A1424" stroke="#EC4899"/>
      <text x="294" y="695" text-anchor="middle">diff</text>
      <rect x="366" y="660" width="194" height="52" rx="26" fill="#2A1424" stroke="#EC4899"/>
      <text x="463" y="695" text-anchor="middle">AGENTS.md</text>
    </g>
  </g>

  <!-- Pull request panel -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="900" y="170" width="600" height="560" rx="18" fill="#17111C" stroke="#33243A" stroke-width="2"/>
    <rect x="900" y="170" width="600" height="56" rx="18" fill="#1F1626"/>
    <rect x="900" y="208" width="600" height="18" fill="#1F1626"/>
    <text x="930" y="206" font-size="22" fill="#F4F2F8">PR #128 add course search</text>
    <rect x="1372" y="184" width="104" height="30" rx="15" fill="#10241A" stroke="#3DBE7B"/>
    <text x="1424" y="205" font-size="18" text-anchor="middle" fill="#9FE3BF">CI pass</text>

    <g font-size="20">
      <text x="930" y="270" fill="#6F6A80">search.ts</text>
      <rect x="924" y="282" width="552" height="34" fill="#2A1418"/>
      <text x="936" y="306" fill="#F2A3A6">- db.query(sql, [term])</text>
      <rect x="924" y="318" width="552" height="34" fill="#10241A"/>
      <text x="936" y="342" fill="#9FE3BF">+ db.query("... LIKE '%" + term + "%'")</text>
      <rect x="924" y="354" width="552" height="34" fill="#10241A"/>
      <text x="936" y="378" fill="#9FE3BF">+ } catch (e) {}</text>
      <text x="930" y="426" fill="#6F6A80">package.json</text>
      <rect x="924" y="438" width="552" height="34" fill="#10241A"/>
      <text x="936" y="462" fill="#9FE3BF">+ "fast-sql-sanitize": "^1.0.2"</text>
    </g>

    <rect x="924" y="500" width="552" height="96" rx="10" fill="#2A1418" stroke="#F2555A"/>
    <text x="948" y="538" font-size="20" fill="#F2A3A6">Blocker: SQL built from user input</text>
    <text x="948" y="572" font-size="20" fill="#F2A3A6">Blocker: package not on registry</text>
    <rect x="924" y="614" width="552" height="90" rx="10" fill="#1E1533" stroke="#B9A4F5"/>
    <text x="948" y="650" font-size="20" fill="#E4DCFB">Tests: assert behaviour, not mocks</text>
    <text x="948" y="684" font-size="20" fill="#E4DCFB">Decision: request changes</text>
  </g>
</svg>
