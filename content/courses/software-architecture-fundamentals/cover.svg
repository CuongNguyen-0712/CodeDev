<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: software architecture fundamentals (modules with one-way dependencies, ports for payment and email). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1626"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4F8EF7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4F8EF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C8399"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#4F8EF7"/>
    <text x="158" y="214" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">SA</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#A9C8FF">ARCHITECTURE · TYPESCRIPT</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Software</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Architecture</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Modules · Dependencies · When to split</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#D6E4FF">
      <rect x="110" y="660" width="106" height="52" rx="26" fill="#141E33" stroke="#4F8EF7"/>
      <text x="163.0" y="695" text-anchor="middle">ports</text>
      <rect x="232" y="660" width="122" height="52" rx="26" fill="#141E33" stroke="#4F8EF7"/>
      <text x="292.8" y="695" text-anchor="middle">fan-in</text>
      <rect x="369.6" y="660" width="75" height="52" rx="26" fill="#141E33" stroke="#4F8EF7"/>
      <text x="407.0" y="695" text-anchor="middle">ADR</text>
    </g>
  </g>

  <g id="art" font-family="Consolas, Menlo, monospace">
    <rect x="1060" y="230" width="220" height="56" rx="14" fill="#15131D" stroke="#4F8EF7" stroke-width="2"/>
    <text x="1170" y="266" font-size="21" fill="#D6E4FF" text-anchor="middle">orders</text>
    <path d="M1100 286 L1000 350" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1240 286 L1340 350" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="890" y="354" width="220" height="56" rx="14" fill="#15131D" stroke="#4F8EF7" stroke-width="2"/>
    <text x="1000" y="390" font-size="21" fill="#D6E4FF" text-anchor="middle">PaymentPort</text>
    <rect x="1230" y="354" width="220" height="56" rx="14" fill="#15131D" stroke="#4F8EF7" stroke-width="2"/>
    <text x="1340" y="390" font-size="21" fill="#D6E4FF" text-anchor="middle">EmailPort</text>
    <path d="M1000 474 L1000 414" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1340 474 L1340 414" stroke="#8C8399" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="890" y="478" width="220" height="56" rx="14" fill="#15131D" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1000" y="514" font-size="19" fill="#9BE7BD" text-anchor="middle">stripe adapter</text>
    <rect x="1230" y="478" width="220" height="56" rx="14" fill="#15131D" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1340" y="514" font-size="19" fill="#9BE7BD" text-anchor="middle">smtp adapter</text>
    <text x="890" y="590" font-size="19" fill="#B8B2C8" text-anchor="start">fan-in 9 · fan-out 2 · I = 0.18</text>
    <text x="890" y="628" font-size="19" fill="#B8B2C8" text-anchor="start">monolith first · split on evidence</text>
  </g>
</svg>
