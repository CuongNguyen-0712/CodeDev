<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: software architecture fundamentals (layers with dependencies pointing inward, one forbidden arrow). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B9A4F5"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#7C3AED"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="5">
      <rect x="132" y="172" width="52" height="52" rx="6"/>
      <rect x="144" y="184" width="28" height="28" rx="4"/>
    </g>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#B9A4F5">ARCHITECTURE · FOUNDATIONS</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Software</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Architecture</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Modules · Layers · Ports · Decisions</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#E4DCFB">
      <rect x="110" y="660" width="132" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="176" y="695" text-anchor="middle">domain</text>
      <rect x="258" y="660" width="120" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="318" y="695" text-anchor="middle">ports</text>
      <rect x="394" y="660" width="132" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="460" y="695" text-anchor="middle">fan-in</text>
      <rect x="542" y="660" width="96" height="52" rx="26" fill="#1E1533" stroke="#7C3AED"/>
      <text x="590" y="695" text-anchor="middle">ADR</text>
    </g>
  </g>

  <!-- Layer map -->
  <g font-family="Consolas, Menlo, monospace" font-size="24">
    <rect x="900" y="170" width="600" height="560" rx="18" fill="#15111F" stroke="#2C2440" stroke-width="2"/>

    <rect x="940" y="210" width="330" height="96" rx="12" fill="#1C1629" stroke="#3A3152" stroke-width="2"/>
    <text x="1105" y="267" text-anchor="middle" fill="#E4DCFB">http</text>
    <rect x="940" y="370" width="330" height="96" rx="12" fill="#1C1629" stroke="#7C3AED" stroke-width="2"/>
    <text x="1105" y="427" text-anchor="middle" fill="#E4DCFB">application</text>
    <rect x="940" y="530" width="330" height="96" rx="12" fill="#1E1533" stroke="#B9A4F5" stroke-width="3"/>
    <text x="1105" y="587" text-anchor="middle" fill="#F4F2F8">domain</text>

    <rect x="1310" y="370" width="160" height="96" rx="12" fill="#1C1629" stroke="#3A3152" stroke-width="2"/>
    <text x="1390" y="413" text-anchor="middle" font-size="20" fill="#B8B2C8">infra-</text>
    <text x="1390" y="441" text-anchor="middle" font-size="20" fill="#B8B2C8">structure</text>

    <path d="M1105 310 L1105 362" stroke="#B9A4F5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1105 470 L1105 522" stroke="#B9A4F5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1306 418 L1278 418" stroke="#B9A4F5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <path d="M1272 590 C1390 590 1390 540 1390 474" stroke="#F2555A" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#arrowRed)"/>
    <g stroke="#F2555A" stroke-width="4">
      <line x1="1372" y1="548" x2="1404" y2="580"/>
      <line x1="1404" y1="548" x2="1372" y2="580"/>
    </g>
    <text x="940" y="680" font-size="20" fill="#9FE3BF">dependencies point inward</text>
    <text x="940" y="710" font-size="20" fill="#F2A3A6">domain must not import a database</text>
  </g>
</svg>
