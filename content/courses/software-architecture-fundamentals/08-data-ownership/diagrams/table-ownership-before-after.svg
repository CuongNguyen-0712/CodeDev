<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One table, one writer. Others call the owner or read its view.</text>
  <text x="40" y="82" font-size="16" fill="#475569">The enrollments table at CodeDev, before and after the refund incident. Same database in both pictures.</text>

  <!-- Left: shared table -->
  <rect x="40" y="112" width="545" height="368" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="146" font-size="18" font-weight="700" fill="#b91c1c">Before: a shared table</text>
  <text x="64" y="170" font-size="13" fill="#64748b">4 modules use the raw columns, 2 of them write</text>

  <rect x="64" y="186" width="190" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="212" font-size="15" fill="#334155">enrollment</text>
  <rect x="64" y="242" width="190" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="268" font-size="15" fill="#334155">progress</text>
  <rect x="64" y="298" width="190" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="324" font-size="15" fill="#334155">notifications</text>
  <rect x="64" y="354" width="190" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="380" font-size="15" fill="#334155">catalog</text>

  <rect x="392" y="236" width="169" height="108" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="408" y="266" font-size="15" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">enrollments</text>
  <line x1="392" y1="278" x2="561" y2="278" stroke="#fca5a5" stroke-width="1"/>
  <text x="408" y="302" font-size="14" fill="#475569" font-family="Consolas, 'Courier New', monospace">id, user_id</text>
  <text x="408" y="326" font-size="14" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">status</text>

  <line x1="254" y1="206" x2="388" y2="258" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="254" y1="262" x2="388" y2="276" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="254" y1="318" x2="388" y2="306" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGray)"/>
  <line x1="254" y1="374" x2="388" y2="326" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGray)"/>

  <text x="64" y="424" font-size="13" fill="#64748b">solid red = writes, dashed gray = reads the raw columns</text>
  <text x="64" y="448" font-size="14" font-weight="700" fill="#b91c1c">Rename status: 3 modules broke at deploy</text>
  <text x="64" y="468" font-size="14" font-weight="700" fill="#b91c1c">The progress job overwrote a refund</text>

  <!-- Right: one owner -->
  <rect x="615" y="112" width="545" height="368" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="146" font-size="18" font-weight="700" fill="#15803d">After: one owner</text>
  <text x="639" y="170" font-size="13" fill="#64748b">only enrollment writes; the others use its interface</text>

  <rect x="639" y="186" width="200" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="212" font-size="15" font-weight="700" fill="#15803d">enrollment (owner)</text>
  <rect x="940" y="186" width="196" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="956" y="212" font-size="15" font-weight="700" fill="#334155" font-family="Consolas, 'Courier New', monospace">enrollments</text>
  <line x1="839" y1="206" x2="936" y2="206" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="862" y="198" font-size="13" fill="#15803d">writes</text>

  <rect x="639" y="268" width="200" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="294" font-size="15" fill="#334155">progress</text>
  <line x1="739" y1="268" x2="739" y2="230" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrViolet)"/>
  <text x="750" y="254" font-size="13" fill="#7C3AED" font-family="Consolas, 'Courier New', monospace">markCompleted()</text>

  <rect x="940" y="296" width="196" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="956" y="322" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">enrollment_summary</text>
  <line x1="1038" y1="226" x2="1038" y2="292" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="1048" y="264" font-size="13" fill="#15803d">view</text>

  <rect x="639" y="340" width="200" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="366" font-size="15" fill="#334155">notifications</text>
  <rect x="639" y="392" width="200" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="418" font-size="15" fill="#334155">catalog</text>
  <line x1="839" y1="360" x2="936" y2="322" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGray)"/>
  <line x1="839" y1="412" x2="936" y2="330" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGray)"/>
  <text x="870" y="420" font-size="13" fill="#64748b">read the view only</text>

  <text x="639" y="462" font-size="14" font-weight="700" fill="#15803d">The rule lives in one place; a rename touches one module</text>

  <!-- Rule -->
  <rect x="40" y="504" width="1120" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="64" y="533" font-size="18" font-weight="700" fill="#334155">Rule: each table has one owner. Only the owner writes it.</text>
  <text x="64" y="558" font-size="14" fill="#475569">Others call the owner's functions or read a view the owner publishes. One database and one shared transaction are still fine.</text>
</svg>
