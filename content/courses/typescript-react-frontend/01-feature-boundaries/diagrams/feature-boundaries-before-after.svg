<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One 600-line page vs. features, components and pure logic</text>
  <text x="40" y="82" font-size="16" fill="#475569">The same catalog screen: before, a sort bug needs the browser to reproduce; after, a unit test calls the logic.</text>

  <!-- Before -->
  <rect x="40" y="112" width="430" height="440" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="146" font-size="18" font-weight="700" fill="#b91c1c">Before: CatalogPage.tsx</text>
  <text x="64" y="170" font-size="13" fill="#64748b">600 lines, every concern in one function</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#334155">
    <rect x="64" y="186" width="382" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="80" y="212">fetch("/api/courses")</text>
    <rect x="64" y="234" width="382" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="80" y="260">filter by search and level</text>
    <rect x="64" y="282" width="382" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="308" fill="#b91c1c">visible.sort(...)   line 300</text>
    <rect x="64" y="330" width="382" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="80" y="356">slice((page - 1) * 12, ...)</text>
    <rect x="64" y="378" width="382" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="80" y="404">enroll buttons, toasts, modals</text>
    <rect x="64" y="426" width="382" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="80" y="452">250 lines of JSX</text>
  </g>
  <text x="64" y="496" font-size="15" font-weight="700" fill="#b91c1c">To reproduce the sort bug you need:</text>
  <text x="64" y="518" font-size="13" fill="#64748b">the dev server, the real API, a logged-in account</text>
  <text x="64" y="536" font-size="13" fill="#64748b">and the API returning tied rows in a different order</text>

  <!-- After -->
  <rect x="500" y="112" width="660" height="440" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="524" y="146" font-size="18" font-weight="700" fill="#15803d">After: features/catalog/</text>
  <text x="524" y="170" font-size="13" fill="#64748b">each kind of code in its own place</text>

  <rect x="700" y="182" width="260" height="62" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="716" y="207" font-size="15" font-weight="700" fill="#15803d">CatalogPage.tsx</text>
  <text x="716" y="229" font-size="13" fill="#475569">container: query, data, wiring</text>

  <rect x="524" y="300" width="150" height="62" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="540" y="325" font-size="15" font-weight="700" fill="#334155">shared/api</text>
  <text x="540" y="347" font-size="13" fill="#475569">typed client</text>

  <rect x="694" y="300" width="230" height="62" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="325" font-size="15" font-weight="700" fill="#15803d">catalog.logic.ts</text>
  <text x="710" y="347" font-size="13" fill="#475569">pure: queryCatalog</text>

  <rect x="944" y="300" width="192" height="62" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="960" y="325" font-size="15" font-weight="700" fill="#334155">CourseCard</text>
  <text x="960" y="347" font-size="13" fill="#475569">FilterBar: props only</text>

  <!-- arrows from container -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="760" y1="244" x2="610" y2="294"/>
    <line x1="830" y1="244" x2="809" y2="294"/>
    <line x1="900" y1="244" x2="1030" y2="294"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="602,296 614,288 616,299"/>
    <polygon points="803,290 815,290 809,300"/>
    <polygon points="1024,289 1036,292 1036,300"/>
  </g>
  <text x="614" y="262" font-size="13" fill="#475569">data</text>
  <text x="826" y="276" font-size="13" fill="#475569">courses + query</text>
  <text x="984" y="262" font-size="13" fill="#475569">props</text>
  <text x="960" y="386" font-size="13" fill="#64748b">events go back up:</text>
  <text x="960" y="404" font-size="13" fill="#64748b">onEnroll, onChange</text>

  <!-- unit test -->
  <rect x="694" y="420" width="230" height="62" rx="6" fill="#f5f3ff" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="710" y="445" font-size="14" font-weight="700" fill="#6d28d9">catalog.logic.test.ts</text>
  <text x="710" y="467" font-size="13" fill="#5b21b6">milliseconds, no browser</text>
  <line x1="809" y1="420" x2="809" y2="370" stroke="#7C3AED" stroke-width="2"/>
  <polygon points="803,374 815,374 809,363" fill="#7C3AED"/>
  <text x="524" y="440" font-size="13" fill="#64748b">no React, no fetch,</text>
  <text x="524" y="458" font-size="13" fill="#64748b">no clock in the logic</text>

  <text x="524" y="524" font-size="13" fill="#475569">Features import each other only through index.ts; shared/ never imports features/.</text>
</svg>
