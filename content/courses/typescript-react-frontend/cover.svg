<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Frontend engineering with TypeScript and React (component tree, one re-render, virtualized list). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3178C6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3178C6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#61DAFB"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3178C6"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#3178C6"/>
    <text x="194" y="232" text-anchor="end" font-size="40" font-weight="800" fill="#FFFFFF">TS</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#61DAFB">TYPESCRIPT · REACT</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Frontend</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Engineering</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Typed state · Effects · Memo · Virtual lists</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#CBE4FA">
      <rect x="110" y="660" width="178" height="52" rx="26" fill="#132238" stroke="#3178C6"/>
      <text x="199" y="695" text-anchor="middle">Props&lt;T&gt;</text>
      <rect x="304" y="660" width="207" height="52" rx="26" fill="#132238" stroke="#3178C6"/>
      <text x="407.5" y="695" text-anchor="middle">useReducer</text>
      <rect x="527" y="660" width="121" height="52" rx="26" fill="#132238" stroke="#3178C6"/>
      <text x="587.5" y="695" text-anchor="middle">memo</text>
    </g>
  </g>

  <!-- Only the changed component re-renders; the long list renders just the rows in view -->
  <g id="art">
    <path d="M1180 300 C1180 350, 1020 350, 1020 392 M1180 300 C1180 350, 1430 340, 1430 382 M1020 448 V512" stroke="#28446A" stroke-width="3" fill="none"/>
    <rect x="1090" y="244" width="180" height="56" rx="14" fill="#131C2B" fill-opacity="1" stroke="#28446A" stroke-width="2"/>
    <text x="1180" y="280" font-family="Consolas, Menlo, monospace" font-size="22" fill="#F4F2F8" text-anchor="middle">&lt;App&gt;</text>
    <rect x="930" y="392" width="180" height="56" rx="14" fill="#61DAFB" fill-opacity="0.18" stroke="#61DAFB" stroke-width="3"/>
    <text x="1020" y="428" font-family="Consolas, Menlo, monospace" font-size="22" fill="#61DAFB" text-anchor="middle">&lt;Cart&gt;</text>
    <rect x="930" y="512" width="180" height="56" rx="14" fill="#61DAFB" fill-opacity="0.18" stroke="#61DAFB" stroke-width="3"/>
    <text x="1020" y="548" font-family="Consolas, Menlo, monospace" font-size="22" fill="#61DAFB" text-anchor="middle">&lt;Total&gt;</text>
    <rect x="1340" y="382" width="180" height="56" rx="14" fill="#131C2B" fill-opacity="1" stroke="#28446A" stroke-width="2"/>
    <text x="1430" y="418" font-family="Consolas, Menlo, monospace" font-size="22" fill="#F4F2F8" text-anchor="middle">&lt;ProductList&gt;</text>
    <text x="1020" y="604" font-family="Consolas, Menlo, monospace" font-size="20" fill="#61DAFB" text-anchor="middle">state changed</text>
    <text x="1430" y="464" font-family="Consolas, Menlo, monospace" font-size="18" fill="#3DBE7B" text-anchor="middle">memo: skipped</text>
    <rect x="1340" y="490" width="180" height="22" rx="6" fill="#28446A" fill-opacity="0.25"/>
    <rect x="1340" y="520" width="180" height="22" rx="6" fill="#28446A" fill-opacity="0.25"/>
    <rect x="1340" y="550" width="180" height="22" rx="6" fill="#28446A" fill-opacity="0.95"/>
    <rect x="1340" y="580" width="180" height="22" rx="6" fill="#28446A" fill-opacity="0.95"/>
    <rect x="1340" y="610" width="180" height="22" rx="6" fill="#28446A" fill-opacity="0.95"/>
    <rect x="1340" y="640" width="180" height="22" rx="6" fill="#28446A" fill-opacity="0.25"/>
    <rect x="1340" y="670" width="180" height="22" rx="6" fill="#28446A" fill-opacity="0.25"/>
    <rect x="1330" y="544" width="200" height="86" rx="10" fill="none" stroke="#61DAFB" stroke-width="3"/>
    <text x="1430" y="700" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" text-anchor="middle">3 of 10,000 rows</text>
    <text x="904" y="680" font-family="Consolas, Menlo, monospace" font-size="20" fill="#61DAFB" >type Props = { items: Item[] }</text>
  </g>
</svg>
