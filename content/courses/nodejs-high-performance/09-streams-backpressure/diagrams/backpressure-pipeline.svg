<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Exporting 1.2M ledger rows: backpressure end to end</text>
  <text x="40" y="82" font-size="16" fill="#475569">The slowest stage sets the pace. A full buffer pushes back up the chain instead of growing in memory.</text>

  <!-- stages -->
  <rect x="40" y="200" width="200" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="238" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">DB cursor</text>
  <text x="140" y="264" font-size="14" text-anchor="middle" fill="#166534">Readable (objectMode)</text>
  <text x="140" y="286" font-size="14" text-anchor="middle" fill="#166534">fetches 1,000 rows/page</text>

  <rect x="300" y="200" width="180" height="110" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="390" y="238" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">toCsv</text>
  <text x="390" y="264" font-size="14" text-anchor="middle" fill="#0e7490">Transform</text>
  <text x="390" y="286" font-size="14" text-anchor="middle" fill="#0e7490">row -> CSV line</text>

  <rect x="540" y="200" width="160" height="110" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="620" y="238" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">gzip</text>
  <text x="620" y="264" font-size="14" text-anchor="middle" fill="#0e7490">Transform</text>
  <text x="620" y="286" font-size="14" text-anchor="middle" fill="#0e7490">compress</text>

  <rect x="760" y="200" width="220" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="870" y="238" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">res</text>
  <text x="870" y="264" font-size="14" text-anchor="middle" fill="#6d28d9">Writable (HTTP response)</text>
  <text x="870" y="286" font-size="14" text-anchor="middle" fill="#6d28d9">highWaterMark 16 KB</text>

  <rect x="1040" y="200" width="130" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1105" y="238" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Client</text>
  <text x="1105" y="264" font-size="14" text-anchor="middle" fill="#991b1b">slow network</text>
  <text x="1105" y="286" font-size="14" text-anchor="middle" fill="#991b1b">300 KB/s</text>

  <!-- forward data flow -->
  <line x1="240" y1="255" x2="298" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="255" x2="538" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="255" x2="758" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="255" x2="1038" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="180" font-size="13" text-anchor="middle" fill="#64748b">rows</text>
  <text x="510" y="180" font-size="13" text-anchor="middle" fill="#64748b">lines</text>
  <text x="730" y="180" font-size="13" text-anchor="middle" fill="#64748b">bytes</text>
  <text x="1010" y="180" font-size="13" text-anchor="middle" fill="#64748b">bytes</text>
  <text x="40" y="140" font-size="15" font-weight="700" fill="#334155">Data flows right</text>

  <!-- buffer gauge -->
  <rect x="780" y="330" width="180" height="24" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="782" y="332" width="176" height="20" rx="5" fill="#ddd6fe"/>
  <text x="870" y="347" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">buffer full: 16 / 16 KB</text>
  <text x="975" y="347" font-size="13" fill="#b45309">write() returns false</text>

  <!-- backpressure path -->
  <path d="M870 360 C 870 445, 140 445, 140 318" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
  <text x="505" y="460" font-size="15" font-weight="700" text-anchor="middle" fill="#b45309">Backpressure flows left: stop writing (pause the source)</text>
  <text x="505" y="484" font-size="14" text-anchor="middle" fill="#92400e">'drain' fires when the buffer empties -> resume reading the cursor</text>

  <!-- footer -->
  <line x1="40" y1="515" x2="1160" y2="515" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="548" font-size="14" fill="#0f172a">await pipeline(cursor, toCsv, gzip, res): backpressure between every pair, one promise for completion,</text>
  <text x="40" y="570" font-size="14" fill="#0f172a">and every stream destroyed (cursor closed) on an error or a client disconnect. Memory stays at a few buffers.</text>
</svg>
