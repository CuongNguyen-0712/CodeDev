<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Graceful shutdown: from SIGTERM to exit without dropping a payment</text>
  <text x="40" y="82" font-size="16" fill="#475569">Kubernetes removes the pod from the Service and signals the process at the same time - your handler bridges the gap.</text>

  <!-- Kubernetes lane -->
  <text x="40" y="128" font-size="16" font-weight="700" fill="#0e7490">Kubernetes</text>
  <rect x="60" y="142" width="560" height="64" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="80" y="168" font-size="15" font-weight="700" fill="#0f172a">Pod marked Terminating (t = 0)</text>
  <text x="80" y="192" font-size="13" fill="#0e7490">SIGTERM to PID 1 and removal from Service endpoints start in parallel</text>
  <rect x="900" y="142" width="260" height="64" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1030" y="168" font-size="15" font-weight="700" text-anchor="middle" fill="#b91c1c">SIGKILL at t = 30 s</text>
  <text x="1030" y="192" font-size="13" text-anchor="middle" fill="#991b1b">terminationGracePeriodSeconds</text>

  <!-- Node lane -->
  <text x="40" y="254" font-size="16" font-weight="700" fill="#15803d">Node.js process (SIGTERM handler)</text>

  <rect x="40" y="270" width="160" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">1. Unready</text>
  <text x="120" y="326" font-size="13" text-anchor="middle" fill="#166534">/readyz answers 503</text>
  <text x="120" y="346" font-size="13" text-anchor="middle" fill="#166534">no new traffic routed</text>

  <rect x="233" y="270" width="160" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="313" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">2. Wait ~5 s</text>
  <text x="313" y="326" font-size="13" text-anchor="middle" fill="#166534">endpoints and load</text>
  <text x="313" y="346" font-size="13" text-anchor="middle" fill="#166534">balancers catch up</text>

  <rect x="426" y="270" width="160" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="506" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">3. server.close()</text>
  <text x="506" y="326" font-size="13" text-anchor="middle" fill="#166534">refuse new connections</text>
  <text x="506" y="346" font-size="13" text-anchor="middle" fill="#166534">close idle keep-alive</text>

  <rect x="619" y="270" width="160" height="100" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="699" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">4. Drain</text>
  <text x="699" y="326" font-size="13" text-anchor="middle" fill="#92400e">in-flight requests</text>
  <text x="699" y="346" font-size="13" text-anchor="middle" fill="#92400e">finish (deadline 20 s)</text>

  <rect x="812" y="270" width="160" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="892" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">5. Close pools</text>
  <text x="892" y="326" font-size="13" text-anchor="middle" fill="#166534">await db.end()</text>
  <text x="892" y="346" font-size="13" text-anchor="middle" fill="#166534">await redis.quit()</text>

  <rect x="1005" y="270" width="155" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1082" y="302" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">6. Exit 0</text>
  <text x="1082" y="326" font-size="13" text-anchor="middle" fill="#166534">flush logs,</text>
  <text x="1082" y="346" font-size="13" text-anchor="middle" fill="#166534">process.exit(0)</text>

  <line x1="200" y1="320" x2="231" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="393" y1="320" x2="424" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="586" y1="320" x2="617" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="779" y1="320" x2="810" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="972" y1="320" x2="1003" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- deadline branch -->
  <line x1="699" y1="370" x2="699" y2="404" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <rect x="560" y="406" width="440" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="780" y="428" font-size="14" font-weight="700" text-anchor="middle" fill="#b91c1c">Deadline hit first? server.closeAllConnections()</text>
  <text x="780" y="447" font-size="13" text-anchor="middle" fill="#991b1b">drop the stuck requests, then continue with step 5</text>

  <!-- wrong order note -->
  <text x="40" y="420" font-size="14" font-weight="700" fill="#b91c1c">Never close pools before the drain ends:</text>
  <text x="40" y="442" font-size="13" fill="#991b1b">in-flight payments fail with "pool closed"</text>

  <!-- time axis -->
  <rect x="60" y="486" width="900" height="14" rx="4" fill="#dcfce7"/>
  <rect x="960" y="486" width="180" height="14" rx="4" fill="#fee2e2"/>
  <line x1="60" y1="512" x2="1140" y2="512" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1140,506 1152,512 1140,518" fill="#94a3b8"/>
  <line x1="60" y1="506" x2="60" y2="518" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="506" x2="240" y2="518" stroke="#94a3b8" stroke-width="2"/>
  <line x1="420" y1="506" x2="420" y2="518" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="506" x2="600" y2="518" stroke="#94a3b8" stroke-width="2"/>
  <line x1="780" y1="506" x2="780" y2="518" stroke="#94a3b8" stroke-width="2"/>
  <line x1="960" y1="506" x2="960" y2="518" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="536" font-size="13" text-anchor="middle" fill="#64748b">0 s</text>
  <text x="240" y="536" font-size="13" text-anchor="middle" fill="#64748b">5 s</text>
  <text x="420" y="536" font-size="13" text-anchor="middle" fill="#64748b">10 s</text>
  <text x="600" y="536" font-size="13" text-anchor="middle" fill="#64748b">15 s</text>
  <text x="780" y="536" font-size="13" text-anchor="middle" fill="#64748b">20 s</text>
  <text x="960" y="536" font-size="13" text-anchor="middle" fill="#64748b">25 s</text>
  <text x="1140" y="536" font-size="13" text-anchor="middle" fill="#64748b">30 s</text>
  <text x="60" y="570" font-size="14" fill="#15803d">Green: wait + drain + cleanup must fit well inside the grace period.</text>
  <text x="1140" y="570" font-size="14" text-anchor="end" fill="#b91c1c">Red: margin before SIGKILL</text>
</svg>
