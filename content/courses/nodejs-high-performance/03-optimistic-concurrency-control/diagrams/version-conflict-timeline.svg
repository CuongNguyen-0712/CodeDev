<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Compare-and-swap on a version column: the conflict is caught, not lost</text>
  <text x="40" y="82" font-size="16" fill="#475569">Both editors read version 7. Only the first UPDATE ... WHERE version = 7 can match a row.</text>

  <!-- time axis -->
  <line x1="200" y1="560" x2="1150" y2="560" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1150,554 1162,560 1150,566" fill="#94a3b8"/>
  <text x="1080" y="590" font-size="14" fill="#64748b">time</text>

  <!-- lane labels -->
  <text x="40" y="170" font-size="18" font-weight="700" fill="#0e7490">Editor A</text>
  <text x="40" y="192" font-size="14" fill="#64748b">changes the price</text>
  <line x1="200" y1="176" x2="1150" y2="176" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="40" y="310" font-size="18" font-weight="700" fill="#334155">products row</text>
  <text x="40" y="332" font-size="14" fill="#64748b">id = 42</text>

  <text x="40" y="450" font-size="18" font-weight="700" fill="#7c3aed">Editor B</text>
  <text x="40" y="472" font-size="14" fill="#64748b">changes the stock</text>
  <line x1="200" y1="456" x2="1150" y2="456" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- row state segments -->
  <rect x="200" y="290" width="470" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="435" y="321" font-size="15" text-anchor="middle" fill="#0f172a">version 7 &#183; price 100 &#183; stock 40</text>
  <rect x="680" y="290" width="360" height="50" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="860" y="321" font-size="15" text-anchor="middle" fill="#0f172a">version 8 &#183; price 120 &#183; stock 40</text>
  <rect x="1050" y="290" width="110" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1105" y="313" font-size="14" font-weight="700" text-anchor="middle" fill="#166534">version 9</text>
  <text x="1105" y="331" font-size="12" text-anchor="middle" fill="#166534">120 &#183; 38</text>

  <!-- Editor A steps -->
  <rect x="210" y="146" width="170" height="60" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="295" y="171" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">GET /products/42</text>
  <text x="295" y="191" font-size="13" text-anchor="middle" fill="#0e7490">reads version 7</text>

  <rect x="590" y="146" width="170" height="60" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="675" y="171" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">UPDATE ... v = 7</text>
  <text x="675" y="191" font-size="13" text-anchor="middle" fill="#0e7490">1 row &#8594; version 8</text>
  <line x1="675" y1="208" x2="675" y2="286" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Editor B steps -->
  <rect x="400" y="426" width="170" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="485" y="451" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">GET /products/42</text>
  <text x="485" y="471" font-size="13" text-anchor="middle" fill="#6d28d9">reads version 7</text>

  <rect x="780" y="426" width="170" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="865" y="451" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">UPDATE ... v = 7</text>
  <text x="865" y="471" font-size="13" text-anchor="middle" fill="#b91c1c">0 rows &#8594; conflict</text>
  <line x1="865" y1="424" x2="865" y2="344" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <rect x="970" y="426" width="180" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1060" y="451" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">re-read version 8</text>
  <text x="1060" y="471" font-size="13" text-anchor="middle" fill="#166534">re-apply, v = 8 &#8594; 9</text>
  <line x1="1105" y1="424" x2="1105" y2="344" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- callout -->
  <rect x="200" y="510" width="660" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="530" y="532" font-size="14" text-anchor="middle" fill="#92400e">Without WHERE version = 7, B's save would write price 100 back: a silent lost update.</text>
</svg>
