<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">400 ms of fraud scoring vs. two payments: three ways to run it</text>
  <text x="40" y="82" font-size="16" fill="#475569">Same CPU work, same two POST /payments arriving at 50 ms and 120 ms. Only the waiting time changes.</text>

  <!-- lane 1: blocking -->
  <text x="40" y="160" font-size="18" font-weight="700" fill="#b91c1c">1. Blocking loop</text>
  <text x="40" y="182" font-size="14" fill="#64748b">one handler, one thread</text>
  <circle cx="345" cy="124" r="6" fill="#7c3aed"/>
  <text x="357" y="129" font-size="13" fill="#6d28d9">#1 arrives</text>
  <circle cx="464" cy="124" r="6" fill="#7c3aed"/>
  <text x="476" y="129" font-size="13" fill="#6d28d9">#2 arrives</text>
  <rect x="260" y="140" width="680" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="171" font-size="15" text-anchor="middle" fill="#991b1b">score-batch: 400 ms of synchronous CPU</text>
  <rect x="944" y="140" width="44" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="966" y="171" font-size="13" text-anchor="middle" fill="#0f172a">#1</text>
  <rect x="992" y="140" width="44" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1014" y="171" font-size="13" text-anchor="middle" fill="#0f172a">#2</text>
  <text x="260" y="214" font-size="14" fill="#b45309">Both payments wait until 400 ms: #1 waits ~350 ms, #2 ~300 ms. Health checks time out too.</text>

  <line x1="40" y1="234" x2="1160" y2="234" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- lane 2: chunked -->
  <text x="40" y="278" font-size="18" font-weight="700" fill="#b45309">2. Chunked</text>
  <text x="40" y="300" font-size="14" fill="#64748b">setImmediate between chunks</text>
  <rect x="260" y="258" width="170" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="345" y="289" font-size="14" text-anchor="middle" fill="#991b1b">chunk 1</text>
  <rect x="434" y="258" width="34" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="451" y="289" font-size="13" text-anchor="middle" fill="#0f172a">#1</text>
  <rect x="472" y="258" width="170" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="557" y="289" font-size="14" text-anchor="middle" fill="#991b1b">chunk 2</text>
  <rect x="646" y="258" width="34" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="663" y="289" font-size="13" text-anchor="middle" fill="#0f172a">#2</text>
  <rect x="684" y="258" width="170" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="769" y="289" font-size="14" text-anchor="middle" fill="#991b1b">chunk 3</text>
  <rect x="858" y="258" width="170" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="943" y="289" font-size="14" text-anchor="middle" fill="#991b1b">chunk 4</text>
  <text x="260" y="332" font-size="14" fill="#b45309">A payment waits at most one chunk (~100 ms). The batch itself finishes slightly later.</text>

  <line x1="40" y1="352" x2="1160" y2="352" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- lane 3: worker pool -->
  <text x="40" y="398" font-size="18" font-weight="700" fill="#15803d">3. Worker pool</text>
  <text x="40" y="420" font-size="14" fill="#64748b">worker_threads / piscina</text>
  <rect x="260" y="372" width="30" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="345" y="372" width="34" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="362" y="398" font-size="13" text-anchor="middle" fill="#0f172a">#1</text>
  <rect x="464" y="372" width="34" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="481" y="398" font-size="13" text-anchor="middle" fill="#0f172a">#2</text>
  <rect x="944" y="372" width="30" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1150" y="397" font-size="14" text-anchor="end" fill="#475569">main thread</text>
  <rect x="260" y="428" width="680" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="453" font-size="14" text-anchor="middle" fill="#991b1b">score-batch on another core</text>
  <text x="1150" y="453" font-size="14" text-anchor="end" fill="#475569">worker thread</text>
  <path d="M275 412 L275 428" stroke="#16a34a" stroke-width="2"/>
  <path d="M940 440 C 952 432, 958 422, 959 412" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="494" font-size="14" fill="#15803d">The event loop stays free: each payment is served on arrival. Green marks = post task / receive result.</text>

  <!-- time axis -->
  <line x1="260" y1="528" x2="1120" y2="528" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1120,522 1132,528 1120,534" fill="#94a3b8"/>
  <line x1="260" y1="522" x2="260" y2="534" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="522" x2="430" y2="534" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="522" x2="600" y2="534" stroke="#94a3b8" stroke-width="2"/>
  <line x1="770" y1="522" x2="770" y2="534" stroke="#94a3b8" stroke-width="2"/>
  <line x1="940" y1="522" x2="940" y2="534" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="552" font-size="13" text-anchor="middle" fill="#64748b">0 ms</text>
  <text x="430" y="552" font-size="13" text-anchor="middle" fill="#64748b">100</text>
  <text x="600" y="552" font-size="13" text-anchor="middle" fill="#64748b">200</text>
  <text x="770" y="552" font-size="13" text-anchor="middle" fill="#64748b">300</text>
  <text x="940" y="552" font-size="13" text-anchor="middle" fill="#64748b">400</text>
  <text x="1150" y="552" font-size="13" text-anchor="end" fill="#64748b">time</text>

  <!-- legend -->
  <rect x="260" y="578" width="18" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="288" y="592" font-size="14" fill="#334155">CPU work (fraud scoring)</text>
  <rect x="490" y="578" width="18" height="18" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="518" y="592" font-size="14" fill="#334155">POST /payments handler</text>
  <rect x="720" y="578" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="748" y="592" font-size="14" fill="#334155">message to / from the worker</text>
</svg>
