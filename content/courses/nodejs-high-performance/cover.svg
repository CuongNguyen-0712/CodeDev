<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Node.js high performance (concurrent requests, locks, idempotency, throughput). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121A17"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.48" r="0.48">
      <stop offset="0" stop-color="#5FA04E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5FA04E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lane" gradientUnits="userSpaceOnUse" x1="890" y1="0" x2="1110" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3C873A"/>
      <stop offset="1" stop-color="#8CC84B"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <!-- Node hexagon badge -->
    <polygon points="158,146 204,172 204,224 158,250 112,224 112,172" fill="#5FA04E"/>
    <text x="158" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#0B1A0E">N</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#8CC84B">NODE.JS · BACKEND</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">High Performance</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Node.js</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Concurrency · Consistency · Reliability</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#C7E8B8">
      <rect x="110" y="660" width="170" height="52" rx="26" fill="#17281A" stroke="#3C873A"/>
      <text x="195" y="695" text-anchor="middle">lock</text>
      <rect x="296" y="660" width="290" height="52" rx="26" fill="#17281A" stroke="#3C873A"/>
      <text x="441" y="695" text-anchor="middle">Idempotency-Key</text>
      <rect x="602" y="660" width="200" height="52" rx="26" fill="#17281A" stroke="#3C873A"/>
      <text x="702" y="695" text-anchor="middle">backoff</text>
    </g>
  </g>

  <!-- Concurrent requests converging on one guarded critical section -->
  <g stroke-linecap="round" fill="none" stroke-width="5">
    <path d="M890 250 C 1000 250, 1010 380, 1110 420" stroke="url(#lane)"/>
    <path d="M890 340 C 1000 340, 1010 410, 1110 435" stroke="url(#lane)"/>
    <path d="M890 450 L 1110 450" stroke="url(#lane)"/>
    <path d="M890 560 C 1000 560, 1010 490, 1110 465" stroke="url(#lane)"/>
    <path d="M890 650 C 1000 650, 1010 520, 1110 480" stroke="url(#lane)"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="930" cy="250" r="9"/>
    <circle cx="965" cy="340" r="9"/>
    <circle cx="910" cy="450" r="9"/>
    <circle cx="985" cy="560" r="9"/>
    <circle cx="940" cy="650" r="9"/>
  </g>

  <!-- Guarded section: hexagon with a lock -->
  <g transform="translate(1200 450)">
    <polygon points="0,-112 97,-56 97,56 0,112 -97,56 -97,-56" fill="#15111F" stroke="#5FA04E" stroke-width="6"/>
    <rect x="-34" y="-8" width="68" height="54" rx="10" fill="#8CC84B"/>
    <path d="M-20 -8 V-28 a20 20 0 0 1 40 0 V-8" fill="none" stroke="#8CC84B" stroke-width="10"/>
    <circle cx="0" cy="16" r="7" fill="#15111F"/>
    <rect x="-3" y="18" width="6" height="16" rx="3" fill="#15111F"/>
  </g>

  <!-- Single ordered output + throughput bars -->
  <path d="M1297 450 L 1370 450" stroke="#8CC84B" stroke-width="6" stroke-linecap="round"/>
  <g>
    <rect x="1390" y="470" width="34" height="80" rx="6" fill="url(#bar)"/>
    <rect x="1436" y="420" width="34" height="130" rx="6" fill="url(#bar)"/>
    <rect x="1482" y="360" width="34" height="190" rx="6" fill="url(#bar)"/>
  </g>
  <text x="1390" y="590" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#8CC84B">THROUGHPUT</text>
  <text x="890" y="220" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#C4B5FD">CONCURRENT REQUESTS</text>
</svg>
