<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Two payments, one wallet: how a single thread still races</text>
  <text x="40" y="82" font-size="16" fill="#475569">Every await yields to the event loop - the other request runs in that gap.</text>

  <!-- time axis -->
  <line x1="200" y1="470" x2="1150" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1150,464 1162,470 1150,476" fill="#94a3b8"/>
  <text x="1080" y="500" font-size="14" fill="#64748b">time</text>

  <!-- lanes -->
  <text x="40" y="190" font-size="18" font-weight="700" fill="#0e7490">Request A</text>
  <text x="40" y="212" font-size="14" fill="#64748b">pay 80,000</text>
  <line x1="200" y1="196" x2="1130" y2="196" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="40" y="350" font-size="18" font-weight="700" fill="#7c3aed">Request B</text>
  <text x="40" y="372" font-size="14" fill="#64748b">pay 80,000</text>
  <line x1="200" y1="356" x2="1130" y2="356" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- A steps -->
  <rect x="210" y="166" width="190" height="60" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="305" y="192" font-size="15" text-anchor="middle" fill="#0f172a">findById()</text>
  <text x="305" y="212" font-size="13" text-anchor="middle" fill="#0e7490">reads 100,000</text>

  <rect x="610" y="166" width="190" height="60" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="705" y="192" font-size="15" text-anchor="middle" fill="#0f172a">check + save()</text>
  <text x="705" y="212" font-size="13" text-anchor="middle" fill="#0e7490">writes 20,000</text>

  <!-- B steps -->
  <rect x="420" y="326" width="190" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="515" y="352" font-size="15" text-anchor="middle" fill="#0f172a">findById()</text>
  <text x="515" y="372" font-size="13" text-anchor="middle" fill="#6d28d9">reads 100,000 (stale)</text>

  <rect x="830" y="326" width="190" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="925" y="352" font-size="15" text-anchor="middle" fill="#0f172a">check + save()</text>
  <text x="925" y="372" font-size="13" text-anchor="middle" fill="#6d28d9">writes 20,000</text>

  <!-- await gaps -->
  <text x="505" y="150" font-size="14" text-anchor="middle" fill="#b45309">await db (A yields)</text>
  <path d="M400 196 C 450 150, 560 150, 610 196" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="720" y="420" font-size="14" text-anchor="middle" fill="#b45309">await db (B yields)</text>
  <path d="M610 356 C 660 410, 780 410, 830 356" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- result -->
  <rect x="820" y="98" width="330" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="985" y="122" font-size="15" font-weight="700" text-anchor="middle" fill="#b91c1c">2 payments approved, 1 charged</text>
  <text x="985" y="143" font-size="13" text-anchor="middle" fill="#b91c1c">final balance 20,000 - lost update</text>
</svg>
