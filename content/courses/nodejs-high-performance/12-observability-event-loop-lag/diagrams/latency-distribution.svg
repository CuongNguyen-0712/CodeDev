<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">10,000 checkouts: the average looks fine, the tail is failing</text>
  <text x="40" y="82" font-size="16" fill="#475569">Request count per latency bucket over 5 minutes. Percentiles use the nearest-rank definition.</text>

  <!-- annotation -->
  <rect x="640" y="108" width="510" height="88" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="660" y="136" font-size="15" font-weight="700" fill="#b91c1c">avg 92 ms and p95 90 ms look healthy</text>
  <text x="660" y="160" font-size="14" fill="#991b1b">p99 = 3,000 ms: 150 checkouts (1.5%) took ~3 s and</text>
  <text x="660" y="181" font-size="14" fill="#991b1b">hit the mobile app's 2.5 s timeout - real failed payments.</text>

  <!-- axis -->
  <line x1="100" y1="480" x2="1110" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <rect x="115" y="435" width="95" height="45" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="162.5" y="427" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">1,200</text>
  <text x="162.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">0-25</text>
  <rect x="240" y="220" width="95" height="260" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="287.5" y="212" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">6,900</text>
  <text x="287.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">25-50</text>
  <rect x="365" y="423" width="95" height="57" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="412.5" y="415" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">1,500</text>
  <text x="412.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">50-100</text>
  <rect x="490" y="473" width="95" height="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="537.5" y="465" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">180</text>
  <text x="537.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">100-250</text>
  <rect x="615" y="477" width="95" height="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="662.5" y="469" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">40</text>
  <text x="662.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">250-500</text>
  <rect x="740" y="477" width="95" height="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="787.5" y="469" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">20</text>
  <text x="787.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">0.5-1 s</text>
  <rect x="865" y="477" width="95" height="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="912.5" y="469" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">10</text>
  <text x="912.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">1-2.5 s</text>
  <rect x="990" y="474" width="95" height="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1037.5" y="466" font-size="14" font-weight="700" text-anchor="middle" fill="#b91c1c">150</text>
  <text x="1037.5" y="504" font-size="13" text-anchor="middle" fill="#64748b">2.5-5 s</text>

  <text x="605" y="534" font-size="14" text-anchor="middle" fill="#475569">latency bucket (ms unless marked)</text>

  <!-- markers -->
  <line x1="325" y1="480" x2="325" y2="190" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="325" y="182" font-size="14" font-weight="700" text-anchor="middle" fill="#0e7490">p50 = 45 ms</text>
  <line x1="445" y1="480" x2="445" y2="160" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="439" y="152" font-size="14" font-weight="700" text-anchor="end" fill="#6d28d9">p95 = 90 ms</text>
  <line x1="462" y1="480" x2="462" y2="130" stroke="#d97706" stroke-width="3"/>
  <text x="462" y="122" font-size="14" font-weight="700" text-anchor="middle" fill="#b45309">avg = 92 ms</text>
  <line x1="975" y1="480" x2="975" y2="290" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="968" y="282" font-size="13" text-anchor="end" fill="#b91c1c">app timeout 2.5 s</text>
  <line x1="1000" y1="480" x2="1000" y2="250" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1000" y="242" font-size="14" font-weight="700" text-anchor="middle" fill="#b91c1c">p99 = 3,000 ms</text>

  <!-- legend -->
  <rect x="100" y="562" width="18" height="18" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="128" y="576" font-size="14" fill="#334155">requests under the timeout</text>
  <rect x="360" y="562" width="18" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="388" y="576" font-size="14" fill="#334155">slow tail: few requests, but this is where customers fail</text>
</svg>
