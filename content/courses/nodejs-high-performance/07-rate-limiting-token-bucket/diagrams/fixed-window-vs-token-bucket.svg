<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Same burst, two limiters: fixed window vs token bucket</text>
  <text x="40" y="82" font-size="16" fill="#475569">A client sends 100 requests at 12:00:59.9 and 100 more at 12:01:00.1. Limit: 100 per minute.</text>

  <!-- ===== Panel 1: fixed window ===== -->
  <text x="40" y="128" font-size="18" font-weight="700" fill="#0e7490">Fixed window counter</text>
  <rect x="140" y="160" width="500" height="140" fill="#f8fafc"/>
  <rect x="640" y="160" width="500" height="140" fill="#f1f5f9"/>
  <text x="160" y="190" font-size="14" fill="#334155">window 12:00 - count 100 / 100</text>
  <text x="1120" y="190" font-size="14" text-anchor="end" fill="#334155">window 12:01 - count 100 / 100</text>
  <line x1="640" y1="160" x2="640" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="640" y="150" font-size="15" font-weight="700" text-anchor="middle" fill="#b91c1c">200 accepted within 200 ms = 2x the limit</text>

  <rect x="604" y="214" width="22" height="86" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="654" y="214" width="22" height="86" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="594" y="236" font-size="14" text-anchor="end" fill="#15803d">100 accepted</text>
  <text x="686" y="236" font-size="14" fill="#15803d">100 accepted (counter was reset)</text>

  <line x1="140" y1="300" x2="1140" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="322" font-size="13" text-anchor="middle" fill="#64748b">12:00:00</text>
  <text x="640" y="322" font-size="13" text-anchor="middle" fill="#64748b">12:01:00</text>
  <text x="1140" y="322" font-size="13" text-anchor="end" fill="#64748b">12:02:00</text>

  <line x1="40" y1="345" x2="1160" y2="345" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== Panel 2: token bucket ===== -->
  <text x="40" y="378" font-size="18" font-weight="700" fill="#7c3aed">Token bucket (capacity 100, refill 100 per minute)</text>
  <rect x="140" y="400" width="1000" height="150" fill="#faf5ff"/>
  <line x1="640" y1="400" x2="640" y2="550" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="604" y="445" width="22" height="105" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="654" y="445" width="22" height="105" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

  <polyline points="140,445 615,445 618,550 1112,445 1140,445" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="150" y="432" font-size="14" fill="#6d28d9">tokens in bucket</text>
  <text x="594" y="432" font-size="14" text-anchor="end" fill="#15803d">100 accepted - bucket empties</text>
  <text x="686" y="420" font-size="14" fill="#b91c1c">next 100 get 429, Retry-After: 1</text>
  <text x="1130" y="535" font-size="14" text-anchor="end" fill="#6d28d9">refills ~1.7 tokens / s</text>

  <line x1="140" y1="550" x2="1140" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="572" font-size="13" text-anchor="middle" fill="#64748b">12:00:00</text>
  <text x="640" y="572" font-size="13" text-anchor="middle" fill="#64748b">12:01:00</text>
  <text x="1140" y="572" font-size="13" text-anchor="end" fill="#64748b">12:02:00</text>
</svg>
