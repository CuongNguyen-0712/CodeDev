<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Old and new code share the database during every deploy.</text>
  <text x="40" y="82" font-size="16" fill="#475569">Renaming enrollments.status to state: in one release (before) and with expand-contract (after).</text>

  <!-- Before -->
  <rect x="40" y="100" width="1120" height="176" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="130" font-size="18" font-weight="700" fill="#b91c1c">Before: v42 runs RENAME COLUMN, then restarts four workers one by one</text>

  <g font-size="13" fill="#334155">
    <text x="64" y="166">worker-1</text>
    <text x="64" y="188">worker-2</text>
    <text x="64" y="210">worker-3</text>
    <text x="64" y="232">worker-4</text>
  </g>
  <!-- v41 healthy before migration -->
  <g fill="#cbd5e1">
    <rect x="220" y="155" width="112" height="14"/>
    <rect x="220" y="177" width="112" height="14"/>
    <rect x="220" y="199" width="112" height="14"/>
    <rect x="220" y="221" width="112" height="14"/>
  </g>
  <!-- v41 failing after migration -->
  <g fill="#f87171">
    <rect x="332" y="155" width="3" height="14"/>
    <rect x="332" y="177" width="141" height="14"/>
    <rect x="332" y="199" width="282" height="14"/>
    <rect x="332" y="221" width="423" height="14"/>
  </g>
  <!-- v42 healthy -->
  <g fill="#bbf7d0" stroke="#16a34a" stroke-width="1">
    <rect x="335" y="155" width="682" height="14"/>
    <rect x="473" y="177" width="544" height="14"/>
    <rect x="614" y="199" width="403" height="14"/>
    <rect x="755" y="221" width="262" height="14"/>
  </g>
  <!-- rollback to v41 failing -->
  <g fill="#ef4444">
    <rect x="1030" y="155" width="110" height="14"/>
    <rect x="1030" y="177" width="110" height="14"/>
    <rect x="1030" y="199" width="110" height="14"/>
    <rect x="1030" y="221" width="110" height="14"/>
  </g>
  <line x1="332" y1="144" x2="332" y2="244" stroke="#b91c1c" stroke-width="2"/>
  <line x1="1022" y1="144" x2="1022" y2="244" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="220" y="258">10:00</text>
    <text x="332" y="258">10:02</text>
    <text x="557" y="258">10:06</text>
    <text x="782" y="258">10:10</text>
    <text x="1007" y="258">10:14</text>
  </g>
  <text x="342" y="146" font-size="12" font-weight="700" fill="#b91c1c">RENAME COLUMN (4 ms)</text>
  <text x="1018" y="146" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">rollback to v41</text>
  <text x="540" y="146" font-size="12" fill="#7f1d1d">red: v41 still running, "no such column: status"</text>
  <text x="1140" y="270" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">every worker fails</text>

  <!-- After -->
  <rect x="40" y="292" width="1120" height="292" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="64" y="322" font-size="18" font-weight="700" fill="#15803d">After: expand-contract, six boring steps</text>
  <text x="1136" y="322" font-size="13" fill="#15803d" text-anchor="end">each step works with the code before it and after it</text>

  <g font-size="13">
    <rect x="56" y="338" width="170" height="168" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="70" y="362" font-size="15" font-weight="700" fill="#15803d">1 Expand</text>
    <text x="70" y="386" fill="#334155">ADD COLUMN state</text>
    <text x="70" y="404" fill="#334155">(nullable)</text>
    <text x="70" y="470" font-size="12" fill="#64748b">safe way back:</text>
    <text x="70" y="488" font-size="12" font-weight="700" fill="#15803d">previous code</text>

    <rect x="240" y="338" width="170" height="168" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="254" y="362" font-size="15" font-weight="700" fill="#15803d">2 Write both</text>
    <text x="254" y="386" fill="#334155">v42 writes status</text>
    <text x="254" y="404" fill="#334155">and state,</text>
    <text x="254" y="422" fill="#334155">reads status</text>
    <text x="254" y="470" font-size="12" fill="#64748b">safe way back:</text>
    <text x="254" y="488" font-size="12" font-weight="700" fill="#15803d">v41</text>

    <rect x="424" y="338" width="170" height="168" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="438" y="362" font-size="15" font-weight="700" fill="#15803d">3 Backfill</text>
    <text x="438" y="386" fill="#334155">batches of 1,000,</text>
    <text x="438" y="404" fill="#334155">short locks; check</text>
    <text x="438" y="422" fill="#334155">query returns 0</text>
    <text x="438" y="470" font-size="12" fill="#64748b">safe way back:</text>
    <text x="438" y="488" font-size="12" font-weight="700" fill="#15803d">stop, resume later</text>

    <rect x="608" y="338" width="170" height="168" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="622" y="362" font-size="15" font-weight="700" fill="#15803d">4 Switch reads</text>
    <text x="622" y="386" fill="#334155">v43 reads state,</text>
    <text x="622" y="404" fill="#334155">still writes both</text>
    <text x="622" y="470" font-size="12" fill="#64748b">safe way back:</text>
    <text x="622" y="488" font-size="12" font-weight="700" fill="#15803d">v42</text>

    <rect x="792" y="338" width="170" height="168" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="806" y="362" font-size="15" font-weight="700" fill="#15803d">5 Stop old writes</text>
    <text x="806" y="386" fill="#334155">v44 writes only</text>
    <text x="806" y="404" fill="#334155">state; status</text>
    <text x="806" y="422" fill="#334155">goes stale</text>
    <text x="806" y="470" font-size="12" fill="#64748b">safe way back:</text>
    <text x="806" y="488" font-size="12" font-weight="700" fill="#15803d">v43</text>

    <rect x="976" y="338" width="170" height="168" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="990" y="362" font-size="15" font-weight="700" fill="#b45309">6 Contract</text>
    <text x="990" y="386" fill="#92400e">back up, drop the</text>
    <text x="990" y="404" fill="#92400e">index, DROP COLUMN</text>
    <text x="990" y="422" fill="#92400e">status</text>
    <text x="990" y="470" font-size="12" fill="#92400e">way back:</text>
    <text x="990" y="488" font-size="12" font-weight="700" fill="#b91c1c">restore the backup only</text>
  </g>

  <line x1="56" y1="530" x2="1130" y2="530" stroke="#16a34a" stroke-width="2"/>
  <polygon points="1146,530 1130,523 1130,537" fill="#16a34a"/>
  <text x="56" y="560" font-size="14" fill="#14532d">Verify before moving on: all workers on the new version (steps 2, 4, 5), SELECT COUNT(*) ... WHERE state IS NULL OR state &lt;&gt; status = 0 (step 3).</text>
</svg>
