<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A list in a column is a missing relationship.</text>
  <text x="40" y="82" font-size="16" fill="#475569">The same data before and after modeling: courses.student_ids becomes one enrollments row per learner and course.</text>

  <!-- Before -->
  <rect x="40" y="108" width="400" height="472" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="140" font-size="18" font-weight="700" fill="#b91c1c">Before: schema v1</text>
  <text x="64" y="162" font-size="13" fill="#64748b">courses(id, title, student_ids TEXT)</text>

  <rect x="64" y="178" width="352" height="124" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#334155">
    <text x="78" y="202" font-weight="700">id</text><text x="106" y="202" font-weight="700">title</text><text x="300" y="202" font-weight="700">student_ids</text>
    <line x1="74" y1="210" x2="406" y2="210" stroke="#fecaca" stroke-width="1"/>
    <text x="78" y="232">12</text><text x="106" y="232">SQL &amp; Data Modeling</text><text x="300" y="232" fill="#b91c1c" font-weight="700">3,17,27,70</text>
    <text x="78" y="258">13</text><text x="106" y="258">Web App Fundamentals</text><text x="300" y="258" fill="#b91c1c" font-weight="700">7,8</text>
    <text x="78" y="284">14</text><text x="106" y="284">Python Basics</text><text x="300" y="284" fill="#b91c1c" font-weight="700">''</text>
  </g>

  <g font-size="14" fill="#7f1d1d">
    <circle cx="74" cy="336" r="5" fill="#ef4444"/>
    <text x="88" y="341">LIKE '%7%' also matches 17, 27 and 70:</text>
    <text x="88" y="361">learner 7 sees course 12.</text>
    <circle cx="74" cy="390" r="5" fill="#ef4444"/>
    <text x="88" y="395">'' has no comma, so the comma count</text>
    <text x="88" y="415">says course 14 has 1 learner.</text>
    <circle cx="74" cy="444" r="5" fill="#ef4444"/>
    <text x="88" y="449">Read, append, write the whole string:</text>
    <text x="88" y="469">two admins at once, one learner lost.</text>
    <circle cx="74" cy="498" r="5" fill="#ef4444"/>
    <text x="88" y="503">No row per learner, so no place</text>
    <text x="88" y="523">for enrolled_at or status.</text>
  </g>
  <text x="64" y="560" font-size="14" font-weight="700" fill="#b91c1c">Many facts in one value.</text>

  <!-- After -->
  <rect x="460" y="108" width="700" height="472" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="484" y="140" font-size="18" font-weight="700" fill="#15803d">After: entities and join tables (crow's foot)</text>

  <!-- boxes -->
  <g font-size="12" fill="#334155">
    <rect x="500" y="150" width="160" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="500" y="150" width="160" height="26" rx="6" fill="#bbf7d0"/>
    <text x="580" y="168" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">users</text>
    <text x="512" y="196">id</text><text x="648" y="196" text-anchor="end">PK</text>
    <text x="512" y="216">email</text>

    <rect x="740" y="150" width="160" height="112" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="740" y="150" width="160" height="26" rx="6" fill="#86efac"/>
    <text x="820" y="168" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">enrollments</text>
    <text x="752" y="196">user_id</text><text x="888" y="196" text-anchor="end">PK, FK</text>
    <text x="752" y="214">course_id</text><text x="888" y="214" text-anchor="end">PK, FK</text>
    <text x="752" y="232" font-weight="700" fill="#15803d">enrolled_at</text>
    <text x="752" y="250" font-weight="700" fill="#15803d">status</text>

    <rect x="980" y="150" width="160" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="980" y="150" width="160" height="26" rx="6" fill="#bbf7d0"/>
    <text x="1060" y="168" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">courses</text>
    <text x="992" y="196">id</text><text x="1128" y="196" text-anchor="end">PK</text>
    <text x="992" y="216">title</text>

    <rect x="740" y="330" width="160" height="94" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="740" y="330" width="160" height="26" rx="6" fill="#bbf7d0"/>
    <text x="820" y="348" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">lesson_progress</text>
    <text x="752" y="376">user_id</text><text x="888" y="376" text-anchor="end">PK, FK</text>
    <text x="752" y="394">lesson_id</text><text x="888" y="394" text-anchor="end">PK, FK</text>
    <text x="752" y="412">completed_at</text>

    <rect x="980" y="330" width="160" height="94" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="980" y="330" width="160" height="26" rx="6" fill="#bbf7d0"/>
    <text x="1060" y="348" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">lessons</text>
    <text x="992" y="376">id</text><text x="1128" y="376" text-anchor="end">PK</text>
    <text x="992" y="394">course_id</text><text x="1128" y="394" text-anchor="end">FK</text>
    <text x="992" y="412">position, title</text>
  </g>

  <!-- relationship lines -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <!-- users || - o{ enrollments -->
    <line x1="660" y1="190" x2="740" y2="190"/>
    <line x1="670" y1="181" x2="670" y2="199"/><line x1="678" y1="181" x2="678" y2="199"/>
    <line x1="724" y1="190" x2="740" y2="181"/><line x1="724" y1="190" x2="740" y2="199"/>
    <circle cx="716" cy="190" r="6" fill="#ffffff"/>

    <!-- enrollments }o - || courses -->
    <line x1="900" y1="190" x2="980" y2="190"/>
    <line x1="970" y1="181" x2="970" y2="199"/><line x1="962" y1="181" x2="962" y2="199"/>
    <line x1="916" y1="190" x2="900" y2="181"/><line x1="916" y1="190" x2="900" y2="199"/>
    <circle cx="924" cy="190" r="6" fill="#ffffff"/>

    <!-- courses || - |{ lessons -->
    <line x1="1060" y1="230" x2="1060" y2="330"/>
    <line x1="1051" y1="240" x2="1069" y2="240"/><line x1="1051" y1="248" x2="1069" y2="248"/>
    <line x1="1060" y1="314" x2="1051" y2="330"/><line x1="1060" y1="314" x2="1069" y2="330"/>
    <line x1="1051" y1="308" x2="1069" y2="308"/>

    <!-- lesson_progress }o - || lessons -->
    <line x1="900" y1="377" x2="980" y2="377"/>
    <line x1="970" y1="368" x2="970" y2="386"/><line x1="962" y1="368" x2="962" y2="386"/>
    <line x1="916" y1="377" x2="900" y2="368"/><line x1="916" y1="377" x2="900" y2="386"/>
    <circle cx="924" cy="377" r="6" fill="#ffffff"/>

    <!-- users || - o{ lesson_progress -->
    <polyline points="580,230 580,377 740,377"/>
    <line x1="571" y1="240" x2="589" y2="240"/><line x1="571" y1="248" x2="589" y2="248"/>
    <line x1="724" y1="377" x2="740" y2="368"/><line x1="724" y1="377" x2="740" y2="386"/>
    <circle cx="716" cy="377" r="6" fill="#ffffff"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="700" y="216">enrolls</text>
    <text x="940" y="216">has</text>
    <text x="1104" y="284">contains</text>
    <text x="940" y="403">tracked by</text>
    <text x="640" y="368">records</text>
  </g>

  <!-- legend -->
  <line x1="484" y1="446" x2="1136" y2="446" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="484" y="472" font-size="14" font-weight="700" fill="#334155">End marks (the mark next to the box is the maximum)</text>
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="490" y1="500" x2="550" y2="500"/>
    <line x1="534" y1="491" x2="534" y2="509"/><line x1="542" y1="491" x2="542" y2="509"/>
    <line x1="490" y1="536" x2="550" y2="536"/>
    <line x1="540" y1="527" x2="540" y2="545"/>
    <circle cx="526" cy="536" r="6" fill="#ffffff"/>
    <line x1="810" y1="500" x2="870" y2="500"/>
    <line x1="854" y1="500" x2="870" y2="491"/><line x1="854" y1="500" x2="870" y2="509"/>
    <line x1="848" y1="491" x2="848" y2="509"/>
    <line x1="810" y1="536" x2="870" y2="536"/>
    <line x1="854" y1="536" x2="870" y2="527"/><line x1="854" y1="536" x2="870" y2="545"/>
    <circle cx="840" cy="536" r="6" fill="#ffffff"/>
  </g>
  <g font-size="13" fill="#334155">
    <text x="562" y="505">exactly one ( || )</text>
    <text x="562" y="541">zero or one ( o| )</text>
    <text x="882" y="505">one or many ( |{ )</text>
    <text x="882" y="541">zero or many ( o{ )</text>
  </g>
  <text x="484" y="568" font-size="13" fill="#15803d">Read one end at a time: one course has zero or many enrollments; each enrollment has exactly one course.</text>
</svg>
