<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Join two "many" tables through the course and the rows multiply.</text>
  <text x="40" y="82" font-size="16" fill="#475569">Same data, two queries: count after joining everything, or count each table first and join the counts.</text>

  <!-- Left: AI query -->
  <rect x="40" y="112" width="545" height="300" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="146" font-size="18" font-weight="700" fill="#b91c1c">Before: join everything, then COUNT</text>
  <text x="64" y="170" font-size="13" fill="#64748b">rows for SQL &amp; Data Modeling before GROUP BY (learner, lesson)</text>

  <rect x="64" y="184" width="240" height="32" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="206" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">Mai  101</text>
  <rect x="64" y="222" width="240" height="32" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="244" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">Mai  102</text>
  <rect x="64" y="260" width="240" height="32" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="282" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">Mai  103</text>
  <rect x="64" y="298" width="240" height="32" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="320" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">Mai  104</text>
  <rect x="64" y="336" width="240" height="32" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="78" y="358" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">Tom  101</text>

  <rect x="321" y="184" width="240" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="335" y="206" font-size="15" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">Ana  (no lesson)</text>
  <rect x="321" y="222" width="240" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="335" y="244" font-size="15" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">Docker Basics</text>
  <text x="335" y="276" font-size="13" fill="#64748b">dropped by the inner joins</text>
  <text x="335" y="320" font-size="13" fill="#64748b">Mai counted 4 times,</text>
  <text x="335" y="338" font-size="13" fill="#64748b">Ana not at all</text>
  <text x="64" y="396" font-size="15" font-weight="700" fill="#b91c1c">learners = 5 (real: 3), Docker Basics missing</text>

  <!-- Right: fix -->
  <rect x="615" y="112" width="545" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="146" font-size="18" font-weight="700" fill="#15803d">After: count each table, then LEFT JOIN</text>
  <text x="639" y="170" font-size="13" fill="#64748b">each subquery has one row per course, so nothing can multiply</text>

  <rect x="639" y="184" width="240" height="70" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="653" y="208" font-size="14" font-weight="700" fill="#334155">learner_counts</text>
  <text x="653" y="236" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">course 1 -> 3</text>
  <rect x="896" y="184" width="240" height="70" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="910" y="208" font-size="14" font-weight="700" fill="#334155">completed_counts</text>
  <text x="910" y="236" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">course 1 -> 5</text>

  <line x1="759" y1="254" x2="759" y2="276" stroke="#94a3b8" stroke-width="2"/>
  <line x1="1016" y1="254" x2="1016" y2="276" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="753,272 765,272 759,282" fill="#94a3b8"/>
  <polygon points="1010,272 1022,272 1016,282" fill="#94a3b8"/>

  <rect x="639" y="284" width="497" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="306" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">1  SQL &amp; Data Modeling       3   5</text>
  <rect x="639" y="322" width="497" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="344" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">3  Docker Basics             0   0</text>
  <text x="639" y="396" font-size="15" font-weight="700" fill="#15803d">every course listed, each number counted once</text>

  <!-- Rules -->
  <text x="40" y="452" font-size="18" font-weight="700" fill="#334155">Three rules for joins with counts</text>
  <rect x="40" y="470" width="350" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="58" y="498" font-size="15" font-weight="700" fill="#b45309">1  Ask what one row is</text>
  <text x="58" y="522" font-size="13" fill="#92400e">after each join: a course, an enrollment,</text>
  <text x="58" y="540" font-size="13" fill="#92400e">or a (learner, lesson) pair?</text>
  <line x1="390" y1="516" x2="420" y2="516" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="416,510 416,522 428,516" fill="#94a3b8"/>

  <rect x="430" y="470" width="350" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="448" y="498" font-size="15" font-weight="700" fill="#334155">2  Aggregate each child alone</text>
  <text x="448" y="522" font-size="13" fill="#475569">GROUP BY course_id in its own subquery</text>
  <text x="448" y="540" font-size="13" fill="#475569">or CTE, one row per course</text>
  <line x1="780" y1="516" x2="810" y2="516" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="806,510 806,522 818,516" fill="#94a3b8"/>

  <rect x="820" y="470" width="340" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="838" y="498" font-size="15" font-weight="700" fill="#15803d">3  LEFT JOIN the counts</text>
  <text x="838" y="522" font-size="13" fill="#166534">right-table filters in ON,</text>
  <text x="838" y="540" font-size="13" fill="#166534">COALESCE(count, 0) for empty parents</text>
</svg>
