<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: SQL & data modeling (two tables joined by a foreign key, a duplicate row refused by a unique key). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1724"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7DD3FC"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#0EA5E9"/>
    <text x="158" y="211" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="800" fill="#FFFFFF">SQL</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#7DD3FC">SQL · DATA MODELING</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">SQL &amp; Data</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Modeling</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Keys · Joins · Constraints · Transactions</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#D6EEFB">
      <rect x="110" y="660" width="162" height="52" rx="26" fill="#0F2233" stroke="#0EA5E9"/>
      <text x="191" y="695" text-anchor="middle">UNIQUE</text>
      <rect x="288" y="660" width="122" height="52" rx="26" fill="#0F2233" stroke="#0EA5E9"/>
      <text x="349" y="695" text-anchor="middle">JOIN</text>
      <rect x="426" y="660" width="122" height="52" rx="26" fill="#0F2233" stroke="#0EA5E9"/>
      <text x="487" y="695" text-anchor="middle">BEGIN</text>
      <rect x="564" y="660" width="176" height="52" rx="26" fill="#0F2233" stroke="#0EA5E9"/>
      <text x="652" y="695" text-anchor="middle">GROUP BY</text>
    </g>
  </g>

  <!-- Tables -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="900" y="160" width="250" height="210" rx="14" fill="#13121C" stroke="#2C3445" stroke-width="2"/>
    <rect x="900" y="160" width="250" height="52" rx="14" fill="#16243A"/>
    <rect x="900" y="196" width="250" height="16" fill="#16243A"/>
    <text x="924" y="194" font-size="22" font-weight="700" fill="#7DD3FC">courses</text>
    <text x="924" y="246" font-size="20" fill="#F4F2F8">course_id  PK</text>
    <text x="924" y="284" font-size="20" fill="#B8B2C8">title</text>
    <text x="924" y="322" font-size="20" fill="#B8B2C8">level</text>

    <rect x="1220" y="160" width="290" height="250" rx="14" fill="#13121C" stroke="#2C3445" stroke-width="2"/>
    <rect x="1220" y="160" width="290" height="52" rx="14" fill="#16243A"/>
    <rect x="1220" y="196" width="290" height="16" fill="#16243A"/>
    <text x="1244" y="194" font-size="22" font-weight="700" fill="#7DD3FC">enrollments</text>
    <text x="1244" y="246" font-size="20" fill="#F4F2F8">user_id    PK, FK</text>
    <text x="1244" y="284" font-size="20" fill="#F4F2F8">course_id  PK, FK</text>
    <text x="1244" y="322" font-size="20" fill="#B8B2C8">status</text>
    <text x="1244" y="360" font-size="20" fill="#B8B2C8">enrolled_at</text>

    <path d="M1150 246 C1185 246 1185 280 1218 280" stroke="#7DD3FC" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="900" y="470" width="610" height="96" rx="10" fill="#2A1418" stroke="#F2555A"/>
    <text x="924" y="508" font-size="20" fill="#F2A3A6">INSERT INTO enrollments VALUES (42, 7, ...)</text>
    <text x="924" y="544" font-size="20" fill="#F2A3A6">-- second request, 12 ms later</text>
    <path d="M1205 570 C1205 600 1205 610 1205 626" stroke="#7DD3FC" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="900" y="632" width="610" height="72" rx="10" fill="#10241A" stroke="#3DBE7B"/>
    <text x="924" y="676" font-size="20" fill="#9FE3BF">ON CONFLICT DO NOTHING: one row, not two</text>
  </g>
</svg>
