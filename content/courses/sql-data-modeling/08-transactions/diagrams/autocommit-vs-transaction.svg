<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">One request, two rows: saved together or not at all.</text>
  <text x="40" y="82" font-size="16" fill="#475569">The same enroll request from the iOS app, where the second insert breaks the CHECK on source.</text>

  <!-- Left: autocommit -->
  <rect x="40" y="112" width="545" height="300" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="146" font-size="18" font-weight="700" fill="#b91c1c">Before: autocommit</text>
  <text x="64" y="170" font-size="13" fill="#64748b">each statement is its own transaction</text>

  <rect x="64" y="186" width="497" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="212" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">INSERT enrollments (2, 10)   -&gt; committed</text>
  <rect x="64" y="234" width="497" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="260" font-size="15" fill="#b91c1c" font-family="Consolas, 'Courier New', monospace">INSERT event source='ios'   -&gt; CHECK fails</text>
  <rect x="64" y="282" width="497" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="308" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">nothing undoes the first insert</text>
  <text x="64" y="356" font-size="15" font-weight="700" fill="#b91c1c">Enrollment saved, event missing</text>
  <text x="64" y="380" font-size="13" fill="#64748b">the course shows in My Courses, but no welcome</text>
  <text x="64" y="398" font-size="13" fill="#64748b">email and no analytics: half a business fact</text>

  <!-- Right: one transaction -->
  <rect x="615" y="112" width="545" height="300" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="146" font-size="18" font-weight="700" fill="#15803d">After: one transaction</text>
  <text x="639" y="170" font-size="13" fill="#64748b">BEGIN ... COMMIT, ROLLBACK on any error</text>

  <rect x="639" y="186" width="497" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="212" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">BEGIN</text>
  <rect x="639" y="234" width="497" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="260" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">INSERT enrollments (2, 10)   -&gt; pending</text>
  <rect x="639" y="282" width="497" height="40" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="655" y="308" font-size="15" fill="#334155" font-family="Consolas, 'Courier New', monospace">INSERT event source='ios'   -&gt; CHECK fails</text>
  <rect x="639" y="330" width="497" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="356" font-size="15" fill="#15803d" font-family="Consolas, 'Courier New', monospace">ROLLBACK                    -&gt; nothing kept</text>
  <text x="639" y="396" font-size="13" fill="#64748b">on success, COMMIT saves both rows in one step; a failed request can be retried</text>

  <!-- ACID -->
  <text x="40" y="452" font-size="18" font-weight="700" fill="#334155">ACID in plain words</text>
  <rect x="40" y="470" width="260" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="498" font-size="15" font-weight="700" fill="#15803d">Atomicity</text>
  <text x="58" y="522" font-size="13" fill="#166534">all of the changes, or none:</text>
  <text x="58" y="540" font-size="13" fill="#166534">no half-written request</text>

  <rect x="320" y="470" width="260" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="338" y="498" font-size="15" font-weight="700" fill="#334155">Consistency</text>
  <text x="338" y="522" font-size="13" fill="#475569">declared constraints hold</text>
  <text x="338" y="540" font-size="13" fill="#475569">for every committed state</text>

  <rect x="600" y="470" width="260" height="92" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="618" y="498" font-size="15" font-weight="700" fill="#334155">Isolation</text>
  <text x="618" y="522" font-size="13" fill="#475569">others do not see your</text>
  <text x="618" y="540" font-size="13" fill="#475569">changes before COMMIT</text>

  <rect x="880" y="470" width="280" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="898" y="498" font-size="15" font-weight="700" fill="#b45309">Durability</text>
  <text x="898" y="522" font-size="13" fill="#92400e">once COMMIT returns, the change</text>
  <text x="898" y="540" font-size="13" fill="#92400e">survives a crash or power cut</text>
</svg>
