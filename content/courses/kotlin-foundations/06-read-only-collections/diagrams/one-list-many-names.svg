<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">A read-only List can still change under you</text>
  <text x="40" y="82" font-size="16" fill="#475569">List&lt;T&gt; only says what YOU may do with it. If someone else holds the MutableList behind it, they can still change it.</text>

  <!-- left: shared -->
  <text x="40" y="124" font-size="18" font-weight="700" fill="#991b1b">Release 4.16: one list, four names</text>
  <g font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">
    <rect x="40" y="148" width="230" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="56" y="176">store.items</text>
    <rect x="40" y="210" width="230" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="56" y="238">store.current (List)</text>
    <rect x="40" y="272" width="230" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="56" y="300">screen.lastRendered</text>
    <rect x="40" y="334" width="230" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="56" y="362">history[0], history[1]</text>
  </g>
  <rect x="350" y="206" width="220" height="112" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="366" y="234" font-size="14" font-weight="700" fill="#991b1b">one ArrayList</text>
  <text x="366" y="262" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">[Rau muong,</text>
  <text x="366" y="284" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">Trung ga ta]</text>
  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)">
    <path d="M270 170 C310 180 320 220 346 236"/>
    <path d="M270 232 H346"/>
    <path d="M270 294 H346"/>
    <path d="M270 356 C310 350 320 310 346 300"/>
  </g>
  <text x="40" y="416" font-size="14" fill="#334155">current != lastRendered compares the list with itself:</text>
  <text x="40" y="438" font-size="14" font-weight="700" fill="#991b1b">always equal, so the screen never redraws.</text>
  <text x="40" y="468" font-size="14" fill="#334155">undo(): items.clear() also clears every snapshot,</text>
  <text x="40" y="490" font-size="14" font-weight="700" fill="#991b1b">so "go back one step" restores an empty cart.</text>

  <path d="M610 110 V560" stroke="#e2e8f0" stroke-width="2"/>

  <!-- right: copies -->
  <text x="640" y="124" font-size="18" font-weight="700" fill="#166534">The fix: hand out and keep copies</text>
  <g font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#0f172a">
    <rect x="640" y="148" width="210" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="656" y="176">store.items</text>
    <rect x="900" y="148" width="260" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="916" y="176">[Rau muong, Trung ga ta]</text>

    <rect x="640" y="214" width="210" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="656" y="242">items.toList()</text>
    <rect x="900" y="214" width="260" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="916" y="242">[Rau muong, Trung ga ta]</text>

    <rect x="640" y="280" width="210" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="656" y="308">history[1]</text>
    <rect x="900" y="280" width="260" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="916" y="308">[Rau muong]</text>

    <rect x="640" y="346" width="210" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="656" y="374">history[0]</text>
    <rect x="900" y="346" width="260" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="916" y="374">[]</text>
  </g>
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowGreen)">
    <path d="M850 236 H896"/>
    <path d="M850 302 H896"/>
    <path d="M850 368 H896"/>
  </g>
  <path d="M850 170 H896" stroke="#ca8a04" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="640" y="430" font-size="14" fill="#334155">Each snapshot is its own list, frozen at the moment it was taken.</text>
  <text x="640" y="452" font-size="14" fill="#334155">A new cart is a new list, so != sees the difference and the</text>
  <text x="640" y="474" font-size="14" fill="#334155">screen redraws; undo restores exactly the previous step.</text>
  <text x="640" y="514" font-size="14" fill="#475569">Alternative: keep a var items: List&lt;String&gt; and replace it</text>
  <text x="640" y="536" font-size="14" fill="#475569">(items = items + item). Nothing is ever changed in place.</text>
</svg>
