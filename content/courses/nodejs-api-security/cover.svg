<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Node.js API security (requests filtered by a shield: BOLA, JWT, SSRF blocked). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121A17"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FA04E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5FA04E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8CC84B"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5FA04E"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <polygon points="158,146 204,172 204,224 158,250 112,224 112,172" fill="#5FA04E"/>
    <text x="158" y="213.64" text-anchor="middle" font-size="46" font-weight="800" fill="#0B0F18">N</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#8CC84B">TYPESCRIPT · AUTH DESIGN</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Auth &amp;</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Sessions</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Cookies · Rotation · Replay · Races</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#C7E8B8">
      <rect x="110" y="660" width="136" height="52" rx="26" fill="#17281A" stroke="#5FA04E"/>
      <text x="178" y="695" text-anchor="middle">authz</text>
      <rect x="262" y="660" width="107" height="52" rx="26" fill="#17281A" stroke="#5FA04E"/>
      <text x="315.5" y="695" text-anchor="middle">JWT</text>
      <rect x="385" y="660" width="121" height="52" rx="26" fill="#17281A" stroke="#5FA04E"/>
      <text x="445.5" y="695" text-anchor="middle">CSRF</text>
      <rect x="522" y="660" width="207" height="52" rx="26" fill="#17281A" stroke="#5FA04E"/>
      <text x="625.5" y="695" text-anchor="middle">rate limit</text>
    </g>
  </g>

  <!-- Attack requests stop at the guard; legitimate ones reach the API -->
  <g id="art">
    <text x="900" y="246" font-family="Consolas, Menlo, monospace" font-size="20" letter-spacing="3" fill="#8CC84B" text-anchor="start">REQUESTS</text>
    <path d="M1196 262 H1276 L1270 620 L1236 668 L1202 620z" fill="#5FA04E" fill-opacity="0.18" stroke="#5FA04E" stroke-width="4"/>
    <rect x="1218" y="436" width="40" height="34" rx="6" fill="#8CC84B"/>
    <path d="M1226 436 V422 a12 12 0 0 1 24 0 V436" fill="none" stroke="#8CC84B" stroke-width="6"/>
    <text x="900" y="288" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F4F2F8" >GET /orders/42</text>
    <path d="M900 300 H1300" stroke="#8CC84B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="900" y="368" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F2555A" >alg: none</text>
    <path d="M900 380 H1150" stroke="#F2555A" stroke-width="4" stroke-linecap="round" />
    <path d="M1162 368 l24 24 M1186 368 l-24 24" stroke="#F2555A" stroke-width="5" stroke-linecap="round"/>
    <text x="900" y="448" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F2555A" >PATCH { role }</text>
    <path d="M900 460 H1150" stroke="#F2555A" stroke-width="4" stroke-linecap="round" />
    <path d="M1162 448 l24 24 M1186 448 l-24 24" stroke="#F2555A" stroke-width="5" stroke-linecap="round"/>
    <text x="900" y="528" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F4F2F8" >GET /me</text>
    <path d="M900 540 H1300" stroke="#8CC84B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="900" y="608" font-family="Consolas, Menlo, monospace" font-size="20" fill="#F2555A" >url=169.254…</text>
    <path d="M900 620 H1150" stroke="#F2555A" stroke-width="4" stroke-linecap="round" />
    <path d="M1162 608 l24 24 M1186 608 l-24 24" stroke="#F2555A" stroke-width="5" stroke-linecap="round"/>
    <rect x="1310" y="262" width="220" height="380" rx="18" fill="#151C18" stroke="#2E4A2C" stroke-width="2"/>
    <text x="1420" y="312" font-family="Consolas, Menlo, monospace" font-size="30" fill="#F4F2F8" text-anchor="middle" font-weight="700">API</text>
    <text x="1420" y="440" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" text-anchor="middle">owner check</text>
    <text x="1420" y="476" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" text-anchor="middle">allow-list</text>
    <text x="1420" y="512" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" text-anchor="middle">rate limit</text>
  </g>
</svg>
