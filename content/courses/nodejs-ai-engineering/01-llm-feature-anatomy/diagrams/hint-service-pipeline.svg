<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">One hint request, six steps</text>
  <text x="40" y="76" font-size="16" fill="#475569">Each step is plain, testable code - and each one has its own way to fail.</text>

  <!-- server boundary -->
  <rect x="221" y="94" width="946" height="144" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="233" y="112" font-size="13" font-weight="700" fill="#64748b">CodeDev server (API key lives here only)</text>

  <!-- step boxes -->
  <g>
    <rect x="35" y="122" width="170" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="50" y="150" font-size="15" font-weight="700" fill="#1e3a8a">Browser</text>
    <text x="50" y="176" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">POST /challenges/</text>
    <text x="50" y="194" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">  :id/hints</text>
    <text x="50" y="212" font-size="13" fill="#64748b">level, code, testOutput</text>

    <rect x="233" y="122" width="148" height="100" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="246" y="150" font-size="15" font-weight="700" fill="#0f172a">1 Check request</text>
    <text x="246" y="176" font-size="13" fill="#334155">signed in, enrolled</text>
    <text x="246" y="196" font-size="13" fill="#334155">level 1-3, size cap</text>

    <rect x="401" y="122" width="148" height="100" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="414" y="150" font-size="15" font-weight="700" fill="#0f172a">2 Context +</text>
    <text x="414" y="170" font-size="15" font-weight="700" fill="#0f172a">3 Template</text>
    <text x="414" y="194" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">hint.v3</text>
    <text x="414" y="212" font-size="13" fill="#334155">named variables</text>

    <rect x="569" y="122" width="190" height="100" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="582" y="150" font-size="15" font-weight="700" fill="#0f172a">4 Gateway</text>
    <text x="582" y="176" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">llm.complete(...)</text>
    <text x="582" y="196" font-size="13" fill="#334155">model-large, timeout,</text>
    <text x="582" y="214" font-size="13" fill="#334155">maxTokens</text>

    <rect x="779" y="122" width="182" height="100" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="792" y="150" font-size="15" font-weight="700" fill="#0f172a">5 Validate JSON</text>
    <text x="792" y="176" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">{ level, hint,</text>
    <text x="792" y="194" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#334155">  references }</text>

    <rect x="981" y="122" width="170" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="994" y="150" font-size="15" font-weight="700" fill="#15803d">6 Respond</text>
    <text x="994" y="176" font-size="13" fill="#334155">200 + the contract</text>
    <text x="994" y="196" font-size="13" fill="#334155">or the static hint</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="205" y1="172" x2="231" y2="172"/>
    <line x1="381" y1="172" x2="399" y2="172"/>
    <line x1="549" y1="172" x2="567" y2="172"/>
    <line x1="759" y1="172" x2="777" y2="172"/>
    <line x1="961" y1="172" x2="979" y2="172"/>
  </g>

  <!-- failure labels -->
  <g font-size="13">
    <rect x="35" y="256" width="170" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="48" y="280" font-weight="700" fill="#b91c1c">Key in the bundle</text>
    <text x="48" y="300" fill="#991b1b">browser calls provider</text>
    <text x="48" y="332" fill="#64748b">this lesson</text>

    <rect x="233" y="256" width="148" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="246" y="280" font-weight="700" fill="#b91c1c">Injection</text>
    <text x="246" y="300" fill="#991b1b">instructions hidden</text>
    <text x="246" y="318" fill="#991b1b">in learner code</text>
    <text x="246" y="340" fill="#64748b">lessons 5, 10</text>

    <rect x="401" y="256" width="148" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="414" y="280" font-weight="700" fill="#b91c1c">Unversioned</text>
    <text x="414" y="300" fill="#991b1b">no id, no changelog</text>
    <text x="414" y="332" fill="#64748b">lesson 2</text>

    <rect x="569" y="256" width="190" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="582" y="280" font-weight="700" fill="#b91c1c">Latency and cost</text>
    <text x="582" y="300" fill="#991b1b">3-9 s per hint,</text>
    <text x="582" y="318" fill="#991b1b">tokens never logged</text>
    <text x="582" y="340" fill="#64748b">lessons 6-8</text>

    <rect x="779" y="256" width="182" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="792" y="280" font-weight="700" fill="#b91c1c">Broken format</text>
    <text x="792" y="300" fill="#991b1b">prose, missing field,</text>
    <text x="792" y="318" fill="#991b1b">level 4</text>
    <text x="792" y="340" fill="#64748b">lessons 3-4</text>

    <rect x="981" y="256" width="170" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="994" y="280" font-weight="700" fill="#b91c1c">Hint = solution</text>
    <text x="994" y="300" fill="#991b1b">output not checked</text>
    <text x="994" y="332" fill="#64748b">lesson 10</text>
  </g>

  <!-- bottom row -->
  <rect x="35" y="384" width="500" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="52" y="412" font-size="15" font-weight="700" fill="#0f172a">Secrets</text>
  <text x="52" y="436" font-size="13" fill="#334155">The key is read by the gateway from a server-side environment</text>
  <text x="52" y="456" font-size="13" fill="#334155">variable. The browser only ever calls POST /challenges/:id/hints.</text>

  <rect x="569" y="384" width="392" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="586" y="412" font-size="15" font-weight="700" fill="#15803d">In tests: a fake LLM</text>
  <text x="586" y="436" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#166534">createFakeLlm(script)</text>
  <text x="586" y="456" font-size="13" fill="#166534">replays recorded answers in place of llm.complete:</text>
  <text x="586" y="474" font-size="13" fill="#166534">no network, no key, same result every run</text>

  <rect x="981" y="384" width="170" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="994" y="412" font-size="15" font-weight="700" fill="#b45309">Fallback</text>
  <text x="994" y="436" font-size="13" fill="#92400e">static hint for the</text>
  <text x="994" y="456" font-size="13" fill="#92400e">level, on error or</text>
  <text x="994" y="474" font-size="13" fill="#92400e">invalid answer</text>

  <!-- footer -->
  <text x="40" y="528" font-size="16" font-weight="700" fill="#334155">One log line per request</text>
  <text x="40" y="556" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#334155">{ challengeId, template: "hint.v3", model, ms, inputTokens, outputTokens, source }</text>
</svg>
