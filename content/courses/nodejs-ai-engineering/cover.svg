<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: AI engineering with Node.js (streamed tokens, a tool call with JSON result, token budget). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121A17"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FA04E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5FA04E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8CC84B"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5FA04E"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <polygon points="158,146 204,172 204,224 158,250 112,224 112,172" fill="#5FA04E"/>
    <text x="158" y="213.64" text-anchor="middle" font-size="46" font-weight="800" fill="#0B0F18">N</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#8CC84B">TYPESCRIPT · LLM FEATURES</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">LLM Features</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">in TypeScript</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Structured output · Tool calling · Streaming</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#C7E8B8">
      <rect x="110" y="660" width="150" height="52" rx="26" fill="#17281A" stroke="#5FA04E"/>
      <text x="185" y="695" text-anchor="middle">stream</text>
      <rect x="276" y="660" width="193" height="52" rx="26" fill="#17281A" stroke="#5FA04E"/>
      <text x="372.5" y="695" text-anchor="middle">tool_call</text>
      <rect x="485" y="660" width="221" height="52" rx="26" fill="#17281A" stroke="#5FA04E"/>
      <text x="595.5" y="695" text-anchor="middle">JSON schema</text>
    </g>
  </g>

  <!-- A streamed answer that calls a tool, gets JSON back and stays within the token budget -->
  <g id="art">
    <rect x="1210" y="236" width="320" height="64" rx="20" fill="#17281A" stroke="#5FA04E" stroke-width="2"/>
    <text x="1370" y="276" font-family="Consolas, Menlo, monospace" font-size="22" fill="#F4F2F8" text-anchor="middle">Where is order 42?</text>
    <rect x="900" y="330" width="540" height="104" rx="20" fill="#151C18" stroke="#2E4A2C" stroke-width="2"/>
    <text x="924" y="366" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="3" fill="#8CC84B" text-anchor="start">STREAMING</text>
    <rect x="924" y="384" width="62" height="26" rx="13" fill="#8CC84B" fill-opacity="0.8"/>
    <rect x="996" y="384" width="44" height="26" rx="13" fill="#8CC84B" fill-opacity="0.8"/>
    <rect x="1050" y="384" width="80" height="26" rx="13" fill="#8CC84B" fill-opacity="0.8"/>
    <rect x="1140" y="384" width="52" height="26" rx="13" fill="#8CC84B" fill-opacity="0.8"/>
    <rect x="1202" y="384" width="70" height="26" rx="13" fill="#8CC84B" fill-opacity="0.8"/>
    <rect x="1282" y="384" width="36" height="26" rx="13" fill="#8CC84B" fill-opacity="0.25"/>
    <rect x="1328" y="384" width="58" height="26" rx="13" fill="#8CC84B" fill-opacity="0.25"/>
    <rect x="1396" y="384" width="4" height="26" fill="#8CC84B"/>
    <rect x="900" y="470" width="300" height="96" rx="14" fill="#151C18" stroke="#5FA04E" stroke-width="2"/>
    <text x="922" y="504" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="3" fill="#8CC84B" text-anchor="start">TOOL CALL</text>
    <text x="922" y="544" font-family="Consolas, Menlo, monospace" font-size="22" fill="#F4F2F8" >getOrder({ id: 42 })</text>
    <path d="M1204 518 H1262" stroke="#8CC84B" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1270" y="470" width="260" height="96" rx="14" fill="#151C18" stroke="#2E4A2C" stroke-width="2"/>
    <text x="1292" y="510" font-family="Consolas, Menlo, monospace" font-size="22" fill="#C3E88D" >{ "status":</text>
    <text x="1292" y="544" font-family="Consolas, Menlo, monospace" font-size="22" fill="#C3E88D" >  "shipped" }</text>
    <text x="900" y="620" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="3" fill="#8CC84B" text-anchor="start">TOKEN BUDGET</text>
    <rect x="900" y="636" width="630" height="20" rx="10" fill="#151C18" stroke="#2E4A2C"/>
    <rect x="900" y="636" width="452" height="20" rx="10" fill="#5FA04E"/>
    <text x="1530" y="620" font-family="Consolas, Menlo, monospace" font-size="20" fill="#B8B2C8" text-anchor="end">2,940 / 4,096</text>
  </g>
</svg>
