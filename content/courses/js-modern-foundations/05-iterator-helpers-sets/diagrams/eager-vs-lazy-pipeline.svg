<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Eager arrays vs lazy iterators: "export the first 50 admins"</text>
  <text x="40" y="82" font-size="16" fill="#475569">An array step finishes the whole list before the next step starts. An iterator step hands over one value at a time, on request.</text>

  <!-- Eager lane -->
  <text x="40" y="130" font-size="18" font-weight="700" fill="#b91c1c">Eager: [...users].filter(isAdmin).slice(0, 50)</text>

  <rect x="40" y="148" width="230" height="96" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="155" y="182" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">users()</text>
  <text x="155" y="206" font-size="13" text-anchor="middle" fill="#475569">generator, 2,000,000 rows</text>
  <text x="155" y="228" font-size="13" text-anchor="middle" fill="#475569">read to the end</text>

  <line x1="272" y1="196" x2="318" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="320" y="148" width="250" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="445" y="182" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">[...users]</text>
  <text x="445" y="206" font-size="13" text-anchor="middle" fill="#b91c1c">2,000,000 objects in memory</text>
  <text x="445" y="228" font-size="13" text-anchor="middle" fill="#b91c1c">heap limit reached here</text>

  <line x1="572" y1="196" x2="618" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="620" y="148" width="250" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="745" y="182" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">.filter(isAdmin)</text>
  <text x="745" y="206" font-size="13" text-anchor="middle" fill="#b91c1c">a second array: every admin</text>
  <text x="745" y="228" font-size="13" text-anchor="middle" fill="#b91c1c">2,000,000 calls</text>

  <line x1="872" y1="196" x2="918" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="920" y="148" width="240" height="96" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1040" y="182" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">.slice(0, 50)</text>
  <text x="1040" y="206" font-size="13" text-anchor="middle" fill="#475569">keeps 50, drops the rest</text>
  <text x="1040" y="228" font-size="13" text-anchor="middle" fill="#475569">(if it ever gets here)</text>

  <!-- Lazy lane -->
  <text x="40" y="314" font-size="18" font-weight="700" fill="#0e7490">Lazy: users.filter(isAdmin).take(50).toArray()</text>

  <text x="1160" y="344" font-size="14" font-weight="600" text-anchor="end" fill="#b45309">next() - toArray pulls, each step asks the one to its left</text>
  <line x1="1160" y1="354" x2="44" y2="354" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="40" y="370" width="230" height="96" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="155" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">users()</text>
  <text x="155" y="428" font-size="13" text-anchor="middle" fill="#0e7490">yields one row per next()</text>
  <text x="155" y="450" font-size="13" text-anchor="middle" fill="#0e7490">only 350 rows read</text>

  <rect x="320" y="370" width="250" height="96" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="445" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">.filter(isAdmin)</text>
  <text x="445" y="428" font-size="13" text-anchor="middle" fill="#6d28d9">keeps pulling until a match</text>
  <text x="445" y="450" font-size="13" text-anchor="middle" fill="#6d28d9">then hands it on</text>

  <rect x="620" y="370" width="250" height="96" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="745" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">.take(50)</text>
  <text x="745" y="428" font-size="13" text-anchor="middle" fill="#6d28d9">after 50 values: return()</text>
  <text x="745" y="450" font-size="13" text-anchor="middle" fill="#6d28d9">closes the whole chain</text>

  <rect x="920" y="370" width="240" height="96" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1040" y="404" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">.toArray()</text>
  <text x="1040" y="428" font-size="13" text-anchor="middle" fill="#166534">50 users in memory</text>
  <text x="1040" y="450" font-size="13" text-anchor="middle" fill="#166534">finished in milliseconds</text>

  <line x1="44" y1="484" x2="1160" y2="484" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="44" y="508" font-size="14" font-weight="600" fill="#0e7490">{ value, done } - one user at a time travels to the right</text>

  <!-- Footer -->
  <rect x="40" y="530" width="1120" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="560" font-size="15" text-anchor="middle" fill="#334155">With 1 admin in every 7 users, 50 admins need 350 rows: lazy reads 0.02% of the table, eager reads all of it first.</text>
</svg>
