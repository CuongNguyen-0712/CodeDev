<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Course cover: Modern JavaScript on Node 24 (equality, immutability, Sets, error cause). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17160D"/>
      <stop offset="0.55" stop-color="#110F16"/>
      <stop offset="1" stop-color="#0D0B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7DF1E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F7DF1E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFF0A0"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F7DF1E"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6A80"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2555A"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F2C14E"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Copy -->
  <g id="copy" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="112" y="152" width="92" height="92" rx="20" fill="#F7DF1E"/>
    <text x="194" y="232" text-anchor="end" font-size="40" font-weight="800" fill="#17160D">JS</text>
    <text x="110" y="330" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="600" letter-spacing="6" fill="#FFF0A0">JAVASCRIPT · NODE 24</text>
    <text x="106" y="430" font-size="80" font-weight="800" fill="#F4F2F8">Modern JS</text>
    <text x="106" y="530" font-size="80" font-weight="800" fill="#F4F2F8">Fundamentals</text>
    <text x="110" y="600" font-size="34" font-weight="500" fill="#B8B2C8">Values · Closures · Modules · Dates · Errors</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#FBF1B4">
      <rect x="110" y="660" width="107" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="163.5" y="695" text-anchor="middle">===</text>
      <rect x="233" y="660" width="107" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="286.5" y="695" text-anchor="middle">Set</text>
      <rect x="356" y="660" width="150" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="431" y="695" text-anchor="middle">import</text>
      <rect x="522" y="660" width="193" height="52" rx="26" fill="#26230F" stroke="#F7DF1E"/>
      <text x="618.5" y="695" text-anchor="middle">node:test</text>
    </g>
  </g>

  <!-- The small production bugs the lessons start from, with their fixes -->
  <g id="art">
    <rect x="900" y="236" width="630" height="300" rx="18" fill="#1B1A12" stroke="#4A4420" stroke-width="2"/>
    <rect x="900" y="236" width="630" height="44" rx="18" fill="#4A4420" fill-opacity="0.45"/>
    <rect x="900" y="262" width="630" height="18" fill="#4A4420" fill-opacity="0.45"/>
    <circle cx="926" cy="258" r="7" fill="#F2555A" fill-opacity="0.8"/>
    <circle cx="950" cy="258" r="7" fill="#F2C14E" fill-opacity="0.8"/>
    <circle cx="974" cy="258" r="7" fill="#3DBE7B" fill-opacity="0.8"/>
    <text x="1506" y="265" font-family="Consolas, Menlo, monospace" font-size="18" fill="#B8B2C8" text-anchor="end">cart.mjs</text>
    <text x="934" y="328" font-family="Consolas, Menlo, monospace" font-size="24" xml:space="preserve"><tspan fill="#F78C6C">0.1 </tspan><tspan fill="#E8E4F2">+ </tspan><tspan fill="#F78C6C">0.2</tspan><tspan fill="#E8E4F2"> === </tspan><tspan fill="#F78C6C">0.3</tspan><tspan fill="#6F6A80">  // false</tspan></text>
    <text x="934" y="374" font-family="Consolas, Menlo, monospace" font-size="24" xml:space="preserve"><tspan fill="#C792EA">const </tspan><tspan fill="#E8E4F2">ids = </tspan><tspan fill="#C792EA">new </tspan><tspan fill="#82AAFF">Set</tspan><tspan fill="#E8E4F2">(orders.</tspan><tspan fill="#82AAFF">map</tspan><tspan fill="#E8E4F2">(o =&gt; o.id));</tspan></text>
    <text x="934" y="420" font-family="Consolas, Menlo, monospace" font-size="24" xml:space="preserve"><tspan fill="#C792EA">const </tspan><tspan fill="#E8E4F2">cart = </tspan><tspan fill="#82AAFF">Object</tspan><tspan fill="#E8E4F2">.</tspan><tspan fill="#82AAFF">freeze</tspan><tspan fill="#E8E4F2">({ ...items });</tspan></text>
    <text x="934" y="466" font-family="Consolas, Menlo, monospace" font-size="24" xml:space="preserve"><tspan fill="#C792EA">import </tspan><tspan fill="#E8E4F2">{ test } </tspan><tspan fill="#C792EA">from </tspan><tspan fill="#C3E88D">"node:test"</tspan><tspan fill="#E8E4F2">;</tspan></text>
    <text x="934" y="512" font-family="Consolas, Menlo, monospace" font-size="24" xml:space="preserve"><tspan fill="#C792EA">throw new </tspan><tspan fill="#82AAFF">Error</tspan><tspan fill="#E8E4F2">(</tspan><tspan fill="#C3E88D">"load"</tspan><tspan fill="#E8E4F2">, { cause });</tspan></text>
    <rect x="1360" y="604" width="170" height="52" rx="26" fill="#3DBE7B" fill-opacity="0.16" stroke="#3DBE7B" stroke-width="2"/>
    <text x="1445" y="638" font-family="Consolas, Menlo, monospace" font-size="22" fill="#3DBE7B" text-anchor="middle">8 passing</text>
  </g>
</svg>
