<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Link every import, then evaluate each module once, dependencies first</text>
  <text x="40" y="82" font-size="16" fill="#475569">In a cycle, the module you reach first runs last, so its partner can read its bindings before they exist.</text>

  <!-- Before panel -->
  <rect x="40" y="100" width="540" height="400" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="60" y="128" font-size="17" font-weight="700" fill="#b91c1c">Before: config.js and db.js import each other</text>

  <rect x="230" y="144" width="150" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="305" y="172" font-size="15" text-anchor="middle" fill="#334155">server.js</text>
  <rect x="80" y="244" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="165" y="272" font-size="15" text-anchor="middle" fill="#334155">config.js</text>
  <rect x="370" y="244" width="170" height="44" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="455" y="272" font-size="15" text-anchor="middle" fill="#b91c1c">db.js</text>

  <line x1="270" y1="188" x2="195" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="196" y="214" font-size="12" text-anchor="end" fill="#64748b">1st import</text>
  <line x1="340" y1="188" x2="415" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="414" y="214" font-size="12" fill="#64748b">2nd import</text>
  <line x1="250" y1="258" x2="368" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="250" font-size="12" text-anchor="middle" fill="#64748b">getOverrides</text>
  <line x1="370" y1="276" x2="252" y2="276" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="310" y="302" font-size="12" text-anchor="middle" fill="#b91c1c">config (cycle)</text>

  <text x="60" y="336" font-size="15" font-weight="700" fill="#334155">Production start: node server.js</text>
  <text x="60" y="360" font-size="13" fill="#334155">1. server.js reaches config.js first, config.js reaches db.js</text>
  <text x="60" y="382" font-size="13" fill="#334155">2. db.js imports config.js: already in progress, so the cycle is skipped</text>
  <text x="60" y="404" font-size="13" fill="#334155">3. db.js has no other dependency, so its body runs first</text>
  <text x="60" y="426" font-size="13" fill="#334155">4. it reads config.databaseUrl while config is still uninitialized</text>
  <rect x="60" y="440" width="500" height="44" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="310" y="467" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">ReferenceError: Cannot access 'config' before initialization</text>

  <!-- After panel -->
  <rect x="620" y="100" width="540" height="400" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="640" y="128" font-size="17" font-weight="700" fill="#15803d">After: config.js is a leaf, no cycle</text>

  <rect x="815" y="144" width="150" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="890" y="172" font-size="15" text-anchor="middle" fill="#334155">server.js</text>
  <rect x="660" y="224" width="150" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="735" y="252" font-size="15" text-anchor="middle" fill="#334155">settings.js</text>
  <rect x="970" y="224" width="150" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1045" y="252" font-size="15" text-anchor="middle" fill="#334155">db.js</text>
  <rect x="815" y="304" width="150" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="890" y="332" font-size="15" text-anchor="middle" fill="#15803d">config.js</text>

  <line x1="855" y1="188" x2="770" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="925" y1="188" x2="1010" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="246" x2="968" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="268" x2="855" y2="302" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="1010" y1="268" x2="925" y2="302" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <text x="640" y="380" font-size="15" font-weight="700" fill="#334155">Evaluation order, for every entry point</text>
  <text x="640" y="404" font-size="14" font-weight="700" fill="#15803d">config.js  →  db.js  →  settings.js  →  server.js</text>
  <text x="640" y="430" font-size="13" fill="#334155">config.js imports nothing from the app. Its top-level await pauses</text>
  <text x="640" y="452" font-size="13" fill="#334155">every module that depends on it until the secrets are loaded,</text>
  <text x="640" y="474" font-size="13" fill="#334155">so db.js always reads a finished config.</text>

  <!-- Key -->
  <rect x="40" y="520" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="545" font-size="13" fill="#334155"><tspan font-weight="700">Link:</tspan> all imports are resolved before any code runs; bindings exist but are uninitialized (TDZ).</text>
  <text x="60" y="567" font-size="13" fill="#334155"><tspan font-weight="700">Evaluate:</tspan> depth-first, dependencies before importers; each module body runs exactly once, then it is cached.</text>
</svg>
