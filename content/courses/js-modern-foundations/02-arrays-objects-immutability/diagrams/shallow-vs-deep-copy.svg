<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a">Spread copies one level, structuredClone copies everything</text>
  <text x="40" y="82" font-size="16" fill="#475569">An object or array value is a reference to one thing in memory. Copying the reference does not copy the thing.</text>

  <!-- Left: spread -->
  <rect x="40" y="108" width="540" height="300" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="140" font-size="18" font-weight="700" fill="#b91c1c">const copy = { ...order, id: "A-1002" }</text>
  <text x="64" y="162" font-size="13" fill="#7f1d1d">shallow: new outer object, same nested items array</text>

  <rect x="64" y="186" width="190" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="210" font-size="15" font-weight="700" fill="#334155">order</text>
  <text x="80" y="232" font-size="13" fill="#475569">id: "A-1001"</text>
  <text x="80" y="252" font-size="13" fill="#475569">items: ●</text>

  <rect x="64" y="300" width="190" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="324" font-size="15" font-weight="700" fill="#334155">copy</text>
  <text x="80" y="346" font-size="13" fill="#475569">id: "A-1002"</text>
  <text x="80" y="366" font-size="13" fill="#475569">items: ●</text>

  <rect x="350" y="236" width="206" height="96" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="366" y="262" font-size="15" font-weight="700" fill="#b91c1c">items (ONE array)</text>
  <text x="366" y="286" font-size="13" fill="#334155">[0] { sku: "MUG", qty: 5 }</text>
  <text x="366" y="310" font-size="13" fill="#334155">[1] { sku: "TEE", qty: 1 }</text>

  <path d="M150 248 L300 248 L300 270 L338 270" fill="none" stroke="#dc2626" stroke-width="2"/>
  <polygon points="336,264 336,276 348,270" fill="#dc2626"/>
  <path d="M150 362 L300 362 L300 300 L338 300" fill="none" stroke="#dc2626" stroke-width="2"/>
  <polygon points="336,294 336,306 348,300" fill="#dc2626"/>
  <text x="350" y="362" font-size="13" font-weight="700" fill="#b91c1c">copy.items[0].qty = 5</text>
  <text x="350" y="382" font-size="13" fill="#7f1d1d">also changes order.items[0].qty</text>

  <!-- Right: structuredClone -->
  <rect x="620" y="108" width="540" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="140" font-size="18" font-weight="700" fill="#15803d">const copy = structuredClone(order)</text>
  <text x="644" y="162" font-size="13" fill="#14532d">deep: every nested object and array is new</text>

  <rect x="644" y="186" width="190" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="660" y="210" font-size="15" font-weight="700" fill="#334155">order</text>
  <text x="660" y="232" font-size="13" fill="#475569">id: "A-1001"</text>
  <text x="660" y="252" font-size="13" fill="#475569">items: ●</text>

  <rect x="644" y="300" width="190" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="660" y="324" font-size="15" font-weight="700" fill="#334155">copy</text>
  <text x="660" y="346" font-size="13" fill="#475569">id: "A-1002"</text>
  <text x="660" y="366" font-size="13" fill="#475569">items: ●</text>

  <rect x="930" y="186" width="206" height="78" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="946" y="212" font-size="14" font-weight="700" fill="#15803d">items (original)</text>
  <text x="946" y="236" font-size="13" fill="#334155">[0] { sku: "MUG", qty: 2 }</text>
  <text x="946" y="256" font-size="13" fill="#64748b">[1] ...</text>

  <rect x="930" y="300" width="206" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="946" y="326" font-size="14" font-weight="700" fill="#15803d">items (clone)</text>
  <text x="946" y="350" font-size="13" fill="#334155">[0] { sku: "MUG", qty: 5 }</text>
  <text x="946" y="370" font-size="13" fill="#64748b">[1] ...</text>

  <line x1="735" y1="248" x2="918" y2="225" stroke="#16a34a" stroke-width="2"/>
  <polygon points="916,219 917,231 929,224" fill="#16a34a"/>
  <line x1="735" y1="362" x2="918" y2="339" stroke="#16a34a" stroke-width="2"/>
  <polygon points="916,333 917,345 929,338" fill="#16a34a"/>

  <!-- Bottom: arrays -->
  <rect x="40" y="436" width="1120" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="468" font-size="16" font-weight="700" fill="#334155">The same rule for arrays</text>
  <text x="64" y="500" font-size="14" fill="#b91c1c" font-weight="700">orders.sort(byTotal)</text>
  <text x="290" y="500" font-size="14" fill="#334155">sorts in place and returns the SAME array: the table that renders orders is reordered too</text>
  <text x="64" y="530" font-size="14" fill="#15803d" font-weight="700">orders.toSorted(byTotal)</text>
  <text x="290" y="530" font-size="14" fill="#334155">returns a NEW sorted array; also toReversed(), toSpliced(), with(i, v), map, filter</text>
  <text x="64" y="552" font-size="12" fill="#64748b">structuredClone cannot copy functions (DataCloneError) and returns class instances as plain objects.</text>
</svg>
