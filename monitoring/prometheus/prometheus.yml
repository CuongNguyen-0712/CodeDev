# Uptime probes of the app through the blackbox exporter (docs/admin-panel-plan.md 6.3, G2).
# ?probe=live runs no query; /api/health runs one SELECT 1, so it is probed less often.
global:
  scrape_interval: 1m

scrape_configs:
  - job_name: app-live
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://host.docker.internal:3000/api/health?probe=live"]
        labels: { env: local }
    relabel_configs: &probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: app-health
    scrape_interval: 5m
    metrics_path: /probe
    params:
      module: [health_ok]
    static_configs:
      - targets: ["http://host.docker.internal:3000/api/health"]
        labels: { env: local }
    relabel_configs: *probe
