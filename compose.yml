# CodeDev: every container in one file. See docs/docker.md.
#
#   npm run services:up                     # dev: redis + minio + sandbox (+ loopback gateway) for `npm run dev`
#   npm run services:down
#   docker compose --env-file .env.local --profile db up -d postgres     # optional local PostgreSQL
#   npm run cms:up                          # local Payload CMS, fallback for lesson bodies (docs/payload-cms.md)
#   docker compose --env-file .env.production --profile app up -d --build  # production app container
#
# Images built here: codedev_app (./Dockerfile), codedev_sandbox (./sandbox/vercel/Dockerfile, target docker),
# codedev_cms (./cms/Dockerfile).
# Values are interpolated from the --env-file (or .env); no secret is baked into an image.
# Services reach each other by service name; only loopback ports are published, except the app.
name: codedev

x-hardened: &hardened
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # ------------------------------------------------------------------ cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------ object storage (development)
  # Production uses Neon S3 (AWS_* variables); the app container does not depend on MinIO.
  minio:
    profiles: [dev]
    # The official minio/minio images are no longer published; Chainguard builds MinIO from
    # source. Pinned by digest so every machine runs the same server. The image has no shell,
    # so it has no healthcheck; scripts/storage-sync.mjs and the app retry until it answers.
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    # Named volumes are created root-owned and the image has no shell to chown them.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # console
    volumes:
      - minio-data:/data
    networks: [backend]

  # ------------------------------------------------------------------ mail catcher (development)
  # Every email the app sends locally lands here instead of a real inbox while AGENTMAIL_API_KEY
  # and MAIL_PASSWORD are empty (lib/mailConfig.mjs): SMTP 127.0.0.1:1025, inbox at http://127.0.0.1:8025.
  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web inbox
    networks: [backend]

  # ------------------------------------------------------------------ background jobs (development)
  # Inngest dev server for `next dev` with INNGEST_DEV=1 (docs/queue-execution-plan.md); dashboard
  # at http://127.0.0.1:8288. The app sends events to :8288 and the dev server calls back
  # /api/inngest on the host. In-memory: runs are gone after a restart (functions sync again).
  inngest:
    profiles: [dev]
    image: inngest/inngest:v1.46.0
    restart: unless-stopped
    command: ["inngest", "dev", "--no-discovery", "-u", "http://host.docker.internal:${APP_DEV_PORT:-3000}/api/inngest"]
    ports:
      - "127.0.0.1:8288:8288"
    networks: [backend]

  # ------------------------------------------------------------------ optional local database
  # The usual setup is a natively installed PostgreSQL 18 on 5432; this one listens on 5433.
  postgres:
    profiles: [db]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codedev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Development-only default; the port is bound to loopback.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------ local CMS (lesson fallback)
  # Payload CMS with its own PostgreSQL. Local development only: the app asks it for a lesson body
  # when Sanity has none (lib/lessonContent.js). Values come from .env.local (CMS_* and PAYLOAD_SECRET).
  cms-db:
    profiles: [cms]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD in .env.local}
    # Loopback only: `npm --prefix cms run migrate:create` connects from the host.
    ports:
      - "127.0.0.1:${CMS_DB_PORT:-5434}:5432"
    volumes:
      - cms-db-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 3s
      retries: 10

  cms:
    profiles: [cms]
    build: ./cms
    image: codedev_cms
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      cms-db: { condition: service_healthy }
    environment:
      DATABASE_URI: postgres://payload:${CMS_DB_PASSWORD}@cms-db:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env.local}
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-}
      CMS_API_KEY: ${CMS_API_KEY:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-media}
    ports:
      - "127.0.0.1:${CMS_PORT:-3010}:3000"
    networks: [backend]

  # ------------------------------------------------------------------ code runner
  # Runs untrusted challenge code (docs/sandbox.md): javascript, python, c, cpp, java, go, rust, php, typescript, kotlin, csharp.
  # Internal network only: no route out of Docker, no published port, no app secrets (only its
  # own token).
  sandbox:
    <<: *hardened
    profiles: [dev, app]
    image: codedev_sandbox
    build:
      context: ./sandbox
      dockerfile: vercel/Dockerfile
      target: docker
    environment:
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}
      MAX_CONCURRENCY: ${CODE_RUNNER_CONCURRENCY:-2}
      MAX_QUEUE: ${CODE_RUNNER_QUEUE:-16}
    # run-job (root) runs learner code as the slot users run01..run08. These are all it needs:
    # spawn as another uid, chown and clean the slot's files, kill the slot's processes.
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/tmp:rw,noexec,nosuid,nodev,size=16m
      - /run:rw,noexec,nosuid,nodev,size=1m,mode=0755
      - /vercel/jobs:rw,noexec,nosuid,nodev,size=8m,mode=0700
      # Compiled programs run from the slot's work dir (Go jobs also keep their own build cache
      # entries there; the pre-built std cache is read in place from the image).
      - /work:rw,exec,nosuid,nodev,size=768m,mode=0711
    # Compilers and the JVM start many threads; run-job also caps each slot user at 64.
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    ulimits:
      nofile: { soft: 256, hard: 256 }
    networks: [sandbox]
    stop_grace_period: 15s

  # Forwards :4100 to sandbox:4100: for `next dev` on the host (CODE_RUNNER_URL=http://127.0.0.1:4100)
  # and for the app container (http://sandbox-gateway:4100). The app never joins the sandbox
  # network, so learner code cannot open connections to it; from there it reaches only this
  # forwarder, which leads back to the sandbox itself.
  sandbox-gateway:
    <<: *hardened
    profiles: [dev, app]
    image: codedev_sandbox
    command: ["node", "/opt/codedev/gateway.mjs"]
    user: ubuntu
    depends_on:
      sandbox:
        condition: service_healthy
    ports:
      - "127.0.0.1:4100:4100"
    # Two Node processes at times: the gateway and the image healthcheck (`node -e fetch(...)`).
    pids_limit: 32
    mem_limit: 192m
    networks: [sandbox, gateway]

  # ------------------------------------------------------------------ monitoring (docs/admin-panel-plan.md 6.2)
  #   npm run monitoring:up   -> Grafana at http://127.0.0.1:3001 (admin / GRAFANA_ADMIN_PASSWORD)
  # Grafana reads the database as the read-only grafana_ro (migration 20261101_009) and probes the
  # app through the blackbox exporter. Dashboards, data sources and alerts come from monitoring/.
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-mailpit:1025}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-grafana@codedev.local}
      GRAFANA_PG_HOST: ${GRAFANA_PG_HOST:-host.docker.internal:5432}
      GRAFANA_PG_DATABASE: ${GRAFANA_PG_DATABASE:-codedev}
      GRAFANA_PG_USER: ${GRAFANA_PG_USER:-grafana_ro}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-}
      GRAFANA_PG_SSLMODE: ${GRAFANA_PG_SSLMODE:-disable}
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-admin@codedev.local}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [backend, monitoring]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [blackbox-exporter]
    networks: [monitoring]

  blackbox-exporter:
    profiles: [monitoring]
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring]

  # ------------------------------------------------------------------ application (production build)
  app:
    profiles: [app]
    image: codedev_app
    build:
      context: .
      dockerfile: Dockerfile
      # Public values are inlined into the client bundle at build time.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-}
        NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-}
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Runtime configuration (database, auth, storage, ...) from an env file, never from the image.
    env_file:
      - path: .env
        required: false
      - path: ${CODEDEV_ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Cache in the redis service (overrides an Upstash REST URL/token from the env file).
      REDIS_URL: redis://redis:6379
      REDIS_TOKEN: ""
      CODE_RUNNER_URL: http://sandbox-gateway:4100
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}
      # Same value the sandbox gets as MAX_CONCURRENCY: the queue's per-sandbox concurrency limit.
      CODE_RUNNER_CONCURRENCY: ${CODE_RUNNER_CONCURRENCY:-2}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      sandbox-gateway:
        condition: service_started
    # Not on `sandbox`: Docker networks are not one-way, and learner code there could call the app.
    networks: [backend, gateway]
    healthcheck:
      # /api/health is 200 while PostgreSQL answers (cache/storage outages only degrade).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 20s

networks:
  backend: {}
  # No external connectivity: what runs in the sandbox cannot reach the internet, the host or
  # cloud metadata endpoints. Only the app (and the dev gateway) join it.
  sandbox:
    internal: true
  gateway: {}
  monitoring: {}

volumes:
  # Same volumes as the former docker-compose.yml / docker-compose.dev.yml: data is kept.
  redis-data:
    name: codedev_redis-data
  minio-data:
    name: codedev-dev_minio-data
  postgres-data:
    name: codedev_postgres-data
  cms-db-data:
    name: codedev_cms-db-data
  grafana-data:
    name: codedev_grafana-data
  prometheus-data:
    name: codedev_prometheus-data
